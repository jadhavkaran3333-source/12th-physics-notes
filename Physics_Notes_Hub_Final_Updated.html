notesData["9. Current Electricity"]=`
<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> The SI unit of electric current is:<br>(a) ampere (b) volt (c) ohm (d) coulomb<br><b>Ans:</b> (a) ampere</p>
<p><b>Q2.</b> Ohm's law is:<br>(a) V = IR (b) V = I/R (c) V = R/I (d) I = VR<br><b>Ans:</b> (a)</p>
<p><b>Q3.</b> Resistance is defined as:<br>(a) V/I (b) I/V (c) VI (d) V²/I<br><b>Ans:</b> (a) V/I</p>
<p><b>Q4.</b> SI unit of resistance is:<br>(a) ohm (b) volt (c) ampere (d) farad<br><b>Ans:</b> (a) ohm</p>
<p><b>Q5.</b> Resistivity depends on:<br>(a) length (b) area (c) material & temperature (d) none<br><b>Ans:</b> (c)</p>
<p><b>Q6.</b> Resistance of a conductor is:<br>(a) ρl/A (b) ρA/l (c) l/ρA (d) ρlA<br><b>Ans:</b> (a) ρl/A</p>
<p><b>Q7.</b> SI unit of resistivity is:<br>(a) ohm-metre (b) ohm/metre (c) ohm/m² (d) ohm·m²<br><b>Ans:</b> (a) ohm-metre</p>
<p><b>Q8.</b> Drift velocity is:<br>(a) I/neA (b) neA/I (c) Ine/A (d) none<br><b>Ans:</b> (a) I/neA</p>
<p><b>Q9.</b> Conductivity is:<br>(a) 1/ρ (b) ρ (c) ρ² (d) none<br><b>Ans:</b> (a) σ = 1/ρ</p>
<p><b>Q10.</b> Resistors in series have equivalent resistance:<br>(a) R1+R2 (b) R1R2/(R1+R2) (c) R1R2 (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q11.</b> Resistors in parallel have equivalent resistance:<br>(a) R1+R2 (b) 1/R = 1/R1+1/R2 (c) R1R2 (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q12.</b> Kirchhoff's junction law is based on:<br>(a) energy conservation (b) charge conservation (c) momentum (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q13.</b> Kirchhoff's loop law is based on:<br>(a) charge conservation (b) energy conservation (c) momentum (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q14.</b> Balanced Wheatstone bridge condition is:<br>(a) P/Q = R/S (b) PQ = RS (c) P+Q = R+S (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q15.</b> EMF of a cell is:<br>(a) terminal voltage (b) maximum potential difference when no current flows (c) zero (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q16.</b> Terminal voltage of a cell is:<br>(a) E − Ir (b) E + Ir (c) Ir (d) E<br><b>Ans:</b> (a) V = E − Ir</p>
<p><b>Q17.</b> Internal resistance is:<br>(a) external resistance (b) resistance of the cell itself (c) zero (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q18.</b> A potentiometer is used to measure:<br>(a) only current (b) EMF/potential difference accurately (c) resistance only (d) none<br><b>Ans:</b> (b)</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> Define electric current.<br><b>Ans:</b> Rate of flow of charge: I = q/t.</p>
<p><b>Q2.</b> State Ohm's law.<br><b>Ans:</b> At constant temperature, V = IR.</p>
<p><b>Q3.</b> Define resistance.<br><b>Ans:</b> Opposition to current flow: R = V/I.</p>
<p><b>Q4.</b> Define resistivity.<br><b>Ans:</b> Resistance of a conductor of unit length and unit area: ρ = RA/l.</p>
<p><b>Q5.</b> Define drift velocity.<br><b>Ans:</b> Average velocity of electrons under electric field: vd = I/neA.</p>
<p><b>Q6.</b> Define conductivity.<br><b>Ans:</b> Reciprocal of resistivity: σ = 1/ρ.</p>
<p><b>Q7.</b> State Kirchhoff's junction law.<br><b>Ans:</b> Sum of currents entering a junction equals sum leaving it (charge conservation).</p>
<p><b>Q8.</b> State Kirchhoff's loop law.<br><b>Ans:</b> Algebraic sum of potential differences around a closed loop is zero (energy conservation).</p>
<p><b>Q9.</b> Define EMF.<br><b>Ans:</b> Maximum potential difference between terminals when no current flows.</p>
<p><b>Q10.</b> Define terminal voltage.<br><b>Ans:</b> Potential difference across cell terminals when current flows: V = E − Ir.</p>
<p><b>Q11.</b> What is internal resistance?<br><b>Ans:</b> Resistance offered by the electrolyte inside a cell.</p>
<p><b>Q12.</b> What is a Wheatstone bridge?<br><b>Ans:</b> Circuit to measure unknown resistance using balance condition P/Q = R/S.</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> State and explain Ohm's law.<br><b>Ans:</b> V = IR at constant temperature; current ∝ potential difference. Graph is straight line.</p>
<p><b>Q2.</b> Define resistance and resistivity; give relation.<br><b>Ans:</b> R = V/I; ρ = RA/l. Resistivity is material property; resistance depends on dimensions.</p>
<p><b>Q3.</b> Explain drift velocity.<br><b>Ans:</b> Electrons drift slowly under electric field; vd = I/neA; opposite to field direction.</p>
<p><b>Q4.</b> State factors affecting resistance.<br><b>Ans:</b> R = ρl/A; increases with length, decreases with area, depends on material and temperature.</p>
<p><b>Q5.</b> State Kirchhoff's laws.<br><b>Ans:</b> Junction: ΣI_in = ΣI_out. Loop: ΣV around loop = 0.</p>
<p><b>Q6.</b> Explain Wheatstone bridge principle.<br><b>Ans:</b> Four resistors; at balance no current through galvanometer; P/Q = R/S gives unknown resistance.</p>
<p><b>Q7.</b> Explain potentiometer.<br><b>Ans:</b> Measures EMF/potential without drawing current; uses balance length on a uniform wire.</p>
<p><b>Q8.</b> EMF vs terminal voltage.<br><b>Ans:</b> EMF is max (no current); terminal voltage V = E − Ir (less when current flows).</p>
<p><b>Q9.</b> Internal resistance of a cell.<br><b>Ans:</b> Resistance of electrolyte; causes voltage drop Ir when current flows.</p>
<p><b>Q10.</b> Resistors in series.<br><b>Ans:</b> Same current; R = R1+R2+...; voltages add.</p>
<p><b>Q11.</b> Resistors in parallel.<br><b>Ans:</b> Same voltage; 1/R = 1/R1+1/R2+...; currents add.</p>
<p><b>Q12.</b> Explain meter bridge.<br><b>Ans:</b> Practical Wheatstone bridge using 1m wire; balance length gives unknown resistance.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive Ohm's law using drift velocity.<br><b>Ans:</b> vd = eEτ/m; I = neAvd = ne²AτE/m = (ne²τ/ml)V → V = IR (Ohm's law).</p>
<p><b>Q2.</b> Derive R = ρl/A.<br><b>Ans:</b> Resistance ∝ length, ∝ 1/area → R = ρl/A, where ρ is resistivity.</p>
<p><b>Q3.</b> Derive vd = I/neA.<br><b>Ans:</b> Current I = charge/time = (ne)(Avd) → vd = I/neA.</p>
<p><b>Q4.</b> Derive series combination of resistors.<br><b>Ans:</b> Same current; V = V1+V2 → IR = IR1+IR2 → R = R1+R2.</p>
<p><b>Q5.</b> Derive parallel combination of resistors.<br><b>Ans:</b> Same voltage; I = I1+I2 → V/R = V/R1+V/R2 → 1/R = 1/R1+1/R2.</p>
<p><b>Q6.</b> Explain Wheatstone bridge; derive balance condition.<br><b>Ans:</b> At balance, galvanometer current zero; potential at B = D; gives P/Q = R/S.</p>
<p><b>Q7.</b> Explain potentiometer; derive EMF comparison.<br><b>Ans:</b> EMF ∝ balance length: E1/E2 = l1/l2. No current drawn from cell at balance.</p>
<p><b>Q8.</b> Derive terminal voltage V = E − Ir.<br><b>Ans:</b> EMF E supplies external R and internal r: E = I(R+r); terminal V = IR = E − Ir.</p>
<p><b>Q9.</b> Apply Kirchhoff's laws to a circuit.<br><b>Ans:</b> Junction: ΣI=0. Loop: ΣV=0. Solve simultaneous equations for currents.</p>
<p><b>Q10.</b> Explain meter bridge working.<br><b>Ans:</b> Wheatstone principle with 1m wire; balance at length l; unknown R = (known)·(l/(100−l)).</p>
<p><b>Q11.</b> Resistivity and temperature.<br><b>Ans:</b> For metals, resistivity increases with temperature (more collisions). For semiconductors, decreases.</p>
<p><b>Q12.</b> Colour code of resistors.<br><b>Ans:</b> Bands give digits and multiplier; e.g., brown-black-red = 1 0 ×10² = 1kΩ.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> State Ohm's law; derive using drift velocity; derive R = ρl/A.<br><b>Ans:</b> vd = eEτ/m → I = ne²AτE/m → V = IR. R = ρl/A where ρ = m/ne²τ.</p>
<p><b>Q2.</b> State Kirchhoff's laws; solve a circuit.<br><b>Ans:</b> Junction ΣI=0 (charge conservation); loop ΣV=0 (energy conservation). Apply to find branch currents.</p>
<p><b>Q3.</b> Wheatstone bridge: principle and balance condition.<br><b>Ans:</b> Four resistors; at balance galvanometer shows zero; P/Q = R/S. Used to find unknown resistance.</p>
<p><b>Q4.</b> Potentiometer: measure EMF and internal resistance.<br><b>Ans:</b> EMF ∝ balance length; E1/E2 = l1/l2. Internal resistance r = (l1−l2)/l2 × R.</p>
<p><b>Q5.</b> Derive series and parallel combinations of resistors.<br><b>Ans:</b> Series: R = R1+R2 (same current). Parallel: 1/R = 1/R1+1/R2 (same voltage).</p>
<p><b>Q6.</b> Explain cell: EMF, terminal voltage, internal resistance.<br><b>Ans:</b> EMF E (no current); terminal V = E − Ir; E = I(R+r). Internal resistance causes voltage drop.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>Ohm:</b> V = IR | <b>Resistance:</b> R = ρl/A | <b>Conductivity:</b> σ = 1/ρ</p>
<p><b>Drift velocity:</b> vd = I/neA | <b>Current:</b> I = q/t</p>
<p><b>Combination:</b> Series R = ΣR | Parallel 1/R = Σ1/R</p>
<p><b>Wheatstone:</b> P/Q = R/S | <b>Cell:</b> V = E − Ir | E = I(R+r)</p>
<p><b>Potentiometer:</b> E1/E2 = l1/l2 | <b>Internal resistance:</b> r = (l1−l2)R/l2</p>
<h3>📐 KEY POINTS</h3>
<p><b>Resistivity</b> depends on material & temperature, not dimensions.</p>
<p><b>Resistance</b> depends on length, area, material.</p>
<p><b>Series:</b> same current | <b>Parallel:</b> same voltage.</p>
<h3>🎨 DIAGRAMS TO PRACTICE</h3>
<p><b>1. Simple circuit:</b> cell, resistor, ammeter, voltmeter.</p>
<p><b>2. Wheatstone bridge:</b> four resistors + galvanometer.</p>
<p><b>3. Potentiometer:</b> long wire, cell, galvanometer, balance length.</p>
<p><b>4. Meter bridge:</b> 1m wire with jockey.</p>
<h3>🔢 NUMERICALS TRICKS</h3>
<p><b>1.</b> V = IR; series add R, parallel add 1/R.</p>
<p><b>2.</b> R = ρl/A; l doubled → R doubled; A doubled → R halved.</p>
<p><b>3.</b> Terminal V = E − Ir (less than EMF under load).</p>
<p><b>4.</b> Wheatstone balance: P/Q = R/S.</p>
<p><b>5.</b> Potentiometer: E ∝ balance length.</p>
<h3>⭐ TOP 10 BOARD QUESTIONS</h3>
<p><b>1.</b> Ohm's law; drift velocity; R = ρl/A. (4 marks)</p>
<p><b>2.</b> Kirchhoff's laws; solve circuit. (4 marks)</p>
<p><b>3.</b> Wheatstone bridge; balance condition. (4 marks)</p>
<p><b>4.</b> Potentiometer; EMF & internal resistance. (4 marks)</p>
<p><b>5.</b> Series & parallel derivations. (3 marks)</p>
<p><b>6.</b> EMF vs terminal voltage; internal resistance. (3 marks)</p>
<p><b>7.</b> Derive vd = I/neA. (3 marks)</p>
<p><b>8.</b> State Ohm's law. (2 marks)</p>
<p><b>9.</b> Define resistance & resistivity. (2 marks)</p>
<p><b>10.</b> State Kirchhoff's laws. (2 marks)</p>
`;
notesData["10. Magnetic Fields due to Electric Current"]=`
<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> Magnetic field due to current is described by:<br>(a) Coulomb's law (b) Biot-Savart law (c) Ohm's law (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q2.</b> SI unit of magnetic field is:<br>(a) tesla (b) weber (c) henry (d) gauss<br><b>Ans:</b> (a) tesla</p>
<p><b>Q3.</b> Biot-Savart law gives:<br>(a) dB = (μ₀/4π)(I dl × r)/r³ (b) F = qE (c) V = IR (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q4.</b> Magnetic field due to a long straight wire is:<br>(a) μ₀I/2πr (b) μ₀I/2r (c) μ₀I/r² (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q5.</b> Magnetic field at the centre of a circular loop is:<br>(a) μ₀I/2R (b) μ₀I/2πR (c) μ₀I/R² (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q6.</b> Direction of field due to a straight wire is given by:<br>(a) left hand rule (b) right hand thumb rule (c) Fleming's rule (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q7.</b> Ampere's circuital law is:<br>(a) ∮B·dl = μ₀I (b) ∮E·dA = q/ε₀ (c) F = qv×B (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q8.</b> Magnetic field inside a solenoid is:<br>(a) μ₀nI (b) μ₀I/2R (c) μ₀I/2πr (d) zero<br><b>Ans:</b> (a)</p>
<p><b>Q9.</b> Magnetic field in a toroid is:<br>(a) μ₀nI (b) μ₀I/2R (c) zero (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q10.</b> Force on a moving charge in a magnetic field is:<br>(a) qv×B (b) qE (c) qv/B (d) none<br><b>Ans:</b> (a) Lorentz force</p>
<p><b>Q11.</b> Force on a current-carrying conductor is:<br>(a) BIL sinθ (b) BIL cosθ (c) BIL (d) none<br><b>Ans:</b> (a) BIL sinθ</p>
<p><b>Q12.</b> Value of μ₀ is:<br>(a) 4π × 10⁻⁷ T·m/A (b) 8.85 × 10⁻¹² (c) 9 × 10⁹ (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q13.</b> A charged particle moving perpendicular to uniform B moves in:<br>(a) straight line (b) circle (c) parabola (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q14.</b> Radius of path of a charge in magnetic field is:<br>(a) mv/qB (b) qB/mv (c) mvB/q (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q15.</b> A moving coil galvanometer works on:<br>(a) torque on current loop (b) electrostatic force (c) induction (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q16.</b> Torque on a current loop is:<br>(a) NIAB sinθ (b) NIAB cosθ (c) NIAB (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q17.</b> Field lines of a solenoid are like:<br>(a) a bar magnet (b) a point charge (c) a capacitor (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q18.</b> Lorentz force direction is:<br>(a) along v (b) along B (c) perpendicular to both v and B (d) none<br><b>Ans:</b> (c)</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> State Biot-Savart law.<br><b>Ans:</b> dB = (μ₀/4π)(I dl × r)/r³; field due to a current element.</p>
<p><b>Q2.</b> Define magnetic field.<br><b>Ans:</b> Region around a magnet/current where magnetic force is experienced; measured in tesla.</p>
<p><b>Q3.</b> Write field due to a long straight wire.<br><b>Ans:</b> B = μ₀I/2πr.</p>
<p><b>Q4.</b> Write field at centre of a circular loop.<br><b>Ans:</b> B = μ₀I/2R.</p>
<p><b>Q5.</b> State Ampere's law.<br><b>Ans:</b> ∮B·dl = μ₀I_enclosed.</p>
<p><b>Q6.</b> Define Lorentz force.<br><b>Ans:</b> Force on moving charge: F = qv×B.</p>
<p><b>Q7.</b> Write force on a current-carrying conductor.<br><b>Ans:</b> F = BIL sinθ.</p>
<p><b>Q8.</b> Define 1 tesla.<br><b>Ans:</b> Field in which 1C charge moving at 1 m/s experiences 1N force (perpendicular).</p>
<p><b>Q9.</b> What is a solenoid?<br><b>Ans:</b> Long coil of many turns; produces uniform field inside.</p>
<p><b>Q10.</b> Write field inside a solenoid.<br><b>Ans:</b> B = μ₀nI (n = turns per unit length).</p>
<p><b>Q11.</b> What is a toroid?<br><b>Ans:</b> Solenoid bent into a ring; field confined inside.</p>
<p><b>Q12.</b> State right hand thumb rule.<br><b>Ans:</b> Thumb in current direction; curled fingers show field direction.</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> State and explain Biot-Savart law.<br><b>Ans:</b> dB = (μ₀/4π)(I dl × r)/r³; field due to small current element; direction by right hand rule.</p>
<p><b>Q2.</b> Explain magnetic field due to a straight conductor.<br><b>Ans:</b> B = μ₀I/2πr; concentric circular field lines around wire; decreases with distance.</p>
<p><b>Q3.</b> Field due to a circular loop.<br><b>Ans:</b> At centre B = μ₀I/2R; field lines like a bar magnet; direction by right hand rule.</p>
<p><b>Q4.</b> State Ampere's circuital law.<br><b>Ans:</b> ∮B·dl = μ₀I_enclosed; useful for symmetric current distributions.</p>
<p><b>Q5.</b> Explain solenoid and its field.<br><b>Ans:</b> Long coil; uniform field inside B = μ₀nI; outside nearly zero; acts like bar magnet.</p>
<p><b>Q6.</b> Explain toroid.<br><b>Ans:</b> Ring-shaped solenoid; field confined inside B = μ₀nI; zero outside.</p>
<p><b>Q7.</b> State Lorentz force.<br><b>Ans:</b> F = qv×B; force on moving charge; perpendicular to both v and B.</p>
<p><b>Q8.</b> Force on a current-carrying conductor.<br><b>Ans:</b> F = BIL sinθ; max when perpendicular, zero when parallel.</p>
<p><b>Q9.</b> Explain right hand thumb rule.<br><b>Ans:</b> Thumb = current; curled fingers = magnetic field direction around conductor.</p>
<p><b>Q10.</b> Motion of charged particle in magnetic field.<br><b>Ans:</b> Perpendicular → circular path; radius r = mv/qB; parallel → straight line.</p>
<p><b>Q11.</b> Explain moving coil galvanometer.<br><b>Ans:</b> Current loop in magnetic field experiences torque τ = NIAB sinθ; deflection ∝ current.</p>
<p><b>Q12.</b> Torque on a current loop.<br><b>Ans:</b> τ = NIAB sinθ; max when plane parallel to field.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive magnetic field due to a long straight wire.<br><b>Ans:</b> From Biot-Savart, integrate along wire: B = μ₀I/2πr.</p>
<p><b>Q2.</b> Derive field at centre of a circular loop.<br><b>Ans:</b> Each element contributes dB; integrate around loop: B = μ₀I/2R.</p>
<p><b>Q3.</b> Apply Ampere's law to a solenoid.<br><b>Ans:</b> ∮B·dl = B·l = μ₀nIl → B = μ₀nI inside; ~0 outside.</p>
<p><b>Q4.</b> Apply Ampere's law to a toroid.<br><b>Ans:</b> ∮B·dl = B(2πr) = μ₀NI → B = μ₀nI inside; zero outside.</p>
<p><b>Q5.</b> Derive force on a current-carrying conductor.<br><b>Ans:</b> F = qv×B; for wire with current I, F = BIL sinθ.</p>
<p><b>Q6.</b> Derive radius of charged particle path in B.<br><b>Ans:</b> Centripetal force = magnetic force: mv²/r = qvB → r = mv/qB.</p>
<p><b>Q7.</b> Derive torque on a current loop.<br><b>Ans:</b> Forces on opposite sides form couple; τ = NIAB sinθ.</p>
<p><b>Q8.</b> Explain moving coil galvanometer working.<br><b>Ans:</b> Coil in radial field; torque τ = NIAB; deflection ∝ current; restored by spring.</p>
<p><b>Q9.</b> Lorentz force and its applications.<br><b>Ans:</b> F = qv×B. Applications: cyclotron, mass spectrometer, CRT, electric motors.</p>
<p><b>Q10.</b> Field due to a finite straight conductor.<br><b>Ans:</b> B = (μ₀I/4πr)(sinθ1 + sinθ2); reduces to μ₀I/2πr for infinite wire.</p>
<p><b>Q11.</b> Cyclotron principle.<br><b>Ans:</b> Charged particle accelerated by electric field, bent by magnetic field; frequency independent of speed.</p>
<p><b>Q12.</b> Magnetic dipole and its field.<br><b>Ans:</b> Current loop acts as dipole; field like bar magnet; moment m = NIA.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> State Biot-Savart law; derive field due to straight wire and circular loop.<br><b>Ans:</b> dB = (μ₀/4π)(I dl×r)/r³. Straight wire: B = μ₀I/2πr. Loop centre: B = μ₀I/2R.</p>
<p><b>Q2.</b> State Ampere's law; apply to solenoid and toroid.<br><b>Ans:</b> ∮B·dl = μ₀I. Solenoid: B = μ₀nI inside. Toroid: B = μ₀nI inside, zero outside.</p>
<p><b>Q3.</b> Explain Lorentz force; motion of charged particle in uniform B.<br><b>Ans:</b> F = qv×B. Perpendicular motion → circle r = mv/qB; period T = 2πm/qB.</p>
<p><b>Q4.</b> Force on current-carrying conductor; torque on current loop.<br><b>Ans:</b> F = BIL sinθ. Torque on loop: τ = NIAB sinθ; basis of galvanometer/motor.</p>

notesData["11. Magnetic Materials"]=`
<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> Magnetic susceptibility is negative for:<br>(a) paramagnetic (b) diamagnetic (c) ferromagnetic (d) none<br><b>Ans:</b> (b) diamagnetic</p>
<p><b>Q2.</b> Small positive susceptibility indicates:<br>(a) diamagnetic (b) paramagnetic (c) ferromagnetic (d) none<br><b>Ans:</b> (b) paramagnetic</p>
<p><b>Q3.</b> Very large positive susceptibility indicates:<br>(a) diamagnetic (b) paramagnetic (c) ferromagnetic (d) none<br><b>Ans:</b> (c) ferromagnetic</p>
<p><b>Q4.</b> Relative permeability of a diamagnetic material is:<br>(a) slightly less than 1 (b) slightly more than 1 (c) very large (d) zero<br><b>Ans:</b> (a)</p>
<p><b>Q5.</b> For a ferromagnetic material, relative permeability is:<br>(a) < 1 (b) = 1 (c) very large (d) zero<br><b>Ans:</b> (c)</p>
<p><b>Q6.</b> Above Curie temperature, a ferromagnetic material becomes:<br>(a) diamagnetic (b) paramagnetic (c) non-magnetic (d) none<br><b>Ans:</b> (b) paramagnetic</p>
<p><b>Q7.</b> SI unit of magnetic intensity H is:<br>(a) A/m (b) T (c) Wb (d) H<br><b>Ans:</b> (a) A/m</p>
<p><b>Q8.</b> Magnetization is defined as:<br>(a) magnetic moment per unit volume (b) magnetic moment per unit mass (c) flux per area (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q9.</b> The relation between B, H and M is:<br>(a) B = μ₀(H + M) (b) B = H + M (c) B = μ₀H − M (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q10.</b> Magnetic susceptibility χ equals:<br>(a) M/H (b) H/M (c) MH (d) none<br><b>Ans:</b> (a) M/H</p>
<p><b>Q11.</b> For a diamagnetic material, susceptibility is:<br>(a) small negative, independent of T (b) large positive (c) ∝ 1/T (d) zero<br><b>Ans:</b> (a)</p>
<p><b>Q12.</b> For a paramagnetic material, susceptibility varies as:<br>(a) T (b) 1/T (c) T² (d) 1/T²<br><b>Ans:</b> (b) 1/T (Curie's law)</p>
<p><b>Q13.</b> Angle of dip at the magnetic equator is:<br>(a) 0° (b) 45° (c) 90° (d) 180°<br><b>Ans:</b> (a) 0°</p>
<p><b>Q14.</b> Angle of dip at the magnetic poles is:<br>(a) 0° (b) 45° (c) 90° (d) 180°<br><b>Ans:</b> (c) 90°</p>
<p><b>Q15.</b> Horizontal component of Earth's field is:<br>(a) B cosδ (b) B sinδ (c) B tanδ (d) B<br><b>Ans:</b> (a) B cosδ</p>
<p><b>Q16.</b> Area of hysteresis loop represents:<br>(a) energy loss per cycle (b) magnetization (c) permeability (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q17.</b> Material for a permanent magnet should have:<br>(a) high coercivity & retentivity (b) low coercivity (c) low retentivity (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q18.</b> Material for an electromagnet is:<br>(a) steel (b) soft iron (c) alnico (d) none<br><b>Ans:</b> (b) soft iron (low coercivity)</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> Define magnetization.<br><b>Ans:</b> Magnetic moment per unit volume: M = m/V.</p>
<p><b>Q2.</b> Define magnetic intensity.<br><b>Ans:</b> Magnetizing field strength: H = B/μ₀ − M; unit A/m.</p>
<p><b>Q3.</b> Define magnetic susceptibility.<br><b>Ans:</b> Ratio of magnetization to magnetic intensity: χ = M/H.</p>
<p><b>Q4.</b> Define permeability.<br><b>Ans:</b> Ability of a material to permit magnetic lines: μ = B/H.</p>
<p><b>Q5.</b> Write relation between μr and χ.<br><b>Ans:</b> μr = 1 + χ.</p>
<p><b>Q6.</b> State Curie's law.<br><b>Ans:</b> For paramagnetic, χ ∝ 1/T (χ = C/T).</p>
<p><b>Q7.</b> What is Curie temperature?<br><b>Ans:</b> Temperature above which ferromagnetic becomes paramagnetic.</p>
<p><b>Q8.</b> Define angle of dip.<br><b>Ans:</b> Angle between Earth's total field and horizontal component.</p>
<p><b>Q9.</b> Define magnetic declination.<br><b>Ans:</b> Angle between geographic and magnetic meridian.</p>
<p><b>Q10.</b> What is hysteresis?<br><b>Ans:</b> Lagging of magnetization behind magnetizing field; B-H loop.</p>
<p><b>Q11.</b> Give one diamagnetic substance.<br><b>Ans:</b> Bismuth (or copper, water).</p>
<p><b>Q12.</b> Give one ferromagnetic substance.<br><b>Ans:</b> Iron (or cobalt, nickel).</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> Distinguish diamagnetic, paramagnetic, ferromagnetic.<br><b>Ans:</b> Dia: χ small negative, repelled by magnet. Para: χ small positive, weakly attracted. Ferro: χ large positive, strongly attracted.</p>
<p><b>Q2.</b> Explain magnetization.<br><b>Ans:</b> M = magnetic moment/volume. Measures how strongly a material is magnetized.</p>
<p><b>Q3.</b> Explain magnetic intensity and susceptibility.<br><b>Ans:</b> H = magnetizing field (A/m). χ = M/H; shows response of material to H.</p>
<p><b>Q4.</b> State Curie's law.<br><b>Ans:</b> χ = C/T for paramagnetic; magnetization decreases with temperature.</p>
<p><b>Q5.</b> Explain Curie temperature.<br><b>Ans:</b> Above it, thermal agitation destroys alignment; ferromagnetic → paramagnetic.</p>
<p><b>Q6.</b> Properties of diamagnetic materials.<br><b>Ans:</b> χ small negative; μr < 1; repelled by magnet; independent of T.</p>
<p><b>Q7.</b> Properties of paramagnetic materials.<br><b>Ans:</b> χ small positive; μr > 1; weakly attracted; χ ∝ 1/T.</p>
<p><b>Q8.</b> Properties of ferromagnetic materials.<br><b>Ans:</b> χ large positive; μr very large; strongly attracted; show hysteresis; become paramagnetic above Curie T.</p>
<p><b>Q9.</b> Explain hysteresis loop.<br><b>Ans:</b> B-H curve showing lag; area = energy loss; gives retentivity & coercivity.</p>
<p><b>Q10.</b> Material for permanent magnet and why.<br><b>Ans:</b> Steel/alnico with high retentivity & coercivity so magnetism persists.</p>
<p><b>Q11.</b> Material for electromagnet and why.<br><b>Ans:</b> Soft iron with low coercivity & narrow hysteresis so it magnetizes/demagnetizes easily.</p>
<p><b>Q12.</b> Explain Earth's magnetism elements.<br><b>Ans:</b> Declination (angle geo vs magnetic meridian), dip (δ), horizontal component B_H = B cosδ.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive B = μ₀(H + M).<br><b>Ans:</b> Total field B = μ₀H (applied) + μ₀M (from material) → B = μ₀(H + M).</p>
<p><b>Q2.</b> Explain classification of magnetic materials with examples.<br><b>Ans:</b> Dia (bismuth), para (aluminium), ferro (iron) based on χ and behaviour in field.</p>
<p><b>Q3.</b> Derive μr = 1 + χ.<br><b>Ans:</b> B = μ₀(H+M) = μ₀H(1 + M/H) = μ₀H(1+χ). Also B = μr μ₀ H → μr = 1+χ.</p>
<p><b>Q4.</b> Explain angle of dip with diagram.<br><b>Ans:</b> δ = angle between total field B and horizontal B_H. At equator δ=0, at poles δ=90°.</p>
<p><b>Q5.</b> Relation between B_H and B_V.<br><b>Ans:</b> B_H = B cosδ; B_V = B sinδ; tanδ = B_V/B_H.</p>
<p><b>Q6.</b> Derive tanδ = B_V/B_H.<br><b>Ans:</b> tanδ = (B sinδ)/(B cosδ) = B_V/B_H.</p>
<p><b>Q7.</b> Explain hysteresis and its importance.<br><b>Ans:</b> Lagging of M behind H; loop gives retentivity, coercivity, energy loss; used to select materials.</p>
<p><b>Q8.</b> Compare permanent magnet and electromagnet.<br><b>Ans:</b> Permanent: high retentivity/coercivity (steel). Electromagnet: soft iron, low coercivity, temporary.</p>
<p><b>Q9.</b> Effect of temperature on dia/para/ferro.<br><b>Ans:</b> Dia: no effect. Para: χ ∝ 1/T decreases. Ferro: becomes paramagnetic above Curie T.</p>
<p><b>Q10.</b> Explain magnetic moment and magnetization.<br><b>Ans:</b> Magnetic moment m = pole strength × length. Magnetization M = m/volume.</p>
<p><b>Q11.</b> Derive relation between horizontal and vertical components.<br><b>Ans:</b> B = √(B_H² + B_V²); tanδ = B_V/B_H.</p>
<p><b>Q12.</b> Applications of ferromagnetic materials.<br><b>Ans:</b> Permanent magnets, electromagnets, transformer cores, memory devices, magnetic recording.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> Define magnetization, intensity, susceptibility, permeability; give relations.<br><b>Ans:</b> M = m/V; H = B/μ₀ − M; χ = M/H; μ = B/H. Relations: B = μ₀(H+M), μr = 1+χ.</p>
<p><b>Q2.</b> Classify dia/para/ferro with properties and examples.<br><b>Ans:</b> Dia: χ<0, μr<1, repelled (bismuth). Para: χ>0 small, μr>1, weakly attracted (Al). Ferro: χ large, μr large, strongly attracted (Fe).</p>
<p><b>Q3.</b> Explain hysteresis loop; select materials for permanent & electromagnet.<br><b>Ans:</b> B-H loop; area = loss. Permanent: high retentivity+coercivity. Electromagnet: soft iron, narrow loop.</p>
<p><b>Q4.</b> Earth's magnetism: elements (declination, dip, horizontal component).<br><b>Ans:</b> Declination θ; dip δ; B_H = B cosδ; B_V = B sinδ; tanδ = B_V/B_H.</p>
<p><b>Q5.</b> Curie's law and Curie temperature; temperature effects.<br><b>Ans:</b> χ = C/T (para). Above Curie T, ferro → para. Dia unaffected by T.</p>
<p><b>Q6.</b> Derive B = μ₀(H+M), μr = 1+χ, tanδ = B_V/B_H.<br><b>Ans:</b> B = μ₀(H+M); μr = 1+χ; tanδ = B_V/B_H.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>Magnetization:</b> M = m/V | <b>Intensity:</b> H | <b>Susceptibility:</b> χ = M/H</p>
<p><b>Relations:</b> B = μ₀(H+M) | μr = 1+χ | μ = μr μ₀</p>
<p><b>Curie:</b> χ = C/T | <b>Earth:</b> B_H = B cosδ | B_V = B sinδ | tanδ = B_V/B_H</p>
<h3>🎨 DIAGRAMS TO PRACTICE</h3>
<p><b>1. Hysteresis loop:</b> B vs H with retentivity & coercivity.</p>
<p><b>2. Angle of dip:</b> B, B_H, B_V with δ.</p>
<p><b>3. Dia/para/ferro in field:</b> field lines behaviour.</p>
<h3>🔢 NUMERICALS TRICKS</h3>
<p><b>1.</b> μr = 1+χ; dia χ<0, para χ>0 small, ferro χ large.</p>
<p><b>2.</b> tanδ = B_V/B_H; equator δ=0, poles δ=90°.</p>
<p><b>3.</b> Para: χ ∝ 1/T.</p>
<h3>⭐ TOP 10 BOARD QUESTIONS</h3>
<p><b>1.</b> Define M, H, χ, μ; relations. (4 marks)</p>
<p><b>2.</b> Classify dia/para/ferro with properties. (4 marks)</p>
<p><b>3.</b> Hysteresis loop; material selection. (4 marks)</p>
<p><b>4.</b> Earth's magnetism elements. (4 marks)</p>
<p><b>5.</b> Curie's law & Curie temperature. (3 marks)</p>
<p><b>6.</b> Derive μr = 1+χ. (3 marks)</p>
<p><b>7.</b> Derive tanδ = B_V/B_H. (3 marks)</p>
<p><b>8.</b> Properties of diamagnetic. (2 marks)</p>
<p><b>9.</b> Define angle of dip. (2 marks)</p>
<p><b>10.</b> State Curie's law. (2 marks)</p>
`;

<p><b>Q1.</b> SI unit of magnetic flux is:<br>(a) weber (b) tesla (c) henry (d) gauss<br><b>Ans:</b> (a) weber</p>
<p><b>Q2.</b> Faraday's law gives induced EMF as:<br>(a) −dΦ/dt (b) dΦ/dt (c) Φ/t (d) none<br><b>Ans:</b> (a) −dΦ/dt</p>
<p><b>Q3.</b> Lenz's law is based on conservation of:<br>(a) charge (b) energy (c) momentum (d) mass<br><b>Ans:</b> (b) energy</p>
<p><b>Q4.</b> Motional EMF in a rod of length l moving with speed v in field B is:<br>(a) Blv (b) B/lv (c) Bl/v (d) none<br><b>Ans:</b> (a) Blv</p>
<p><b>Q5.</b> Eddy currents are:<br>(a) currents in wires (b) circulating currents in bulk conductor (c) static charges (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q6.</b> SI unit of self inductance is:<br>(a) henry (b) farad (c) weber (d) tesla<br><b>Ans:</b> (a) henry</p>
<p><b>Q7.</b> EMF of self induction is:<br>(a) −L dI/dt (b) L dI/dt (c) −I dL/dt (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q8.</b> SI unit of mutual inductance is:<br>(a) henry (b) farad (c) ohm (d) volt<br><b>Ans:</b> (a) henry</p>
<p><b>Q9.</b> EMF of mutual induction is:<br>(a) −M dI/dt (b) M dI/dt (c) −I dM/dt (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q10.</b> Energy stored in an inductor is:<br>(a) ½LI² (b) LI (c) LI² (d) ½L/I<br><b>Ans:</b> (a) ½LI²</p>
<p><b>Q11.</b> AC generator works on the principle of:<br>(a) heating effect (b) electromagnetic induction (c) chemical effect (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q12.</b> Direction of induced current is given by:<br>(a) Ohm's law (b) Lenz's law (c) Ampere's law (d) none<br><b>Ans:</b> (b) Lenz's law</p>
<p><b>Q13.</b> Induced EMF depends on:<br>(a) flux only (b) rate of change of flux (c) area only (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q14.</b> A coil rotating in a magnetic field produces:<br>(a) DC (b) alternating EMF (c) zero (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q15.</b> Eddy currents are used in:<br>(a) induction furnace (b) electromagnetic braking (c) both (d) none<br><b>Ans:</b> (c) both</p>
<p><b>Q16.</b> If flux changes from Φ1 to Φ2 in time t, charge flowing is:<br>(a) ΔΦ/R (b) ΔΦ·R (c) R/ΔΦ (d) none<br><b>Ans:</b> (a) ΔΦ/R</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> Define magnetic flux.<br><b>Ans:</b> Number of magnetic lines through a surface: Φ = B·A cosθ.</p>
<p><b>Q2.</b> State Faraday's first law.<br><b>Ans:</b> Changing flux linked with a coil induces an EMF.</p>
<p><b>Q3.</b> State Faraday's second law.<br><b>Ans:</b> Induced EMF ∝ rate of change of flux: e = −dΦ/dt.</p>
<p><b>Q4.</b> State Lenz's law.<br><b>Ans:</b> Induced current opposes the change producing it.</p>
<p><b>Q5.</b> Define motional EMF.<br><b>Ans:</b> EMF induced in a conductor moving in a magnetic field: e = Blv.</p>
<p><b>Q6.</b> Define self inductance.<br><b>Ans:</b> Flux linked per unit current in the same coil: L = Φ/I.</p>
<p><b>Q7.</b> Define mutual inductance.<br><b>Ans:</b> Flux linked in one coil per unit current in the other: M = Φ/I.</p>
<p><b>Q8.</b> Define 1 henry.<br><b>Ans:</b> Inductance when 1 A current links 1 Wb flux.</p>
<p><b>Q9.</b> What are eddy currents?<br><b>Ans:</b> Circulating currents induced in a bulk conductor by changing flux.</p>
<p><b>Q10.</b> Write energy stored in an inductor.<br><b>Ans:</b> U = ½LI².</p>
<p><b>Q11.</b> State principle of AC generator.<br><b>Ans:</b> Electromagnetic induction; rotating coil in field produces alternating EMF.</p>
<p><b>Q12.</b> Write induced EMF formula.<br><b>Ans:</b> e = −dΦ/dt.</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> State and explain Faraday's laws.<br><b>Ans:</b> 1st: changing flux induces EMF. 2nd: e = −dΦ/dt; magnitude ∝ rate of change of flux.</p>
<p><b>Q2.</b> State and explain Lenz's law.<br><b>Ans:</b> Induced current opposes the cause; consistent with energy conservation.</p>
<p><b>Q3.</b> Explain motional EMF.<br><b>Ans:</b> Conductor moving in B experiences force on charges; e = Blv.</p>
<p><b>Q4.</b> Explain eddy currents and applications.<br><b>Ans:</b> Circulating currents in bulk conductor; used in induction furnace, braking, damping.</p>
<p><b>Q5.</b> Define self induction; state factors.<br><b>Ans:</b> EMF induced in coil by its own changing current. Depends on turns, area, core.</p>
<p><b>Q6.</b> Define mutual induction; state factors.<br><b>Ans:</b> EMF in one coil due to changing current in another. Depends on turns, coupling, distance.</p>
<p><b>Q7.</b> Explain AC generator briefly.<br><b>Ans:</b> Rotating coil in field; flux changes; alternating EMF e = NBAω sinωt.</p>
<p><b>Q8.</b> Energy stored in an inductor.<br><b>Ans:</b> Work against back EMF stored as magnetic energy: U = ½LI².</p>
<p><b>Q9.</b> Why is Lenz's law conservation of energy?<br><b>Ans:</b> Mechanical work done against opposing force converts to electrical energy.</p>
<p><b>Q10.</b> Explain flux and its unit.<br><b>Ans:</b> Φ = B·A cosθ; unit weber (Wb).</p>
<p><b>Q11.</b> Applications of EMI.<br><b>Ans:</b> Generators, transformers, induction cooking, wireless charging, brakes.</p>
<p><b>Q12.</b> Distinguish self and mutual induction.<br><b>Ans:</b> Self: own coil's current induces EMF in itself. Mutual: one coil induces EMF in another.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive motional EMF = Blv.<br><b>Ans:</b> Force on charge F = qvB; work per charge over length l gives e = Blv.</p>
<p><b>Q2.</b> Derive EMF = −dΦ/dt.<br><b>Ans:</b> From Faraday's law, induced EMF equals negative rate of change of flux.</p>
<p><b>Q3.</b> Derive energy stored in an inductor.<br><b>Ans:</b> dW = e I dt = L I dI; integrate → U = ½LI².</p>
<p><b>Q4.</b> Derive mutual inductance of two coils.<br><b>Ans:</b> Φ2 = M I1; M = N2Φ2/I1; depends on geometry and coupling.</p>
<p><b>Q5.</b> Derive self inductance of a solenoid.<br><b>Ans:</b> B = μ₀nI; Φ = B·A·N → L = μ₀n²Al.</p>
<p><b>Q6.</b> Explain AC generator; derive e = NBAω sinωt.<br><b>Ans:</b> Φ = NBA cosωt; e = −dΦ/dt = NBAω sinωt.</p>
<p><b>Q7.</b> Lenz's law with examples.<br><b>Ans:</b> Magnet approaching coil induces current opposing approach; receding induces aiding current.</p>
<p><b>Q8.</b> Eddy currents; applications.<br><b>Ans:</b> Bulk circulating currents; induction furnace, braking, galvanometer damping.</p>
<p><b>Q9.</b> Derive charge = ΔΦ/R.<br><b>Ans:</b> q = ∫I dt = ∫(e/R)dt = (1/R)∫dΦ = ΔΦ/R.</p>
<p><b>Q10.</b> Explain electromagnetic induction experiments.<br><b>Ans:</b> Magnet-coil relative motion induces current; changing current in one coil induces in another.</p>
<p><b>Q11.</b> Derive EMF for a rotating coil.<br><b>Ans:</b> Φ = NBA cosωt; e = NBAω sinωt (alternating).</p>
<p><b>Q12.</b> Factors affecting mutual inductance.<br><b>Ans:</b> Number of turns, area, distance, orientation, core material.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> State Faraday's laws; derive EMF = −dΦ/dt.<br><b>Ans:</b> 1st: changing flux induces EMF. 2nd: e = −dΦ/dt. Derivation from flux change.</p>
<p><b>Q2.</b> Lenz's law; show it is conservation of energy.<br><b>Ans:</b> Induced current opposes cause; mechanical work → electrical energy.</p>
<p><b>Q3.</b> Motional EMF derivation; AC generator.<br><b>Ans:</b> e = Blv. Generator: e = NBAω sinωt.</p>
<p><b>Q4.</b> Self and mutual induction; solenoid inductance.<br><b>Ans:</b> L = μ₀n²Al; M = N2Φ2/I1.</p>
<p><b>Q5.</b> Eddy currents & applications; energy in inductor.<br><b>Ans:</b> Eddy currents in furnace/braking; U = ½LI².</p>
<p><b>Q6.</b> AC generator principle and derivation.<br><b>Ans:</b> Rotating coil; e = NBAω sinωt; alternating output.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>Flux:</b> Φ = B·A cosθ | <b>EMF:</b> e = −dΦ/dt</p>
<p><b>Motional:</b> e = Blv | <b>Self:</b> e = −L dI/dt | <b>Mutual:</b> e = −M dI/dt</p>
<p><b>Solenoid L:</b> μ₀n²Al | <b>Energy:</b> U = ½LI² | <b>Charge:</b> q = ΔΦ/R</p>
<p><b>AC gen:</b> e = NBAω sinωt</p>

notesData["13. AC Circuits"]=`
<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> RMS value of AC is:<br>(a) I0/√2 (b) I0√2 (c) I0/2 (d) 2I0<br><b>Ans:</b> (a) I0/√2</p>
<p><b>Q2.</b> Average value of AC over a full cycle is:<br>(a) zero (b) I0/2 (c) I0 (d) I0/√2<br><b>Ans:</b> (a) zero</p>
<p><b>Q3.</b> In a pure resistor, voltage and current are:<br>(a) in phase (b) 90° apart (c) 180° apart (d) none<br><b>Ans:</b> (a) in phase</p>
<p><b>Q4.</b> In a pure inductor, current:<br>(a) leads by 90° (b) lags by 90° (c) in phase (d) none<br><b>Ans:</b> (b) lags by 90°</p>
<p><b>Q5.</b> In a pure capacitor, current:<br>(a) leads by 90° (b) lags by 90° (c) in phase (d) none<br><b>Ans:</b> (a) leads by 90°</p>
<p><b>Q6.</b> Inductive reactance is:<br>(a) ωL (b) 1/ωL (c) L/ω (d) ω/L<br><b>Ans:</b> (a) ωL</p>
<p><b>Q7.</b> Capacitive reactance is:<br>(a) ωC (b) 1/ωC (c) C/ω (d) ω/C<br><b>Ans:</b> (b) 1/ωC</p>
<p><b>Q8.</b> Impedance of series LCR circuit is:<br>(a) √(R² + (XL−XC)²) (b) R + XL + XC (c) R − XL − XC (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q9.</b> At resonance:<br>(a) XL = XC (b) XL > XC (c) XL < XC (d) none<br><b>Ans:</b> (a) XL = XC</p>
<p><b>Q10.</b> Resonant frequency is:<br>(a) 1/(2π√LC) (b) 2π√LC (c) √LC (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q11.</b> At resonance, impedance equals:<br>(a) R (minimum) (b) XL (c) XC (d) maximum<br><b>Ans:</b> (a) R (minimum)</p>
<p><b>Q12.</b> Power factor is:<br>(a) cosφ = R/Z (b) sinφ (c) Z/R (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q13.</b> Wattless current occurs when:<br>(a) φ = 0 (b) φ = 90° (c) φ = 45° (d) none<br><b>Ans:</b> (b) φ = 90° (pure L or C)</p>
<p><b>Q14.</b> Average power in AC is:<br>(a) Vrms Irms cosφ (b) Vrms Irms (c) V0 I0 (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q15.</b> Transformer works on:<br>(a) self induction (b) mutual induction (c) heating (d) none<br><b>Ans:</b> (b) mutual induction</p>
<p><b>Q16.</b> A step-up transformer:<br>(a) increases voltage (b) decreases voltage (c) increases power (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q17.</b> Transformer ratio Vs/Vp equals:<br>(a) Ns/Np (b) Np/Ns (c) Ns·Np (d) none<br><b>Ans:</b> (a) Ns/Np</p>
<p><b>Q18.</b> Frequency of LC oscillations is:<br>(a) 1/(2π√LC) (b) 2π√LC (c) √LC (d) none<br><b>Ans:</b> (a)</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> Define RMS value.<br><b>Ans:</b> Equivalent DC value giving same heating: Irms = I0/√2.</p>
<p><b>Q2.</b> Define average value of AC.<br><b>Ans:</b> Mean over half cycle; zero over full cycle.</p>
<p><b>Q3.</b> Define inductive reactance.<br><b>Ans:</b> Opposition of inductor to AC: XL = ωL.</p>
<p><b>Q4.</b> Define capacitive reactance.<br><b>Ans:</b> Opposition of capacitor to AC: XC = 1/ωC.</p>
<p><b>Q5.</b> Define impedance.<br><b>Ans:</b> Total opposition in AC circuit: Z = √(R²+(XL−XC)²).</p>
<p><b>Q6.</b> Define resonance.<br><b>Ans:</b> Condition XL = XC; current maximum.</p>
<p><b>Q7.</b> Define power factor.<br><b>Ans:</b> cosφ = R/Z; ratio of real to apparent power.</p>
<p><b>Q8.</b> What is wattless current?<br><b>Ans:</b> Current component that consumes no power (φ = 90°).</p>
<p><b>Q9.</b> Define transformer.<br><b>Ans:</b> Device to change AC voltage using mutual induction.</p>
<p><b>Q10.</b> Write resonant frequency.<br><b>Ans:</b> fr = 1/(2π√LC).</p>
<p><b>Q11.</b> Phase relation in pure resistor.<br><b>Ans:</b> V and I in phase.</p>
<p><b>Q12.</b> Phase relation in pure inductor.<br><b>Ans:</b> I lags V by 90°.</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> Explain RMS value.<br><b>Ans:</b> Root mean square; Irms = I0/√2 ≈ 0.707 I0; gives same heating as DC.</p>
<p><b>Q2.</b> Explain average value of AC.<br><b>Ans:</b> Mean over half cycle = 2I0/π; over full cycle = 0.</p>
<p><b>Q3.</b> AC through pure resistor.<br><b>Ans:</b> V and I in phase; I = V/R.</p>
<p><b>Q4.</b> AC through pure inductor.<br><b>Ans:</b> I lags V by 90°; opposition XL = ωL.</p>
<p><b>Q5.</b> AC through pure capacitor.<br><b>Ans:</b> I leads V by 90°; opposition XC = 1/ωC.</p>
<p><b>Q6.</b> Explain impedance.<br><b>Ans:</b> Z = √(R²+(XL−XC)²); total AC opposition; unit ohm.</p>
<p><b>Q7.</b> Explain resonance in LCR.<br><b>Ans:</b> At fr, XL = XC; Z = R minimum; current maximum.</p>
<p><b>Q8.</b> Explain power factor.<br><b>Ans:</b> cosφ = R/Z; P = Vrms Irms cosφ.</p>
<p><b>Q9.</b> Explain wattless current.<br><b>Ans:</b> In pure L or C, φ = 90°, cosφ = 0, so average power = 0.</p>
<p><b>Q10.</b> Explain transformer principle.<br><b>Ans:</b> Mutual induction; Vs/Vp = Ns/Np; step-up/step-down.</p>
<p><b>Q11.</b> Step-up vs step-down transformer.<br><b>Ans:</b> Step-up: Ns > Np, increases V. Step-down: Ns < Np, decreases V.</p>
<p><b>Q12.</b> LC oscillations.<br><b>Ans:</b> Energy exchanges between L and C; frequency 1/(2π√LC).</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive RMS value relation.<br><b>Ans:</b> Irms = √(mean of I²) = I0/√2.</p>
<p><b>Q2.</b> AC through pure inductor; show current lags.<br><b>Ans:</b> V = L dI/dt; solving gives I lags V by 90°; XL = ωL.</p>
<p><b>Q3.</b> AC through pure capacitor; show current leads.<br><b>Ans:</b> I = C dV/dt; gives I leads V by 90°; XC = 1/ωC.</p>
<p><b>Q4.</b> Derive impedance of series LCR.<br><b>Ans:</b> Phasor sum: Z = √(R²+(XL−XC)²); tanφ = (XL−XC)/R.</p>
<p><b>Q5.</b> Derive resonance condition and frequency.<br><b>Ans:</b> XL = XC → ωL = 1/ωC → fr = 1/(2π√LC).</p>
<p><b>Q6.</b> Derive average power; power factor.<br><b>Ans:</b> P = Vrms Irms cosφ; cosφ = R/Z.</p>
<p><b>Q7.</b> Explain transformer; derive ratio.<br><b>Ans:</b> Vs/Vp = Ns/Np; from mutual induction and flux linkage.</p>
<p><b>Q8.</b> Phasor diagrams for R, L, C.<br><b>Ans:</b> R: in phase. L: I lags 90°. C: I leads 90°.</p>
<p><b>Q9.</b> Derive XL and XC.<br><b>Ans:</b> XL = ωL; XC = 1/ωC.</p>
<p><b>Q10.</b> Wattless current explanation.<br><b>Ans:</b> When φ = 90°, P = VIcosφ = 0; current is wattless.</p>
<p><b>Q11.</b> LC oscillations derivation.<br><b>Ans:</b> Energy exchange L↔C; ω = 1/√LC; f = 1/(2π√LC).</p>
<p><b>Q12.</b> Sharpness of resonance / Q factor.<br><b>Ans:</b> Q = ωr L/R; higher Q = sharper resonance.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> RMS and average value derivations.<br><b>Ans:</b> Irms = I0/√2; average over half cycle = 2I0/π; full cycle = 0.</p>
<p><b>Q2.</b> AC through R, L, C with phasors.<br><b>Ans:</b> R: in phase; L: I lags 90°; C: I leads 90°.</p>
<p><b>Q3.</b> Series LCR: impedance and resonance.<br><b>Ans:</b> Z = √(R²+(XL−XC)²); resonance XL=XC; fr = 1/(2π√LC).</p>
<p><b>Q4.</b> Power in AC; power factor; wattless current.<br><b>Ans:</b> P = Vrms Irms cosφ; cosφ = R/Z; wattless when φ=90°.</p>
<p><b>Q5.</b> Transformer: principle, types, ratio.<br><b>Ans:</b> Mutual induction; Vs/Vp = Ns/Np; step-up/step-down.</p>
<p><b>Q6.</b> LC oscillations.<br><b>Ans:</b> Energy exchange; f = 1/(2π√LC).</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>RMS:</b> Irms = I0/√2 | <b>XL</b> = ωL | <b>XC</b> = 1/ωC</p>
<p><b>Impedance:</b> Z = √(R²+(XL−XC)²) | <b>Resonance:</b> fr = 1/(2π√LC)</p>
<p><b>Power:</b> P = Vrms Irms cosφ | <b>Power factor:</b> cosφ = R/Z</p>
<p><b>Transformer:</b> Vs/Vp = Ns/Np | <b>LC:</b> f = 1/(2π√LC)</p>
<h3> KEY POINTS</h3>
<p><b>R:</b> V, I in phase | <b>L:</b> I lags 90° | <b>C:</b> I leads 90°</p>
<p><b>Resonance:</b> XL = XC, Z = R (min), I max</p>
<p><b>Wattless:</b> φ = 90°, P = 0</p>
<h3>🎨 DIAGRAMS TO PRACTICE</h3>
<p><b>1. Phasor diagrams:</b> R, L, C and series LCR.</p>
<p><b>2. LCR circuit:</b> L, C, R with AC source.</p>
<p><b>3. Transformer:</b> primary, secondary, core.</p>
<h3>🔢 NUMERICALS TRICKS</h3>
<p><b>1.</b> Irms = I0/√2 ≈ 0.707 I0.</p>
<p><b>2.</b> XL = ωL; XC = 1/ωC; ω = 2πf.</p>
<p><b>3.</b> Resonance: XL = XC; fr = 1/(2π√LC).</p>
<p><b>4.</b> P = VIcosφ; wattless when cosφ=0.</p>

notesData["14. Dual Nature of Radiation & Matter"]=`
<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> Photoelectric effect shows light behaves as:<br>(a) wave (b) particle (photon) (c) both (d) none<br><b>Ans:</b> (b) particle</p>
<p><b>Q2.</b> Work function is measured in:<br>(a) eV (b) watt (c) volt (d) tesla<br><b>Ans:</b> (a) eV</p>
<p><b>Q3.</b> Threshold frequency is:<br>(a) max frequency (b) minimum frequency for emission (c) zero (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q4.</b> Einstein's photoelectric equation is:<br>(a) eV0 = hν − φ (b) eV0 = hν + φ (c) hν = eV0 − φ (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q5.</b> Stopping potential depends on:<br>(a) intensity (b) frequency of light (c) area (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q6.</b> Photoelectric current depends on:<br>(a) frequency (b) intensity (c) work function (d) none<br><b>Ans:</b> (b) intensity</p>
<p><b>Q7.</b> Energy of a photon is:<br>(a) hν (b) h/ν (c) ν/h (d) none<br><b>Ans:</b> (a) hν</p>
<p><b>Q8.</b> Momentum of a photon is:<br>(a) h/λ (b) hλ (c) λ/h (d) none<br><b>Ans:</b> (a) h/λ</p>
<p><b>Q9.</b> de Broglie wavelength is:<br>(a) h/mv (b) mv/h (c) h·mv (d) none<br><b>Ans:</b> (a) h/mv = h/p</p>
<p><b>Q10.</b> de Broglie λ of electron accelerated by V is:<br>(a) h/√(2meV) (b) √(2meV)/h (c) 2meV/h (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q11.</b> Davisson-Germer experiment proved:<br>(a) particle nature (b) wave nature of electron (c) charge (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q12.</b> As intensity increases, photoelectric current:<br>(a) decreases (b) increases (c) constant (d) zero<br><b>Ans:</b> (b)</p>
<p><b>Q13.</b> As frequency increases, stopping potential:<br>(a) decreases (b) increases (c) constant (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q14.</b> Below threshold frequency, emission is:<br>(a) small (b) zero regardless of intensity (c) large (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q15.</b> A photon has:<br>(a) charge & mass (b) no charge, no rest mass (c) charge only (d) mass only<br><b>Ans:</b> (b)</p>
<p><b>Q16.</b> Slope of stopping potential vs frequency graph is:<br>(a) h/e (b) e/h (c) h·e (d) none<br><b>Ans:</b> (a) h/e</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> Define photoelectric effect.<br><b>Ans:</b> Emission of electrons from a metal surface when light falls on it.</p>
<p><b>Q2.</b> Define work function.<br><b>Ans:</b> Minimum energy needed to remove an electron from metal surface (φ).</p>
<p><b>Q3.</b> Define threshold frequency.<br><b>Ans:</b> Minimum frequency below which no emission occurs (ν0).</p>
<p><b>Q4.</b> Define stopping potential.<br><b>Ans:</b> Minimum negative potential that stops photoelectric current (V0).</p>
<p><b>Q5.</b> What is a photon?<br><b>Ans:</b> A quantum of light; energy hν; no charge, no rest mass.</p>
<p><b>Q6.</b> Write de Broglie wavelength.<br><b>Ans:</b> λ = h/mv = h/p.</p>
<p><b>Q7.</b> Write Einstein's photoelectric equation.<br><b>Ans:</b> eV0 = hν − φ.</p>
<p><b>Q8.</b> State Davisson-Germer experiment significance.<br><b>Ans:</b> Confirmed wave nature of electrons (diffraction).</p>
<p><b>Q9.</b> Write photon momentum.<br><b>Ans:</b> p = h/λ = E/c.</p>
<p><b>Q10.</b> Define photoelectric current.<br><b>Ans:</b> Current due to emitted photoelectrons; ∝ intensity.</p>
<p><b>Q11.</b> What is wave-particle duality?<br><b>Ans:</b> Light and matter show both wave and particle properties.</p>
<p><b>Q12.</b> Value of 1 eV.<br><b>Ans:</b> 1.6 × 10⁻¹⁹ J.</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> Explain photoelectric effect.<br><b>Ans:</b> Light on metal ejects electrons if ν > ν0; current ∝ intensity; emission instantaneous.</p>
<p><b>Q2.</b> Explain work function and threshold frequency.<br><b>Ans:</b> φ = minimum energy to eject; ν0 = φ/h; below ν0 no emission.</p>
<p><b>Q3.</b> State Einstein's photoelectric equation.<br><b>Ans:</b> hν = φ + KE_max → eV0 = hν − φ.</p>
<p><b>Q4.</b> Explain stopping potential.<br><b>Ans:</b> V0 stops fastest electrons; eV0 = KE_max; depends on frequency.</p>
<p><b>Q5.</b> Intensity vs photoelectric current.<br><b>Ans:</b> Current ∝ intensity (more photons → more electrons).</p>
<p><b>Q6.</b> State de Broglie hypothesis.<br><b>Ans:</b> Every moving particle has a wave: λ = h/mv.</p>
<p><b>Q7.</b> Explain Davisson-Germer experiment.<br><b>Ans:</b> Electron diffraction by crystal confirms wave nature; matches de Broglie λ.</p>
<p><b>Q8.</b> Properties of photon.<br><b>Ans:</b> Energy hν, momentum h/λ, no charge/rest mass, travels at c.</p>
<p><b>Q9.</b> Explain wave-particle duality.<br><b>Ans:</b> Light: wave (interference) + particle (photoelectric). Matter: particle + wave (de Broglie).</p>
<p><b>Q10.</b> Why classical wave theory fails for photoelectric effect?<br><b>Ans:</b> It predicts emission at any frequency & delay; experiment shows threshold & instant emission.</p>
<p><b>Q11.</b> Define threshold wavelength.<br><b>Ans:</b> Maximum wavelength for emission: λ0 = hc/φ.</p>
<p><b>Q12.</b> Explain saturation current.<br><b>Ans:</b> Maximum current when all emitted electrons reach anode; increases with intensity.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive Einstein's photoelectric equation.<br><b>Ans:</b> hν = φ + ½mv²_max. Using φ = hν0 and KE_max = eV0 → eV0 = hν − hν0.</p>
<p><b>Q2.</b> Derive de Broglie wavelength.<br><b>Ans:</b> λ = h/p; for particle p = mv → λ = h/mv; for electron λ = h/√(2meV).</p>
<p><b>Q3.</b> Explain Davisson-Germer experiment.<br><b>Ans:</b> Electrons diffracted by Ni crystal; intensity maxima match λ = h/mv; proves wave nature.</p>
<p><b>Q4.</b> Derive stopping potential relation.<br><b>Ans:</b> eV0 = hν − φ → V0 = (h/e)ν − φ/e; slope = h/e.</p>
<p><b>Q5.</b> Explain experimental observations of photoelectric effect.<br><b>Ans:</b> Current ∝ intensity; KE ∝ frequency; threshold exists; instantaneous emission.</p>
<p><b>Q6.</b> Derive λ = 1.227/√V nm for electron.<br><b>Ans:</b> λ = h/√(2meV); substituting constants gives λ(nm) ≈ 1.227/√V.</p>
<p><b>Q7.</b> Explain laws of photoelectric emission.<br><b>Ans:</b> Current ∝ intensity; KE ∝ frequency; threshold frequency; instantaneous.</p>
<p><b>Q8.</b> Photon vs matter wave.<br><b>Ans:</b> Photon: light quantum (hν). Matter wave: de Broglie wave of particle (h/mv).</p>
<p><b>Q9.</b> Work function and threshold; numerical relation.<br><b>Ans:</b> φ = hν0; V0 = (h/e)(ν − ν0).</p>
<p><b>Q10.</b> Explain V0 vs ν graph.<br><b>Ans:</b> Straight line; slope = h/e; intercept gives φ; x-intercept = ν0.</p>
<p><b>Q11.</b> Derive photon momentum and energy.<br><b>Ans:</b> E = hν; p = E/c = h/λ.</p>
<p><b>Q12.</b> Applications of photoelectric effect.<br><b>Ans:</b> Photocells, solar cells, light meters, automatic doors, burglar alarms.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> Explain photoelectric effect; Einstein equation; explain laws.<br><b>Ans:</b> Emission when ν>ν0. hν = φ + KE_max. Explains current∝intensity, KE∝frequency, threshold, instant emission.</p>
<p><b>Q2.</b> de Broglie hypothesis; Davisson-Germer experiment.<br><b>Ans:</b> λ = h/mv. Davisson-Germer diffraction confirms wave nature of electron.</p>
<p><b>Q3.</b> Photon & quantum theory; properties; applications.<br><b>Ans:</b> E = hν; quantum nature; photocells, solar cells.</p>
<p><b>Q4.</b> Stopping potential derivations; V0 vs ν graph.<br><b>Ans:</b> eV0 = hν − φ; slope h/e; gives h and φ.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>Photon:</b> E = hν | p = h/λ = E/c</p>
<p><b>Einstein:</b> hν = φ + KE_max | eV0 = hν − φ | φ = hν0</p>
<p><b>de Broglie:</b> λ = h/mv = h/p | electron: λ = h/√(2meV) ≈ 1.227/√V nm</p>
<p><b>Graph slope:</b> h/e</p>
<h3>📐 VALUES TO MEMORISE</h3>
<p><b>h</b> = 6.63 × 10⁻³⁴ J·s | <b>e</b> = 1.6 × 10⁻¹⁹ C | <b>m_e</b> = 9.1 × 10⁻³¹ kg</p>
<p><b>1 eV</b> = 1.6 × 10⁻¹⁹ J | <b>c</b> = 3 × 10⁸ m/s</p>
<h3>🎨 DIAGRAMS TO PRACTICE</h3>
<p><b>1. Photoelectric setup:</b> emitter, collector, battery, meter.</p>
<p><b>2. V0 vs ν graph:</b> straight line, slope h/e.</p>
<p><b>3. Davisson-Germer:</b> electron gun, crystal, detector.</p>
<h3>🔢 NUMERICALS TRICKS</h3>
<p><b>1.</b> eV0 = hν − φ; use eV for energy.</p>
<p><b>2.</b> λ(nm) = 1240/E(eV) for photon.</p>
<p><b>3.</b> Electron λ = 1.227/√V nm.</p>
<h3>⭐ TOP 10 BOARD QUESTIONS</h3>
<p><b>1.</b> Photoelectric effect; Einstein equation; laws. (4 marks)</p>
<p><b>2.</b> de Broglie; Davisson-Germer. (4 marks)</p>
<p><b>3.</b> Derive Einstein equation. (3 marks)</p>
<p><b>4.</b> Stopping potential; V0 vs ν graph. (3 marks)</p>
<p><b>5.</b> Define work function & threshold. (2 marks)</p>
<p><b>6.</b> Derive de Broglie wavelength. (3 marks)</p>
<p><b>7.</b> Photon properties. (2 marks)</p>
<p><b>8.</b> State Einstein equation. (2 marks)</p>
<p><b>9.</b> Define stopping potential. (2 marks)</p>
<p><b>10.</b> Why wave theory fails. (2 marks)</p>

notesData["15. Structure of Atoms & Nuclei"]=`
<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> Rutherford's experiment showed the nucleus is:<br>(a) large & diffuse (b) small & dense (c) absent (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q2.</b> Most alpha particles pass straight through, showing:<br>(a) atom mostly empty (b) nucleus large (c) electrons heavy (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q3.</b> In Bohr model, angular momentum is:<br>(a) nh/2π (b) 2π/nh (c) n·h (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q4.</b> Energy of electron in nth orbit of hydrogen is:<br>(a) −13.6/n² eV (b) 13.6/n² (c) −13.6n² (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q5.</b> Radius of nth orbit is proportional to:<br>(a) n (b) n² (c) 1/n² (d) 1/n<br><b>Ans:</b> (b) n²</p>
<p><b>Q6.</b> Ground state energy of hydrogen is:<br>(a) −13.6 eV (b) 0 (c) +13.6 (d) −3.4<br><b>Ans:</b> (a)</p>
<p><b>Q7.</b> Lyman series lies in:<br>(a) UV (b) visible (c) IR (d) none<br><b>Ans:</b> (a) UV (to n=1)</p>
<p><b>Q8.</b> Balmer series lies in:<br>(a) UV (b) visible (c) IR (d) none<br><b>Ans:</b> (b) visible (to n=2)</p>
<p><b>Q9.</b> Isotopes have:<br>(a) same Z, different A (b) same A (c) same N (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q10.</b> Binding energy per nucleon is maximum near:<br>(a) H (b) Fe (A≈56) (c) U (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q11.</b> Radioactivity is a:<br>(a) surface phenomenon (b) nuclear/spontaneous process (c) chemical (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q12.</b> Half-life and decay constant relation:<br>(a) T½ = 0.693/λ (b) λ = 0.693·T½ (c) T½ = λ (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q13.</b> An alpha particle is:<br>(a) electron (b) helium nucleus (c) proton (d) photon<br><b>Ans:</b> (b)</p>
<p><b>Q14.</b> A beta particle is:<br>(a) electron (b) helium nucleus (c) neutron (d) photon<br><b>Ans:</b> (a)</p>
<p><b>Q15.</b> Gamma rays are:<br>(a) charged particles (b) EM radiation (c) electrons (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q16.</b> Nuclear fission is:<br>(a) heavy nucleus splits (b) light nuclei combine (c) none (d) both<br><b>Ans:</b> (a)</p>
<p><b>Q17.</b> Nuclear fusion is:<br>(a) heavy splits (b) light nuclei combine (c) none (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q18.</b> Mass defect is:<br>(a) Δm = Zmp + (A−Z)mn − M (b) M − Zmp (c) A − Z (d) none<br><b>Ans:</b> (a)</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> State Rutherford's nuclear model.<br><b>Ans:</b> Small dense positive nucleus; electrons orbit; atom mostly empty.</p>
<p><b>Q2.</b> State Bohr's quantization condition.<br><b>Ans:</b> L = nh/2π (angular momentum quantized).</p>
<p><b>Q3.</b> Write energy of nth orbit of hydrogen.<br><b>Ans:</b> En = −13.6/n² eV.</p>
<p><b>Q4.</b> Define isotopes.<br><b>Ans:</b> Same Z, different A (same element, different neutrons).</p>
<p><b>Q5.</b> Define mass defect.<br><b>Ans:</b> Δm = (Zmp + (A−Z)mn) − M.</p>
<p><b>Q6.</b> Define binding energy.<br><b>Ans:</b> Energy to separate nucleons; BE = Δm c².</p>
<p><b>Q7.</b> Define half-life.<br><b>Ans:</b> Time for half the nuclei to decay: T½ = 0.693/λ.</p>
<p><b>Q8.</b> Define decay constant.<br><b>Ans:</b> Probability of decay per unit time: λ.</p>
<p><b>Q9.</b> What is an alpha particle?<br><b>Ans:</b> Helium nucleus (2p + 2n), charge +2e.</p>
<p><b>Q10.</b> What is a beta particle?<br><b>Ans:</b> Fast electron emitted from nucleus.</p>
<p><b>Q11.</b> What are gamma rays?<br><b>Ans:</b> High-energy EM radiation from nucleus.</p>
<p><b>Q12.</b> Define nuclear fission.<br><b>Ans:</b> Heavy nucleus splits into lighter nuclei with energy release.</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> Explain Rutherford scattering experiment.<br><b>Ans:</b> Alpha particles on thin gold foil; most pass (empty), few deflect (dense nucleus).</p>
<p><b>Q2.</b> State Bohr's postulates.<br><b>Ans:</b> Electrons in stable orbits; L = nh/2π; radiation on transition (hν = E2−E1).</p>
<p><b>Q3.</b> Explain hydrogen spectrum series.<br><b>Ans:</b> Lyman (UV, to n=1), Balmer (visible, n=2), Paschen/Brackett (IR).</p>
<p><b>Q4.</b> Define nucleus composition.<br><b>Ans:</b> Protons (Z) + neutrons (N); A = Z + N.</p>
<p><b>Q5.</b> Explain isotopes with example.<br><b>Ans:</b> Same Z, different A; e.g., ¹H, ²H, ³H.</p>
<p><b>Q6.</b> Explain mass-energy equivalence.<br><b>Ans:</b> E = mc²; mass converts to energy (binding energy).</p>
<p><b>Q7.</b> Explain binding energy per nucleon.<br><b>Ans:</b> BE/A; measure of stability; max near Fe (~8.8 MeV).</p>
<p><b>Q8.</b> Explain radioactive decay law.<br><b>Ans:</b> N = N0 e^(−λt); activity decreases exponentially.</p>
<p><b>Q9.</b> Properties of alpha, beta, gamma.<br><b>Ans:</b> α: heavy, +2e, low penetration. β: electron, medium. γ: EM, high penetration.</p>
<p><b>Q10.</b> Explain nuclear fission.<br><b>Ans:</b> Heavy nucleus (U-235) splits; releases neutrons + energy; chain reaction.</p>
<p><b>Q11.</b> Explain nuclear fusion.<br><b>Ans:</b> Light nuclei combine (H→He); releases large energy; needs high T.</p>
<p><b>Q12.</b> Define activity of a radioactive sample.<br><b>Ans:</b> Decays per second: A = λN; unit becquerel (Bq).</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive radius of nth Bohr orbit.<br><b>Ans:</b> Equate Coulomb to centripetal + quantize L → rn = 0.529 n²/Z Å.</p>
<p><b>Q2.</b> Derive energy of nth orbit.<br><b>Ans:</b> En = −(me⁴/8ε₀²h²)(Z²/n²) = −13.6 Z²/n² eV.</p>
<p><b>Q3.</b> Explain hydrogen spectrum with series.<br><b>Ans:</b> Transitions give Lyman/Balmer/Paschen; 1/λ = R(1/n1² − 1/n2²).</p>
<p><b>Q4.</b> Derive radioactive decay law.<br><b>Ans:</b> dN/dt = −λN → N = N0 e^(−λt).</p>
<p><b>Q5.</b> Derive T½ = 0.693/λ.<br><b>Ans:</b> At t = T½, N = N0/2 → e^(λT½) = 2 → T½ = ln2/λ = 0.693/λ.</p>
<p><b>Q6.</b> Explain binding energy and stability.<br><b>Ans:</b> BE = Δm c²; higher BE/A = more stable; curve peaks at Fe.</p>
<p><b>Q7.</b> Explain mass defect with example.<br><b>Ans:</b> Δm = (Zmp + Nmn) − M; converts to binding energy.</p>
<p><b>Q8.</b> Explain alpha decay.<br><b>Ans:</b> Emits ⁴He; Z−2, A−4; e.g., U→Th + α.</p>
<p><b>Q9.</b> Explain beta decay.<br><b>Ans:</b> n → p + e + antineutrino; Z+1, A same.</p>
<p><b>Q10.</b> Explain gamma emission.<br><b>Ans:</b> Excited nucleus emits photon; Z, A unchanged.</p>
<p><b>Q11.</b> Explain chain reaction in fission.<br><b>Ans:</b> Neutrons from one fission cause more fissions; controlled (reactor) or uncontrolled (bomb).</p>
<p><b>Q12.</b> Compare fission and fusion.<br><b>Ans:</b> Fission: heavy splits; fusion: light combine; both release energy; fusion needs high T.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> Rutherford experiment; nuclear model; limitations.<br><b>Ans:</b> Scattering shows small dense nucleus. Limitation: couldn't explain stability & spectrum (fixed by Bohr).</p>
<p><b>Q2.</b> Bohr model: postulates; derive radius & energy; hydrogen spectrum.<br><b>Ans:</b> L = nh/2π; rn ∝ n²; En = −13.6/n² eV; spectrum series.</p>
<p><b>Q3.</b> Radioactive decay law; half-life; activity.<br><b>Ans:</b> N = N0e^(−λt); T½ = 0.693/λ; A = λN.</p>
<p><b>Q4.</b> Mass defect; binding energy; BE/A curve; fission & fusion.<br><b>Ans:</b> BE = Δm c²; curve peaks at Fe; fission (heavy splits), fusion (light combine).</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>Bohr:</b> L = nh/2π | rn = 0.529 n²/Z Å | En = −13.6 Z²/n² eV</p>
<p><b>Spectrum:</b> 1/λ = R(1/n1² − 1/n2²)</p>
<p><b>Decay:</b> N = N0 e^(−λt) | T½ = 0.693/λ | A = λN</p>
<p><b>Mass-energy:</b> BE = Δm c² | Δm = Zmp + (A−Z)mn − M</p>

notesData["16. Semiconductor Devices"]=`
<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> Conductivity of a semiconductor with temperature:<br>(a) decreases (b) increases (c) constant (d) zero<br><b>Ans:</b> (b) increases</p>
<p><b>Q2.</b> In intrinsic semiconductor, electrons and holes are:<br>(a) equal (b) unequal (c) zero (d) none<br><b>Ans:</b> (a) equal</p>
<p><b>Q3.</b> n-type majority carriers are:<br>(a) holes (b) electrons (c) protons (d) none<br><b>Ans:</b> (b) electrons (donor, pentavalent)</p>
<p><b>Q4.</b> p-type majority carriers are:<br>(a) electrons (b) holes (c) neutrons (d) none<br><b>Ans:</b> (b) holes (acceptor, trivalent)</p>
<p><b>Q5.</b> In forward bias, p-side is connected to:<br>(a) negative (b) positive (c) ground (d) none<br><b>Ans:</b> (b) positive</p>
<p><b>Q6.</b> Depletion region is:<br>(a) full of carriers (b) near junction, no free carriers (c) metal (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q7.</b> A rectifier converts:<br>(a) DC to AC (b) AC to DC (c) AC to AC (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q8.</b> Half wave rectifier uses:<br>(a) 1 diode (b) 2 diodes (c) 4 diodes (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q9.</b> Full wave rectifier uses:<br>(a) 1 diode (b) 2 diodes (c) none (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q10.</b> Zener diode is used as:<br>(a) amplifier (b) voltage regulator (c) rectifier only (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q11.</b> AND gate output is 1 when:<br>(a) any input 1 (b) both inputs 1 (c) both 0 (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q12.</b> OR gate output is 1 when:<br>(a) both 0 (b) any input 1 (c) both 1 only (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q13.</b> NOT gate:<br>(a) inverts input (b) same output (c) and (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q14.</b> NAND gate is:<br>(a) AND + NOT (b) OR + NOT (c) NOT only (d) none<br><b>Ans:</b> (a) universal gate</p>
<p><b>Q15.</b> Universal gates are:<br>(a) AND, OR (b) NAND, NOR (c) NOT (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q16.</b> Energy gap of a semiconductor is about:<br>(a) 0 eV (b) ~1 eV (c) 5 eV (d) 10 eV<br><b>Ans:</b> (b) (Si ≈ 1.1 eV)</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> Define intrinsic semiconductor.<br><b>Ans:</b> Pure semiconductor; electrons = holes.</p>
<p><b>Q2.</b> Define extrinsic semiconductor.<br><b>Ans:</b> Doped semiconductor (n-type or p-type).</p>
<p><b>Q3.</b> What is doping?<br><b>Ans:</b> Adding impurity to increase conductivity.</p>
<p><b>Q4.</b> Define n-type semiconductor.<br><b>Ans:</b> Pentavalent dopant; electrons majority.</p>
<p><b>Q5.</b> Define p-type semiconductor.<br><b>Ans:</b> Trivalent dopant; holes majority.</p>
<p><b>Q6.</b> What is a p-n junction?<br><b>Ans:</b> Boundary of p and n regions; forms depletion region.</p>
<p><b>Q7.</b> Define depletion region.<br><b>Ans:</b> Region near junction without free carriers.</p>
<p><b>Q8.</b> Define forward bias.<br><b>Ans:</b> p to +, n to −; junction conducts.</p>
<p><b>Q9.</b> Define reverse bias.<br><b>Ans:</b> p to −, n to +; junction blocks current.</p>
<p><b>Q10.</b> What is a rectifier?<br><b>Ans:</b> Converts AC to DC using diode.</p>
<p><b>Q11.</b> What is a Zener diode?<br><b>Ans:</b> Heavily doped diode used in reverse breakdown as voltage regulator.</p>
<p><b>Q12.</b> Define logic gate.<br><b>Ans:</b> Digital circuit implementing Boolean operation (AND, OR, NOT...).</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> Classify solids: conductor, semiconductor, insulator.<br><b>Ans:</b> Conductor: no gap. Semiconductor: small gap (~1 eV). Insulator: large gap.</p>
<p><b>Q2.</b> Explain intrinsic semiconductor.<br><b>Ans:</b> Pure; thermal excitation creates equal electrons & holes.</p>
<p><b>Q3.</b> Explain n-type semiconductor.<br><b>Ans:</b> Pentavalent (P, As) donor gives extra electrons; electrons majority.</p>
<p><b>Q4.</b> Explain p-type semiconductor.<br><b>Ans:</b> Trivalent (B, Al) acceptor creates holes; holes majority.</p>
<p><b>Q5.</b> Explain p-n junction and depletion region.<br><b>Ans:</b> Diffusion creates depletion region; barrier potential.</p>
<p><b>Q6.</b> Explain forward and reverse bias.<br><b>Ans:</b> Forward: conducts (low resistance). Reverse: blocks (high resistance).</p>
<p><b>Q7.</b> Explain diode V-I characteristics.<br><b>Ans:</b> Forward: current after knee voltage. Reverse: tiny current till breakdown.</p>
<p><b>Q8.</b> Explain half wave rectifier.<br><b>Ans:</b> 1 diode; conducts one half cycle; output = pulsating DC.</p>
<p><b>Q9.</b> Explain full wave rectifier.<br><b>Ans:</b> 2 diodes; both half cycles used; smoother DC; output freq = 2f.</p>
<p><b>Q10.</b> Explain Zener diode as regulator.<br><b>Ans:</b> Operates in reverse breakdown; maintains constant voltage.</p>
<p><b>Q11.</b> Explain transistor briefly.<br><b>Ans:</b> Three regions (emitter, base, collector); amplifies/switches.</p>
<p><b>Q12.</b> Explain logic gates with truth tables.<br><b>Ans:</b> AND (1 only if both 1), OR (1 if any 1), NOT (inverts).</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Explain energy bands; classify solids.<br><b>Ans:</b> Valence & conduction bands; gap decides conductor/semiconductor/insulator.</p>
<p><b>Q2.</b> Explain formation of n-type and p-type.<br><b>Ans:</b> Doping with pentavalent → n-type; trivalent → p-type.</p>
<p><b>Q3.</b> Explain p-n junction; depletion region; barrier.<br><b>Ans:</b> Diffusion → depletion region → barrier potential (~0.7 V Si).</p>
<p><b>Q4.</b> Explain diode characteristics (forward & reverse).<br><b>Ans:</b> Forward knee voltage; reverse breakdown; Zener region.</p>
<p><b>Q5.</b> Explain half wave rectifier with output.<br><b>Ans:</b> 1 diode; conducts half cycle; output freq = f.</p>
<p><b>Q6.</b> Explain full wave rectifier with output.<br><b>Ans:</b> 2 diodes; both cycles; output freq = 2f; smoother.</p>
<p><b>Q7.</b> Explain Zener diode voltage regulation.<br><b>Ans:</b> Reverse breakdown keeps voltage constant across load.</p>
<p><b>Q8.</b> Write truth tables for AND, OR, NOT, NAND, NOR.<br><b>Ans:</b> AND:1 if both 1; OR:1 if any 1; NOT:invert; NAND:NAND; NOR:NOR.</p>
<p><b>Q9.</b> Explain transistor action (npn).<br><b>Ans:</b> Emitter injects electrons; thin base; collector collects; amplifies.</p>
<p><b>Q10.</b> Realize basic gates using NAND.<br><b>Ans:</b> NAND universal: NOT = NAND inputs tied; AND = NAND+NAND; OR via NAND.</p>
<p><b>Q11.</b> Explain semiconductor conductivity vs temperature.<br><b>Ans:</b> More thermal excitation → more carriers → conductivity ↑.</p>
<p><b>Q12.</b> n_i² = ne·nh relation.<br><b>Ans:</b> Intrinsic carrier concentration squared = electron × hole concentration.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> Energy bands; classify solids; intrinsic & extrinsic.<br><b>Ans:</b> Bands & gap; conductor/semiconductor/insulator; intrinsic pure, extrinsic doped (n/p).</p>
<p><b>Q2.</b> p-n junction; biasing; V-I characteristics.<br><b>Ans:</b> Depletion region; forward conducts, reverse blocks; V-I curve.</p>
<p><b>Q3.</b> Rectifiers: half & full wave.<br><b>Ans:</b> Half: 1 diode, freq f. Full: 2 diodes, freq 2f; AC→DC.</p>
<p><b>Q4.</b> Zener diode; logic gates & truth tables.<br><b>Ans:</b> Zener regulator; AND/OR/NOT/NAND/NOR truth tables; universal gates.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>Mass action:</b> n_i² = ne·nh</p>
<p><b>Rectifier output freq:</b> half = f | full = 2f</p>
<p><b>Gates:</b> AND = A·B | OR = A+B | NOT = Ā | NAND = (A·B)̄ | NOR = (A+B)̄</p>
<h3>📐 KEY POINTS</h3>
<p><b>n-type:</b> electrons majority (donor, pentavalent)</p>
<p><b>p-type:</b> holes majority (acceptor, trivalent)</p>
<p><b>Forward bias:</b> conducts | <b>Reverse bias:</b> blocks</p>
<p><b>Universal gates:</b> NAND, NOR</p>
<h3>🎨 DIAGRAMS TO PRACTICE</h3>
<p><b>1. p-n junction:</b> p, n, depletion region.</p>
<p><b>2. Diode V-I curve:</b> knee voltage, breakdown.</p>
<p><b>3. Rectifier circuits:</b> half & full wave.</p>
<h3>🔢 NUMERICALS TRICKS</h3>
<p><b>1.</b> Si gap ≈ 1.1 eV; Ge ≈ 0.7 eV.</p>
<p><b>2.</b> Full wave output freq = 2 × input.</p>
<p><b>3.</b> NAND/NOR universal.</p>
<h3>⭐ TOP 10 BOARD QUESTIONS</h3>
<p><b>1.</b> Energy bands; classify solids; intrinsic/extrinsic. (4 marks)</p>
<p><b>2.</b> p-n junction; biasing; V-I. (4 marks)</p>
<p><b>3.</b> Half & full wave rectifier. (4 marks)</p>
<p><b>4.</b> Zener diode; logic gates. (4 marks)</p>
<p><b>5.</b> Define n-type & p-type. (2 marks)</p>
<p><b>6.</b> Truth tables AND/OR/NOT. (3 marks)</p>
<p><b>7.</b> Explain doping. (2 marks)</p>
<p><b>8.</b> Define depletion region. (2 marks)</p>
<p><b>9.</b> Universal gates. (2 marks)</p>
<p><b>10.</b> Rectifier definition. (2 marks)</p>
