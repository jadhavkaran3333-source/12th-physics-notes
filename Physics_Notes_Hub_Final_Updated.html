<p><b>Q8.</b> Bernoulli's theorem is based on conservation of:<br>(a) mass (b) momentum (c) energy (d) charge<br><b>Ans:</b> (c) energy</p>
<p><b>Q9.</b> The equation of continuity is based on conservation of:<br>(a) energy (b) mass (c) momentum (d) angular momentum<br><b>Ans:</b> (b) mass</p>
<p><b>Q10.</b> A body attains terminal velocity when:<br>(a) it starts falling (b) net force is zero (c) velocity is maximum always (d) none<br><b>Ans:</b> (b) net force is zero</p>
<p><b>Q11.</b> According to Stokes' law, viscous force on a sphere is:<br>(a) 6πηrv (b) 4πηrv (c) 2πηrv (d) 8πηrv<br><b>Ans:</b> (a) 6πηrv</p>
<p><b>Q12.</b> Excess pressure inside a liquid drop is:<br>(a) T/r (b) 2T/r (c) 4T/r (d) T/2r<br><b>Ans:</b> (b) 2T/r</p>
<p><b>Q13.</b> Excess pressure inside a soap bubble is:<br>(a) 2T/r (b) T/r (c) 4T/r (d) 8T/r<br><b>Ans:</b> (c) 4T/r</p>
<p><b>Q14.</b> The capillary rise h is given by:<br>(a) 2T cosθ/(rρg) (b) T cosθ/(rρg) (c) 2T/(rρg) (d) 2Tr/(ρg)<br><b>Ans:</b> (a) 2T cosθ/(rρg)</p>
<p><b>Q15.</b> The angle of contact between pure water and clean glass is:<br>(a) 0° (b) 90° (c) obtuse (d) 180°<br><b>Ans:</b> (a) 0°</p>
<p><b>Q16.</b> The angle of contact between mercury and glass is:<br>(a) 0° (b) acute (c) obtuse (~140°) (d) 90°<br><b>Ans:</b> (c) obtuse</p>
<p><b>Q17.</b> According to Torricelli's law, velocity of efflux is:<br>(a) √(gh) (b) √(2gh) (c) 2√(gh) (d) gh<br><b>Ans:</b> (b) √(2gh)</p>
<p><b>Q18.</b> In streamline flow, velocity of a particle at a point:<br>(a) changes with time (b) remains constant with time (c) is zero (d) none<br><b>Ans:</b> (b) constant with time</p>
<p><b>Q19.</b> Reynold's number determines:<br>(a) pressure (b) nature of flow (c) viscosity (d) surface tension<br><b>Ans:</b> (b) nature of flow</p>
<p><b>Q20.</b> The upward force exerted by a fluid on an immersed body is:<br>(a) viscous force (b) buoyant force (c) surface tension (d) drag<br><b>Ans:</b> (b) buoyant force</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> Define pressure and state its SI unit.<br><b>Ans:</b> Pressure is force per unit area, P = F/A. SI unit: Pascal (Pa = N/m²).</p>
<p><b>Q2.</b> State Pascal's law.<br><b>Ans:</b> Pressure applied to an enclosed fluid is transmitted equally in all directions.</p>
<p><b>Q3.</b> What is surface tension? State its SI unit.<br><b>Ans:</b> The property of a liquid surface to contract to minimum area. SI unit: N/m.</p>
<p><b>Q4.</b> Define coefficient of viscosity and its SI unit.<br><b>Ans:</b> Measure of a fluid's resistance to flow. SI unit: Pa·s.</p>
<p><b>Q5.</b> State Bernoulli's theorem.<br><b>Ans:</b> For steady incompressible flow, P + ½ρv² + ρgh = constant.</p>
<p><b>Q6.</b> What is streamline flow?<br><b>Ans:</b> Flow in which the velocity at each point remains constant with time.</p>
<p><b>Q7.</b> Define terminal velocity.<br><b>Ans:</b> The maximum constant velocity of a falling body in a viscous fluid when net force is zero.</p>
<p><b>Q8.</b> What is capillarity?<br><b>Ans:</b> The rise or fall of a liquid in a narrow tube due to surface tension.</p>
<p><b>Q9.</b> Define angle of contact.<br><b>Ans:</b> The angle between the tangent to the liquid surface and the solid surface inside the liquid.</p>
<p><b>Q10.</b> Write the formula for excess pressure inside a liquid drop.<br><b>Ans:</b> Excess pressure = 2T/r.</p>
<p><b>Q11.</b> State Archimedes' principle.<br><b>Ans:</b> A body immersed in a fluid experiences an upthrust equal to the weight of the displaced fluid.</p>
<p><b>Q12.</b> Define fluid.<br><b>Ans:</b> A substance that can flow (liquids and gases).</p>
<p><b>Q13.</b> What is gauge pressure?<br><b>Ans:</b> Pressure above atmospheric pressure, P_gauge = P − P_atm.</p>
<p><b>Q14.</b> Define surface energy.<br><b>Ans:</b> Work done to increase the surface area of a liquid; W = T·ΔA.</p>
<p><b>Q15.</b> What is Reynold's number?<br><b>Ans:</b> A dimensionless number Re = ρvd/η that decides whether flow is laminar or turbulent.</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> Define pressure and write its formula.<br><b>Ans:</b> Pressure is the normal force per unit area, P = F/A. SI unit Pascal. It is a scalar quantity.</p>
<p><b>Q2.</b> Explain the working of a hydraulic lift.<br><b>Ans:</b> By Pascal's law, F₁/A₁ = F₂/A₂. A small force on a small piston produces a large force on a large piston, lifting heavy loads.</p>
<p><b>Q3.</b> Why are rain drops spherical?<br><b>Ans:</b> Surface tension minimizes surface area. For a given volume, a sphere has the minimum surface area.</p>
<p><b>Q4.</b> Distinguish between streamline and turbulent flow.<br><b>Ans:</b> Streamline: velocity constant at each point, smooth, Re < 2000. Turbulent: velocity changes irregularly, chaotic, Re > 3000.</p>
<p><b>Q5.</b> State and explain Archimedes' principle.<br><b>Ans:</b> A body immersed in fluid experiences upthrust equal to weight of displaced fluid. Upthrust = Vρg.</p>
<p><b>Q6.</b> Why does a person feel lighter in water?<br><b>Ans:</b> The buoyant force (upthrust) acts upward and reduces the apparent weight.</p>
<p><b>Q7.</b> What is surface tension? State factors affecting it.<br><b>Ans:</b> Force per unit length on the surface (T = F/l). It decreases with temperature and is affected by impurities.</p>
<p><b>Q8.</b> Explain angle of contact for water-glass and mercury-glass.<br><b>Ans:</b> Water-glass: adhesive forces dominate, angle ≈ 0°. Mercury-glass: cohesive forces dominate, angle ≈ 140°.</p>
<p><b>Q9.</b> State Bernoulli's theorem and give its mathematical form.<br><b>Ans:</b> For steady incompressible flow, P + ½ρv² + ρgh = constant.</p>
<p><b>Q10.</b> What is capillarity? Give two examples.<br><b>Ans:</b> Rise/fall of liquid in a narrow tube due to surface tension. Examples: oil in a wick, water rising in plants.</p>
<p><b>Q11.</b> Why does a needle float on water?<br><b>Ans:</b> Surface tension forms a stretched membrane that supports the needle's weight.</p>
<p><b>Q12.</b> Define viscosity and state factors affecting it.<br><b>Ans:</b> Internal friction resisting relative motion of fluid layers. Liquids: viscosity decreases with temperature; gases: increases.</p>
<p><b>Q13.</b> Explain terminal velocity.<br><b>Ans:</b> Viscous force increases with velocity until it balances weight; then the body falls with constant velocity.</p>
<p><b>Q14.</b> State the equation of continuity.<br><b>Ans:</b> For incompressible flow, A₁v₁ = A₂v₂. Where area is smaller, velocity is higher.</p>
<p><b>Q15.</b> Why is pressure greater at the bottom of a liquid?<br><b>Ans:</b> Pressure increases with depth as P = hρg.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive the expression for pressure at a depth h in a liquid.<br><b>Ans:</b> Weight of liquid column above = (hA)ρg. Pressure P = Force/Area = hρg. Absolute pressure = P_atm + hρg.</p>
<p><b>Q2.</b> Derive excess pressure inside a liquid drop.<br><b>Ans:</b> A liquid drop has one free surface. Excess pressure P = 2T/r.</p>
<p><b>Q3.</b> Derive excess pressure inside a soap bubble.<br><b>Ans:</b> A soap bubble has two free surfaces, so excess pressure = 4T/r.</p>
<p><b>Q4.</b> Derive capillary rise h = 2T cosθ/(rρg).<br><b>Ans:</b> Upward force = 2πrT cosθ; weight = πr²hρg. Equating: h = 2T cosθ/(rρg).</p>
<p><b>Q5.</b> Derive terminal velocity using Stokes' law.<br><b>Ans:</b> At terminal velocity, weight = viscous + buoyant. Solving: v_t = 2r²(ρ−σ)g/(9η).</p>
<p><b>Q6.</b> Derive the equation of continuity A₁v₁ = A₂v₂.<br><b>Ans:</b> Mass flow rate constant: ρA₁v₁ = ρA₂v₂; since ρ constant, A₁v₁ = A₂v₂.</p>
<p><b>Q7.</b> Derive Bernoulli's theorem.<br><b>Ans:</b> Using energy conservation for flowing fluid: P + ½ρv² + ρgh = constant along a streamline.</p>
<p><b>Q8.</b> Derive Torricelli's law of efflux.<br><b>Ans:</b> Bernoulli between surface and hole: ρgh = ½ρv², so v = √(2gh).</p>
<p><b>Q9.</b> Derive the expression for buoyant force.<br><b>Ans:</b> Upthrust = weight of displaced fluid = Vρg.</p>
<p><b>Q10.</b> Explain Venturimeter.<br><b>Ans:</b> A device using a constriction to measure flow speed via pressure drop (Bernoulli + continuity).</p>
<p><b>Q11.</b> Relate surface tension and surface energy.<br><b>Ans:</b> Work to increase area ΔA is W = T·ΔA; so surface energy per unit area = surface tension T.</p>
<p><b>Q12.</b> Explain hydraulic brake with Pascal's law.<br><b>Ans:</b> Pressure from master cylinder is transmitted equally to all wheel cylinders, giving equal braking force.</p>
<p><b>Q13.</b> Give two applications of Bernoulli's theorem.<br><b>Ans:</b> (1) Aeroplane lift (faster air → lower pressure above wing). (2) Atomizer/spray.</p>
<p><b>Q14.</b> Derive pressure due to a liquid column.<br><b>Ans:</b> Weight = hAρg; pressure at base = weight/area = hρg.</p>
<p><b>Q15.</b> Explain the law of floatation.<br><b>Ans:</b> A body floats when weight = upthrust: mg = V_sub ρg.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> State and prove Bernoulli's theorem and give applications.<br><b>Ans:</b> For steady incompressible flow, P + ½ρv² + ρgh = constant (from energy conservation). Applications: aeroplane lift, atomizer, Venturimeter, Magnus effect.</p>
<p><b>Q2.</b> Derive capillary rise formula and discuss effect of angle of contact.<br><b>Ans:</b> 2πrT cosθ = πr²hρg → h = 2T cosθ/(rρg). If θ < 90°, liquid rises; if θ > 90° (mercury), liquid falls.</p>
<p><b>Q3.</b> Derive terminal velocity and explain Stokes' law.<br><b>Ans:</b> Stokes: F = 6πηrv. At terminal velocity, (4/3)πr³ρg = 6πηrv_t + (4/3)πr³σg → v_t = 2r²(ρ−σ)g/(9η).</p>
<p><b>Q4.</b> Derive excess pressure inside a liquid drop and a soap bubble.<br><b>Ans:</b> Drop (one surface): 2T/r. Soap bubble (two surfaces): 4T/r.</p>
<p><b>Q5.</b> State Pascal's law and explain hydraulic lift and brake.<br><b>Ans:</b> Pressure in enclosed fluid transmitted equally. Lift: F₁/A₁ = F₂/A₂. Brake: equal force at all wheels.</p>
<p><b>Q6.</b> Explain surface tension and surface energy with examples.<br><b>Ans:</b> Surface tension T = F/l (cohesive forces). Surface energy W = T·ΔA. Examples: drops spherical, needle floats, capillary rise.</p>
<p><b>Q7.</b> Distinguish streamline and turbulent flow; state continuity and Bernoulli.<br><b>Ans:</b> Streamline (smooth, Re<2000) vs turbulent (chaotic, Re>3000). Continuity: A₁v₁=A₂v₂. Bernoulli: P+½ρv²+ρgh=constant.</p>
<p><b>Q8.</b> State Archimedes' principle and derive law of floatation.<br><b>Ans:</b> Upthrust = weight of displaced fluid = Vρg. For floating, mg = V_sub ρg.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>Pressure:</b> P = F/A | P = hρg | P_total = P_atm + hρg</p>
<p><b>Pascal:</b> F₁/A₁ = F₂/A₂</p>
<p><b>Surface tension:</b> T = F/l | W = T·ΔA | Drop: 2T/r | Soap bubble: 4T/r</p>
<p><b>Capillary:</b> h = 2T cosθ/(rρg)</p>
<p><b>Viscosity:</b> Stokes F = 6πηrv | v_t = 2r²(ρ−σ)g/(9η)</p>
<p><b>Continuity:</b> A₁v₁ = A₂v₂ | <b>Bernoulli:</b> P + ½ρv² + ρgh = constant | <b>Torricelli:</b> v = √(2gh)</p>
<p><b>Upthrust:</b> = Vρg | <b>Reynold:</b> Re = ρvd/η</p>
<h3>📐 VALUES TO MEMORISE</h3>
<p><b>ρ water</b> = 1000 kg/m³ | <b>ρ mercury</b> = 13600 kg/m³</p>
<p><b>η water</b> ≈ 10⁻³ Pa·s | <b>η glycerine</b> ≈ 0.83 Pa·s</p>
<p><b>T water</b> ≈ 0.072 N/m | <b>T mercury</b> ≈ 0.47 N/m</p>
<p><b>P_atm</b> ≈ 1.013 × 10⁵ Pa | <b>g</b> = 9.8 m/s²</p>
<h3>🎨 DIAGRAMS TO PRACTICE</h3>
<p><b>1. Hydraulic lift:</b> Two pistons; show F₁/A₁ = F₂/A₂.</p>
<p><b>2. Capillary rise/fall:</b> Narrow tube, liquid rising (water) or falling (mercury), angle θ.</p>
<p><b>3. Surface tension:</b> Needle floating on water.</p>
<p><b>4. Venturimeter:</b> Pipe with constriction + manometer.</p>
<p><b>5. Body immersed in fluid:</b> mg down, upthrust Vρg up.</p>
<p><b>6. Angle of contact:</b> Water-glass (acute) vs mercury-glass (obtuse) meniscus.</p>
<h3>🔢 NUMERICALS TRICKS</h3>
<p><b>1.</b> P = hρg; add P_atm for absolute pressure.</p>
<p><b>2.</b> Capillary: h ∝ 1/r (radius doubled → rise halved).</p>
<p><b>3.</b> Terminal velocity: v_t ∝ r² (radius doubled → v_t 4×).</p>
<p><b>4.</b> Drop/Bubble: excess pressure ∝ 1/r; soap bubble = 2 × drop.</p>
<p><b>5.</b> Continuity: A₁v₁ = A₂v₂ (area halved → velocity doubled).</p>

<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> An ideal gas obeys the gas laws at:<br>(a) only high temperature (b) only low pressure (c) all temperatures and pressures (d) none<br><b>Ans:</b> (c)</p>
<p><b>Q2.</b> According to Boyle's law, at constant temperature:<br>(a) P ∝ V (b) P ∝ 1/V (c) V ∝ T (d) P ∝ T<br><b>Ans:</b> (b) P ∝ 1/V</p>
<p><b>Q3.</b> According to Charles's law, at constant pressure:<br>(a) V ∝ T (b) V ∝ 1/T (c) P ∝ V (d) P ∝ 1/V<br><b>Ans:</b> (a) V ∝ T</p>
<p><b>Q4.</b> The average kinetic energy of a gas molecule is:<br>(a) ½kT (b) kT (c) (3/2)kT (d) 3kT<br><b>Ans:</b> (c) (3/2)kT</p>
<p><b>Q5.</b> The rms velocity of a gas molecule is:<br>(a) √(kT/m) (b) √(3kT/m) (c) √(2kT/m) (d) √(3RT/m)<br><b>Ans:</b> (b) √(3kT/m)</p>
<p><b>Q6.</b> The pressure of an ideal gas is:<br>(a) ⅓ρ<c²> (b) ½ρ<c²> (c) ρ<c²> (d) ⅔ρ<c²><br><b>Ans:</b> (a) ⅓ρ<c²></p>
<p><b>Q7.</b> The average KE of a gas molecule depends on:<br>(a) pressure (b) volume (c) temperature only (d) mass<br><b>Ans:</b> (c) temperature only</p>
<p><b>Q8.</b> Degrees of freedom of a monatomic gas molecule:<br>(a) 3 (b) 5 (c) 6 (d) 1<br><b>Ans:</b> (a) 3</p>
<p><b>Q9.</b> Degrees of freedom of a diatomic gas molecule:<br>(a) 3 (b) 5 (c) 6 (d) 7<br><b>Ans:</b> (b) 5</p>
<p><b>Q10.</b> For a monatomic gas, γ = Cp/Cv is:<br>(a) 5/3 (b) 7/5 (c) 4/3 (d) 3/2<br><b>Ans:</b> (a) 5/3</p>
<p><b>Q11.</b> For a diatomic gas, γ = Cp/Cv is:<br>(a) 5/3 (b) 7/5 (c) 4/3 (d) 1<br><b>Ans:</b> (b) 7/5</p>
<p><b>Q12.</b> According to equipartition theorem, energy per degree of freedom is:<br>(a) kT (b) ½kT (c) 3/2kT (d) 2kT<br><b>Ans:</b> (b) ½kT</p>
<p><b>Q13.</b> Stefan's law states energy radiated per unit area per second:<br>(a) E ∝ T (b) E ∝ T² (c) E ∝ T⁴ (d) E ∝ 1/T⁴<br><b>Ans:</b> (c) E ∝ T⁴</p>
<p><b>Q14.</b> Wien's displacement law is:<br>(a) λ_max T = constant (b) λ_max/T = constant (c) λ_max + T = constant (d) λ_max² T = constant<br><b>Ans:</b> (a) λ_max T = constant</p>
<p><b>Q15.</b> A black body absorbs:<br>(a) only visible light (b) all incident radiation (c) no radiation (d) only IR<br><b>Ans:</b> (b) all incident radiation</p>
<p><b>Q16.</b> Newton's law of cooling states rate of cooling is proportional to:<br>(a) T (b) T² (c) (T − T_surrounding) (d) 1/T<br><b>Ans:</b> (c) (T − T_surrounding)</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> State Boyle's law.<br><b>Ans:</b> At constant temperature, pressure of a gas is inversely proportional to its volume (P ∝ 1/V).</p>
<p><b>Q2.</b> State Charles's law.<br><b>Ans:</b> At constant pressure, volume of a gas is directly proportional to absolute temperature (V ∝ T).</p>
<p><b>Q3.</b> Write the ideal gas equation.<br><b>Ans:</b> PV = nRT.</p>
<p><b>Q4.</b> Define rms speed.<br><b>Ans:</b> Root mean square of speeds of molecules: v_rms = √(3kT/m).</p>
<p><b>Q5.</b> Write KE per molecule of a gas.<br><b>Ans:</b> KE = (3/2)kT.</p>
<p><b>Q6.</b> What is an ideal gas?<br><b>Ans:</b> A gas that obeys PV = nRT at all temperatures and pressures.</p>
<p><b>Q7.</b> State Stefan's law.<br><b>Ans:</b> Energy radiated per unit area per second E = σT⁴.</p>
<p><b>Q8.</b> State Wien's displacement law.<br><b>Ans:</b> λ_max T = b (constant); wavelength of max intensity is inversely proportional to temperature.</p>
<p><b>Q9.</b> Define black body.<br><b>Ans:</b> A body that absorbs all radiation incident on it and emits maximum radiation.</p>
<p><b>Q10.</b> What is mean free path?<br><b>Ans:</b> Average distance travelled by a molecule between two successive collisions.</p>
<p><b>Q11.</b> State equipartition theorem.<br><b>Ans:</b> Energy is equally distributed among degrees of freedom; each DOF has (1/2)kT energy.</p>
<p><b>Q12.</b> Value of Boltzmann constant.<br><b>Ans:</b> k = 1.38 × 10⁻²³ J/K.</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> State the postulates of kinetic theory of gases.<br><b>Ans:</b> Gas consists of tiny molecules in random motion; collisions are perfectly elastic; intermolecular forces negligible; volume of molecules negligible; pressure is due to collisions with walls.</p>
<p><b>Q2.</b> Derive P = (1/3)ρ<c²> (outline).<br><b>Ans:</b> From momentum transfer by molecules hitting walls: P = (1/3)(N/V)m<c²> = (1/3)ρ<c²>, where ρ is density.</p>
<p><b>Q3.</b> Explain degrees of freedom.<br><b>Ans:</b> Number of independent ways a molecule can move/store energy. Monatomic: 3 (translational); diatomic: 5 (3 translational + 2 rotational).</p>
<p><b>Q4.</b> Explain mean free path.<br><b>Ans:</b> Average distance a molecule travels between collisions. λ = 1/(√2 π d² n), where d is molecular diameter and n is number density.</p>
<p><b>Q5.</b> Why does pressure increase with temperature at constant volume?<br><b>Ans:</b> Higher T → higher molecular KE → faster molecules → more forceful/frequent collisions with walls → higher pressure.</p>
<p><b>Q6.</b> State and explain equipartition of energy.<br><b>Ans:</b> At thermal equilibrium, total energy is equally shared among all degrees of freedom; each DOF has (1/2)kT energy.</p>
<p><b>Q7.</b> Write relation between Cp and Cv.<br><b>Ans:</b> Cp − Cv = R (Mayer's relation), where R is the universal gas constant.</p>
<p><b>Q8.</b> Explain black body radiation.<br><b>Ans:</b> A black body absorbs all incident radiation and emits the maximum possible radiation at every wavelength for a given temperature.</p>
<p><b>Q9.</b> State Kirchhoff's law of radiation.<br><b>Ans:</b> For a given wavelength and temperature, the ratio of emissive power to absorptive power is the same for all bodies and equals that of a black body.</p>
<p><b>Q10.</b> Explain Wien's law.<br><b>Ans:</b> λ_max T = b. As temperature increases, the wavelength of maximum intensity shifts to shorter wavelengths.</p>
<p><b>Q11.</b> State Newton's law of cooling.<br><b>Ans:</b> Rate of loss of heat is proportional to the temperature difference between the body and surroundings.</p>
<p><b>Q12.</b> Write Stefan's law and value of σ.<br><b>Ans:</b> E = σT⁴; σ = 5.67 × 10⁻⁸ W m⁻² K⁻⁴.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive pressure of an ideal gas P = (1/3)(N/V)mv².<br><b>Ans:</b> Consider molecules in a cube. Momentum change per collision = 2mv_x. Collisions per second = v_x/(2l). Force on wall, averaged over molecules and directions, gives P = (1/3)(N/V)m<c²>.</p>
<p><b>Q2.</b> Derive KE per molecule = (3/2)kT.<br><b>Ans:</b> From P = (1/3)(N/V)m<c²> and PV = NkT: (1/3)m<c²> = kT → (1/2)m<c²> = (3/2)kT = KE per molecule.</p>
<p><b>Q3.</b> Deduce Boyle's law from kinetic theory.<br><b>Ans:</b> P = (1/3)(N/V)m<c²>. At constant T, <c²> is constant, so PV = constant → P ∝ 1/V (Boyle's law).</p>
<p><b>Q4.</b> Deduce Charles's law from kinetic theory.<br><b>Ans:</b> (1/2)m<c²> = (3/2)kT. At constant P, V ∝ <c²> ∝ T → V ∝ T (Charles's law).</p>
<p><b>Q5.</b> Derive Cp − Cv = R.<br><b>Ans:</b> For one mole, ΔQ = ΔU + ΔW. At constant volume ΔQ_v = CvΔT = ΔU. At constant pressure ΔQ_p = CpΔT = ΔU + RΔT. Subtracting: (Cp − Cv)ΔT = RΔT → Cp − Cv = R.</p>
<p><b>Q6.</b> Explain degrees of freedom and obtain γ for mono and diatomic gas.<br><b>Ans:</b> Monatomic: 3 DOF → Cv = 3R/2, Cp = 5R/2, γ = 5/3. Diatomic: 5 DOF → Cv = 5R/2, Cp = 7R/2, γ = 7/5.</p>
<p><b>Q7.</b> State and explain Stefan's law; give applications.<br><b>Ans:</b> E = σT⁴. Applications: measuring star temperatures, thermal imaging, heat loss calculations.</p>
<p><b>Q8.</b> Explain Wien's displacement law with applications.<br><b>Ans:</b> λ_max T = b. Applications: determining temperature of stars, furnace temperature, IR thermography.</p>
<p><b>Q9.</b> State Kirchhoff's law and explain.<br><b>Ans:</b> Good absorbers are good emitters. e/a = constant = E_black. Explains Fraunhofer lines and cavity radiation.</p>
<p><b>Q10.</b> Derive mean free path.<br><b>Ans:</b> λ = average distance between collisions = 1/(√2 π d² n), where d is molecular diameter and n is number density.</p>
<p><b>Q11.</b> Explain Newton's law of cooling; applications.<br><b>Ans:</b> dT/dt = −k(T − T_s). Applications: cooling of liquids, calorimetry, body temperature estimation.</p>
<p><b>Q12.</b> Derive rms velocity expression.<br><b>Ans:</b> From (1/2)m<c²> = (3/2)kT → <c²> = 3kT/m → v_rms = √(3kT/m) = √(3RT/M).</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> State postulates of kinetic theory and derive P = (1/3)ρ<c²>.<br><b>Ans:</b> Postulates: random motion, elastic collisions, negligible forces/volume. Derivation via momentum transfer: P = (1/3)(N/V)m<c²> = (1/3)ρ<c²>.</p>
<p><b>Q2.</b> Derive KE per molecule = (3/2)kT; hence deduce Boyle's and Charles's law.<br><b>Ans:</b> (1/2)m<c²> = (3/2)kT. Boyle: at const T, PV = const. Charles: at const P, V ∝ T.</p>
<p><b>Q3.</b> Explain degrees of freedom and equipartition theorem; obtain specific heats.<br><b>Ans:</b> Equipartition: (1/2)kT per DOF. Monatomic γ=5/3, diatomic γ=7/5. Cp − Cv = R.</p>
<p><b>Q4.</b> Explain black body radiation: Stefan's law, Wien's law, Kirchhoff's law.<br><b>Ans:</b> Stefan: E = σT⁴. Wien: λ_max T = b. Kirchhoff: good absorber = good emitter (e/a = E_black).</p>
<p><b>Q5.</b> Derive rms, average and most probable speeds; compare them.<br><b>Ans:</b> v_rms = √(3kT/m); v_avg = √(8kT/πm); v_mp = √(2kT/m). Order: v_mp < v_avg < v_rms.</p>
<p><b>Q6.</b> Explain mean free path and Newton's law of cooling.<br><b>Ans:</b> Mean free path λ = 1/(√2 π d² n). Newton's cooling: dT/dt = −k(T − T_s); used in calorimetry.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>Ideal gas:</b> PV = nRT | P = (1/3)ρ<c²> = (1/3)(N/V)mv²</p>
<p><b>KE:</b> per molecule = (3/2)kT | per mole = (3/2)RT</p>
<p><b>Speeds:</b> v_rms = √(3kT/m) = √(3RT/M) | v_avg = √(8kT/πm) | v_mp = √(2kT/m)</p>
<p><b>Specific heats:</b> Cp − Cv = R | γ = Cp/Cv | energy per DOF = (1/2)kT</p>
<p><b>Radiation:</b> Stefan E = σT⁴ | Wien λ_max T = b | Kirchhoff e/a = E_black</p>
<p><b>Mean free path:</b> λ = 1/(√2 π d² n) | <b>Newton cooling:</b> dT/dt = −k(T − T_s)</p>
<h3>📐 VALUES TO MEMORISE</h3>
<p><b>Boltzmann k</b> = 1.38 × 10⁻²³ J/K | <b>Gas constant R</b> = 8.31 J/mol·K</p>
<p><b>Stefan σ</b> = 5.67 × 10⁻⁸ W m⁻² K⁻⁴ | <b>Wien b</b> = 2.898 × 10⁻³ m·K</p>
<p><b>Avogadro N_A</b> = 6.022 × 10²³ /mol</p>
<h3>🎨 DIAGRAMS TO PRACTICE</h3>
<p><b>1. P-V isotherms:</b> Hyperbolic curves at different temperatures.</p>
<p><b>2. Black body spectrum:</b> Intensity vs wavelength curves at different T (Wien shift).</p>
<p><b>3. Maxwell speed distribution:</b> Number of molecules vs speed curve.</p>
<h3>🔢 NUMERICALS TRICKS</h3>
<p><b>1.</b> KE depends only on temperature (not on mass/pressure/volume).</p>
<p><b>2.</b> v_rms ∝ √T; if T becomes 4×, v_rms becomes 2×.</p>
<p><b>3.</b> Stefan: E ∝ T⁴; if T doubled, energy radiated 16×.</p>
<p><b>4.</b> Wien: λ_max ∝ 1/T; hotter body → shorter λ_max.</p>
<p><b>5.</b> γ: monatomic 5/3, diatomic 7/5, polyatomic lower.</p>
<h3>⭐ TOP 10 BOARD QUESTIONS</h3>
<p><b>1.</b> State postulates of kinetic theory; derive P = (1/3)ρ<c²>. (4 marks)</p>
<p><b>2.</b> Derive KE per molecule = (3/2)kT; deduce Boyle's & Charles's law. (4 marks)</p>
<p><b>3.</b> Degrees of freedom & equipartition; specific heats. (4 marks)</p>
<p><b>4.</b> Stefan's law, Wien's law, Kirchhoff's law. (4 marks)</p>
<p><b>5.</b> Derive rms, average, most probable speeds. (3 marks)</p>
<p><b>6.</b> Derive Cp − Cv = R. (3 marks)</p>
<p><b>7.</b> Explain mean free path. (3 marks)</p>
<p><b>8.</b> Newton's law of cooling; applications. (3 marks)</p>
<p><b>9.</b> State Boyle's and Charles's law. (2 marks)</p>
<p><b>10.</b> Define black body. (2 marks)</p>

notesData["4. Thermodynamics"]=`
<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> The first law of thermodynamics is:<br>(a) ΔQ = ΔU + ΔW (b) ΔQ = ΔU − ΔW (c) ΔQ = ΔW − ΔU (d) ΔU = ΔQ + ΔW<br><b>Ans:</b> (a) ΔQ = ΔU + ΔW</p>
<p><b>Q2.</b> In an isothermal process (ideal gas), the change in internal energy is:<br>(a) zero (b) positive (c) negative (d) infinite<br><b>Ans:</b> (a) zero</p>
<p><b>Q3.</b> In an adiabatic process:<br>(a) ΔQ = 0 (b) ΔW = 0 (c) ΔU = 0 (d) ΔT = 0<br><b>Ans:</b> (a) ΔQ = 0</p>
<p><b>Q4.</b> In an isobaric process, which quantity is constant?<br>(a) volume (b) pressure (c) temperature (d) heat<br><b>Ans:</b> (b) pressure</p>
<p><b>Q5.</b> In an isochoric process, work done is:<br>(a) zero (b) maximum (c) PΔV (d) nRT ln(V2/V1)<br><b>Ans:</b> (a) zero</p>
<p><b>Q6.</b> Work done in an isothermal process is:<br>(a) PΔV (b) nRT ln(V2/V1) (c) CvΔT (d) zero<br><b>Ans:</b> (b) nRT ln(V2/V1)</p>
<p><b>Q7.</b> The adiabatic equation is:<br>(a) PV = constant (b) PV^γ = constant (c) P/V = constant (d) PT = constant<br><b>Ans:</b> (b) PV^γ = constant</p>
<p><b>Q8.</b> On a P-V diagram, the slope of an adiabatic curve is:<br>(a) less than isothermal (b) equal to isothermal (c) greater than isothermal (d) zero<br><b>Ans:</b> (c) greater than isothermal</p>
<p><b>Q9.</b> Efficiency of a Carnot engine is:<br>(a) 1 − T1/T2 (b) 1 − T2/T1 (c) T2/T1 (d) T1/T2<br><b>Ans:</b> (b) 1 − T2/T1</p>
<p><b>Q10.</b> Carnot engine efficiency depends on:<br>(a) working substance (b) source & sink temperatures (c) pressure (d) volume<br><b>Ans:</b> (b) source & sink temperatures</p>
<p><b>Q11.</b> A Carnot engine works between 500 K and 300 K. Its efficiency is:<br>(a) 40% (b) 60% (c) 50% (d) 30%<br><b>Ans:</b> (a) 40% (1 − 300/500)</p>
<p><b>Q12.</b> COP of a refrigerator is:<br>(a) W/Q2 (b) Q2/W (c) Q1/W (d) W/Q1<br><b>Ans:</b> (b) Q2/W</p>
<p><b>Q13.</b> Which of the following is a reversible process (ideal)?<br>(a) Carnot cycle (b) free expansion (c) friction (d) combustion<br><b>Ans:</b> (a) Carnot cycle</p>
<p><b>Q14.</b> In natural/irreversible processes, entropy:<br>(a) decreases (b) remains constant (c) increases (d) becomes zero<br><b>Ans:</b> (c) increases</p>
<p><b>Q15.</b> A heat engine converts:<br>(a) work into heat (b) heat into work (c) mass into energy (d) none<br><b>Ans:</b> (b) heat into work</p>
<p><b>Q16.</b> The second law of thermodynamics (Kelvin-Planck) states:<br>(a) heat flows cold to hot (b) no engine can convert all heat into work (c) entropy decreases (d) none<br><b>Ans:</b> (b)</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> State the first law of thermodynamics.<br><b>Ans:</b> ΔQ = ΔU + ΔW (heat supplied = increase in internal energy + work done).</p>
<p><b>Q2.</b> State the second law (Clausius statement).<br><b>Ans:</b> Heat cannot flow spontaneously from a colder body to a hotter body.</p>
<p><b>Q3.</b> Define isothermal process.<br><b>Ans:</b> A process at constant temperature (ΔT = 0).</p>
<p><b>Q4.</b> Define adiabatic process.<br><b>Ans:</b> A process in which no heat is exchanged (ΔQ = 0).</p>
<p><b>Q5.</b> Write Carnot efficiency formula.<br><b>Ans:</b> η = 1 − T2/T1 (temperatures in Kelvin).</p>
<p><b>Q6.</b> Define reversible process.<br><b>Ans:</b> A process that can be reversed without leaving any change in the system or surroundings.</p>
<p><b>Q7.</b> What is a heat engine?<br><b>Ans:</b> A device that converts heat energy into work in a cyclic process.</p>
<p><b>Q8.</b> Define COP of a refrigerator.<br><b>Ans:</b> COP = Q2/W = T2/(T1 − T2).</p>
<p><b>Q9.</b> What is entropy?<br><b>Ans:</b> A measure of disorder/randomness; it increases in irreversible processes.</p>
<p><b>Q10.</b> Write work done in an isothermal process.<br><b>Ans:</b> W = nRT ln(V2/V1).</p>
<p><b>Q11.</b> State the zeroth law of thermodynamics.<br><b>Ans:</b> If two bodies are each in thermal equilibrium with a third, they are in thermal equilibrium with each other.</p>
<p><b>Q12.</b> Define isochoric process.<br><b>Ans:</b> A process at constant volume (ΔV = 0, so W = 0).</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> State and explain the first law of thermodynamics.<br><b>Ans:</b> ΔQ = ΔU + ΔW. Heat supplied increases internal energy and does work. It is conservation of energy for thermal systems.</p>
<p><b>Q2.</b> Explain isothermal process.<br><b>Ans:</b> Constant temperature process. For ideal gas, ΔU = 0, so ΔQ = ΔW. Slow process; PV = constant.</p>
<p><b>Q3.</b> Explain adiabatic process.<br><b>Ans:</b> No heat exchange (ΔQ = 0). So ΔU = −ΔW. Fast process; PV^γ = constant.</p>
<p><b>Q4.</b> Explain isobaric and isochoric processes.<br><b>Ans:</b> Isobaric: constant pressure, W = PΔV. Isochoric: constant volume, W = 0.</p>
<p><b>Q5.</b> State the second law (Kelvin-Planck statement).<br><b>Ans:</b> No heat engine can convert all the heat absorbed into work; some heat must be rejected to a cold sink.</p>
<p><b>Q6.</b> State the second law (Clausius statement).<br><b>Ans:</b> Heat cannot flow spontaneously from a colder body to a hotter body without external work.</p>
<p><b>Q7.</b> Explain the Carnot cycle briefly.<br><b>Ans:</b> A reversible cycle with 4 steps: isothermal expansion, adiabatic expansion, isothermal compression, adiabatic compression. Most efficient engine.</p>
<p><b>Q8.</b> Why is the Carnot engine the most efficient?<br><b>Ans:</b> It is fully reversible with no losses (friction, etc.). By Carnot theorem, no engine between same temperatures can exceed its efficiency.</p>
<p><b>Q9.</b> Explain a heat engine.<br><b>Ans:</b> Absorbs heat Q1 from source, converts part to work W, rejects Q2 to sink. Efficiency η = W/Q1 = 1 − Q2/Q1.</p>
<p><b>Q10.</b> Explain a refrigerator.<br><b>Ans:</b> Uses work W to extract heat Q2 from cold body and reject Q1 = Q2 + W to hot body. COP = Q2/W.</p>
<p><b>Q11.</b> Distinguish reversible and irreversible processes.<br><b>Ans:</b> Reversible: can be undone with no net change (ideal). Irreversible: leaves changes (real, e.g., friction, free expansion).</p>
<p><b>Q12.</b> Why is 100% efficiency impossible?<br><b>Ans:</b> By second law, some heat must be rejected to sink, so η is always < 100%.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive work done in an isothermal process.<br><b>Ans:</b> W = ∫P dV with PV = nRT → W = nRT ∫(1/V)dV = nRT ln(V2/V1).</p>
<p><b>Q2.</b> Derive work done in an adiabatic process.<br><b>Ans:</b> W = ∫P dV with PV^γ = const. Result: W = (nR/(γ−1))(T1 − T2) = (P1V1 − P2V2)/(γ−1).</p>
<p><b>Q3.</b> Derive adiabatic equation PV^γ = constant.<br><b>Ans:</b> From first law (ΔQ=0) and ideal gas law: TV^(γ−1) = const and PV^γ = const.</p>
<p><b>Q4.</b> Derive Carnot efficiency.<br><b>Ans:</b> η = 1 − Q2/Q1. For reversible Carnot cycle, Q2/Q1 = T2/T1, so η = 1 − T2/T1.</p>
<p><b>Q5.</b> Apply first law to isothermal, adiabatic and isochoric processes.<br><b>Ans:</b> Isothermal: ΔU=0, ΔQ=ΔW. Adiabatic: ΔQ=0, ΔU=−ΔW. Isochoric: W=0, ΔQ=ΔU.</p>
<p><b>Q6.</b> Explain Carnot cycle with P-V diagram.<br><b>Ans:</b> Four reversible steps: isothermal expansion (A→B), adiabatic expansion (B→C), isothermal compression (C→D), adiabatic compression (D→A).</p>
<p><b>Q7.</b> Derive COP of a refrigerator.<br><b>Ans:</b> COP = Q2/W = Q2/(Q1−Q2). For Carnot: Q2/Q1 = T2/T1 → COP = T2/(T1−T2).</p>
<p><b>Q8.</b> Explain entropy and the second law.<br><b>Ans:</b> Entropy S measures disorder. In reversible process ΔS = ΔQ/T; in irreversible ΔS > 0 (entropy increases).</p>
<p><b>Q9.</b> Compare isothermal and adiabatic processes.<br><b>Ans:</b> Isothermal: ΔT=0, slow, PV=const, less steep. Adiabatic: ΔQ=0, fast, PV^γ=const, steeper.</p>
<p><b>Q10.</b> A Carnot engine works between 600 K and 300 K. Find efficiency.<br><b>Ans:</b> η = 1 − 300/600 = 0.5 = 50%.</p>
<p><b>Q11.</b> Why is the adiabatic curve steeper than isothermal?<br><b>Ans:</b> Slope of adiabatic = γ times slope of isothermal. Since γ > 1, adiabatic is steeper.</p>
<p><b>Q12.</b> State the limitations of the second law.<br><b>Ans:</b> It gives direction of processes and limits efficiency, but does not give rates; applies to macroscopic systems.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> State the first law; apply it to isothermal, adiabatic, isobaric, isochoric processes.<br><b>Ans:</b> ΔQ = ΔU + ΔW. Isothermal: ΔU=0→ΔQ=ΔW. Adiabatic: ΔQ=0→ΔU=−ΔW. Isobaric: W=PΔV. Isochoric: W=0→ΔQ=ΔU.</p>
<p><b>Q2.</b> Derive work done in isothermal and adiabatic processes.<br><b>Ans:</b> Isothermal: W = nRT ln(V2/V1). Adiabatic: W = (nR/(γ−1))(T1−T2).</p>
<p><b>Q3.</b> Explain Carnot engine: cycle and efficiency derivation.<br><b>Ans:</b> 4 reversible steps. η = 1 − Q2/Q1 = 1 − T2/T1. Depends only on source/sink temperatures; most efficient.</p>
<p><b>Q4.</b> State the second law (Kelvin & Clausius); explain heat engine and refrigerator.<br><b>Ans:</b> Kelvin: no engine converts all heat to work. Clausius: heat doesn't flow cold→hot spontaneously. Engine: η=1−Q2/Q1. Refrigerator: COP=Q2/W.</p>
<p><b>Q5.</b> Explain reversible and irreversible processes; discuss entropy.<br><b>Ans:</b> Reversible: no net change on reversal. Irreversible: friction, free expansion. Entropy increases in irreversible processes (ΔS>0).</p>
<p><b>Q6.</b> State and prove Carnot's theorem.<br><b>Ans:</b> Carnot's theorem: no engine between two given temperatures can be more efficient than a Carnot engine. Proof by contradiction using a Carnot engine and a supposed more efficient engine.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>First law:</b> ΔQ = ΔU + ΔW</p>
<p><b>Isothermal:</b> PV = const | W = nRT ln(V2/V1) | ΔU = 0</p>
<p><b>Adiabatic:</b> PV^γ = const | TV^(γ−1) = const | W = (nR/(γ−1))(T1−T2) | ΔQ = 0</p>
<p><b>Isobaric:</b> W = PΔV | <b>Isochoric:</b> W = 0</p>
<p><b>Carnot:</b> η = 1 − T2/T1 | <b>Refrigerator:</b> COP = T2/(T1−T2)</p>
<p><b>Entropy:</b> ΔS = ΔQ/T (reversible)</p>
<h3>📐 VALUES TO MEMORISE</h3>
<p><b>γ monatomic</b> = 5/3 | <b>γ diatomic</b> = 7/5</p>
<p><b>R</b> = 8.31 J/mol·K | Temperatures in Carnot formula must be in <b>Kelvin</b></p>
<h3>🎨 DIAGRAMS TO PRACTICE</h3>
<p><b>1. P-V diagram:</b> Isothermal (PV=const) and adiabatic (PV^γ=const) curves; adiabatic steeper.</p>
<p><b>2. Carnot cycle:</b> Rectangle-like closed loop on P-V with two isotherms and two adiabats.</p>
<p><b>3. Refrigerator/Heat engine:</b> Block diagram with source, sink, work.</p>
<h3>🔢 NUMERICALS TRICKS</h3>
<p><b>1.</b> Carnot: always use Kelvin (°C + 273).</p>
<p><b>2.</b> Isothermal: ΔU = 0 → ΔQ = ΔW.</p>
<p><b>3.</b> Adiabatic: ΔQ = 0 → ΔU = −ΔW.</p>
<p><b>4.</b> Isochoric: W = 0 → ΔQ = ΔU.</p>
<p><b>5.</b> Efficiency η = 1 − T2/T1 (T2 = sink, T1 = source).</p>
<h3>⭐ TOP 10 BOARD QUESTIONS</h3>
<p><b>1.</b> First law; apply to all four processes. (4 marks)</p>
<p><b>2.</b> Derive work in isothermal and adiabatic. (4 marks)</p>
<p><b>3.</b> Carnot engine: cycle + efficiency. (4 marks)</p>
<p><b>4.</b> Second law (Kelvin & Clausius); engine & refrigerator. (4 marks)</p>
<p><b>5.</b> Reversible/irreversible; entropy. (3 marks)</p>
<p><b>6.</b> Derive adiabatic equation PV^γ = const. (3 marks)</p>
<p><b>7.</b> Derive COP of refrigerator. (3 marks)</p>
<p><b>8.</b> Carnot efficiency numerical. (3 marks)</p>
<p><b>9.</b> Define isothermal & adiabatic. (2 marks)</p>
<p><b>10.</b> State first and second law. (2 marks)</p>

<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> In SHM, acceleration is:<br>(a) proportional to x (b) −ω²x (c) ω²/x (d) constant<br><b>Ans:</b> (b) a = −ω²x</p>
<p><b>Q2.</b> In SHM, acceleration is maximum at:<br>(a) mean position (b) extreme position (c) halfway (d) none<br><b>Ans:</b> (b) extreme position</p>
<p><b>Q3.</b> In SHM, velocity is maximum at:<br>(a) mean position (b) extreme position (c) halfway (d) none<br><b>Ans:</b> (a) mean position</p>
<p><b>Q4.</b> Displacement of SHM (from mean position) is:<br>(a) x = A sin ωt (b) x = A cos² ωt (c) x = At (d) x = A/ωt<br><b>Ans:</b> (a) x = A sin ωt</p>
<p><b>Q5.</b> Time period of SHM is:<br>(a) 2π/ω (b) ω/2π (c) 2πω (d) 1/ω<br><b>Ans:</b> (a) 2π/ω</p>
<p><b>Q6.</b> Time period of a simple pendulum is:<br>(a) 2π√(l/g) (b) 2π√(g/l) (c) 2π√(m/k) (d) 2π√(k/m)<br><b>Ans:</b> (a) 2π√(l/g)</p>
<p><b>Q7.</b> Time period of a spring-mass system is:<br>(a) 2π√(m/k) (b) 2π√(k/m) (c) 2π√(l/g) (d) √(k/m)<br><b>Ans:</b> (a) 2π√(m/k)</p>
<p><b>Q8.</b> Total energy in SHM is:<br>(a) zero (b) ½kA² (c) ½kx² (d) kA<br><b>Ans:</b> (b) ½kA² (constant)</p>
<p><b>Q9.</b> KE is maximum at:<br>(a) mean position (b) extreme position (c) halfway (d) none<br><b>Ans:</b> (a) mean position</p>
<p><b>Q10.</b> PE is maximum at:<br>(a) mean position (b) extreme position (c) halfway (d) none<br><b>Ans:</b> (b) extreme position</p>
<p><b>Q11.</b> In damped oscillation, amplitude:<br>(a) increases (b) decreases with time (c) constant (d) none<br><b>Ans:</b> (b) decreases with time</p>
<p><b>Q12.</b> Resonance occurs when:<br>(a) driving freq ≠ natural freq (b) driving freq = natural freq (c) amplitude is zero (d) none<br><b>Ans:</b> (b) driving freq = natural freq</p>
<p><b>Q13.</b> Phase difference between displacement and velocity in SHM is:<br>(a) 0 (b) π/2 (c) π (d) 2π<br><b>Ans:</b> (b) π/2</p>
<p><b>Q14.</b> Frequency f is related to angular frequency ω by:<br>(a) f = ω/2π (b) f = 2πω (c) f = ω (d) f = π/ω<br><b>Ans:</b> (a) f = ω/2π</p>
<p><b>Q15.</b> Two springs k1, k2 in series have effective k:<br>(a) k1 + k2 (b) 1/k = 1/k1 + 1/k2 (c) k1k2 (d) k1 − k2<br><b>Ans:</b> (b)</p>
<p><b>Q16.</b> In forced oscillation, the body vibrates with:<br>(a) natural frequency (b) driving frequency (c) zero frequency (d) none<br><b>Ans:</b> (b) driving frequency</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> Define SHM.<br><b>Ans:</b> Motion where acceleration is directly proportional to displacement and directed towards mean position: a = −ω²x.</p>
<p><b>Q2.</b> Write the condition for SHM.<br><b>Ans:</b> a = −ω²x (restoring force ∝ displacement).</p>
<p><b>Q3.</b> Define time period and frequency.<br><b>Ans:</b> Time period T = time for one oscillation; frequency f = 1/T.</p>
<p><b>Q4.</b> Write the displacement equation of SHM.<br><b>Ans:</b> x = A sin ωt (from mean position).</p>
<p><b>Q5.</b> What is amplitude?<br><b>Ans:</b> Maximum displacement from the mean position (A).</p>
<p><b>Q6.</b> Define phase.<br><b>Ans:</b> The state of vibration of a particle, given by ωt + φ.</p>
<p><b>Q7.</b> Write total energy in SHM.<br><b>Ans:</b> E = ½kA² (constant).</p>
<p><b>Q8.</b> Define damped oscillation.<br><b>Ans:</b> Oscillation where amplitude decreases with time due to resistive forces.</p>
<p><b>Q9.</b> Define resonance.<br><b>Ans:</b> Large amplitude oscillation when driving frequency equals natural frequency.</p>
<p><b>Q10.</b> Write T of simple pendulum.<br><b>Ans:</b> T = 2π√(l/g).</p>
<p><b>Q11.</b> Write T of spring-mass system.<br><b>Ans:</b> T = 2π√(m/k).</p>
<p><b>Q12.</b> What is forced oscillation?<br><b>Ans:</b> Oscillation under an external periodic driving force.</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> Define SHM with examples.<br><b>Ans:</b> a = −ω²x. Examples: simple pendulum (small angles), spring-mass system, vibrating tuning fork.</p>
<p><b>Q2.</b> State the conditions for SHM.<br><b>Ans:</b> Restoring force proportional to displacement and directed towards mean position; motion periodic.</p>
<p><b>Q3.</b> Explain simple pendulum.<br><b>Ans:</b> A small bob suspended by a light string. For small angles, restoring force ∝ displacement → SHM. T = 2π√(l/g).</p>
<p><b>Q4.</b> Explain spring-mass system.<br><b>Ans:</b> Mass on a spring. Restoring force F = −kx → SHM. T = 2π√(m/k).</p>
<p><b>Q5.</b> Explain damped oscillation.<br><b>Ans:</b> Amplitude decreases over time due to friction/air resistance. Energy gradually lost. Example: pendulum slowly stopping.</p>
<p><b>Q6.</b> Explain forced oscillation and resonance.<br><b>Ans:</b> Forced: external periodic force drives the system. Resonance: amplitude maximum when driving frequency = natural frequency.</p>
<p><b>Q7.</b> Derive velocity in SHM.<br><b>Ans:</b> x = A sin ωt → v = dx/dt = Aω cos ωt = ω√(A² − x²).</p>
<p><b>Q8.</b> Derive acceleration in SHM.<br><b>Ans:</b> v = Aω cos ωt → a = dv/dt = −Aω² sin ωt = −ω²x.</p>
<p><b>Q9.</b> Explain energy in SHM.<br><b>Ans:</b> KE = ½k(A²−x²), PE = ½kx², total E = ½kA² (constant). KE and PE interchange.</p>
<p><b>Q10.</b> Why is motion of a simple pendulum approximately SHM?<br><b>Ans:</b> For small angles, sinθ ≈ θ, so restoring force ∝ displacement → SHM.</p>
<p><b>Q11.</b> Explain phase of SHM.<br><b>Ans:</b> Phase = ωt + φ; it gives the position and direction of motion at any instant.</p>
<p><b>Q12.</b> Give examples of SHM in daily life.<br><b>Ans:</b> Pendulum clock, swing, vibrating guitar string, tuning fork, bungee jumping.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive displacement, velocity and acceleration of SHM.<br><b>Ans:</b> x = A sin ωt; v = Aω cos ωt = ω√(A²−x²); a = −Aω² sin ωt = −ω²x.</p>
<p><b>Q2.</b> Derive total energy in SHM and show it is conserved.<br><b>Ans:</b> KE = ½k(A²−x²), PE = ½kx². Total E = KE + PE = ½kA² = constant.</p>
<p><b>Q3.</b> Derive time period of a simple pendulum.<br><b>Ans:</b> Restoring force = −mg sinθ ≈ −mgθ (small θ). With θ = x/l, F = −(mg/l)x → SHM. T = 2π√(l/g).</p>
<p><b>Q4.</b> Derive time period of a spring-mass system.<br><b>Ans:</b> F = −kx = ma → a = −(k/m)x → ω² = k/m → T = 2π√(m/k).</p>
<p><b>Q5.</b> Show KE and PE variation in SHM.<br><b>Ans:</b> At mean (x=0): KE = ½kA², PE = 0. At extreme (x=A): KE = 0, PE = ½kA². Total constant.</p>
<p><b>Q6.</b> Establish a = −ω²x from x = A sin ωt.<br><b>Ans:</b> v = Aω cos ωt; a = −Aω² sin ωt = −ω²(A sin ωt) = −ω²x.</p>
<p><b>Q7.</b> Explain resonance with examples.<br><b>Ans:</b> When driving frequency = natural frequency, amplitude becomes very large. Examples: pushing a swing, breaking glass with sound, radio tuning.</p>
<p><b>Q8.</b> Explain damped oscillations with graph.<br><b>Ans:</b> Amplitude decays exponentially: x = A e^(−bt/2m) sin ωt. Graph shows decreasing envelope. Energy lost to surroundings.</p>
<p><b>Q9.</b> Derive energy at any point in SHM.<br><b>Ans:</b> KE = ½k(A²−x²), PE = ½kx²; E = ½kA² at all points.</p>
<p><b>Q10.</b> Effect of length on pendulum period.<br><b>Ans:</b> T = 2π√(l/g); T ∝ √l. Increasing length increases period.</p>
<p><b>Q11.</b> Springs in series and parallel: effective k.<br><b>Ans:</b> Series: 1/k = 1/k1 + 1/k2. Parallel: k = k1 + k2.</p>
<p><b>Q12.</b> Relation between ω, T and f.<br><b>Ans:</b> ω = 2πf = 2π/T; T = 1/f; f = ω/2π.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> Define SHM; derive displacement, velocity and acceleration.<br><b>Ans:</b> a = −ω²x. x = A sin ωt; v = Aω cos ωt; a = −ω²x. Phase difference between x and v is π/2, between x and a is π.</p>
<p><b>Q2.</b> Derive total energy in SHM; show exchange of KE and PE.<br><b>Ans:</b> KE = ½k(A²−x²), PE = ½kx², E = ½kA² constant. At mean: all KE; at extreme: all PE; total conserved.</p>
<p><b>Q3.</b> Derive the time period of a simple pendulum.<br><b>Ans:</b> For small angles, restoring torque gives F = −(mg/l)x → SHM with ω² = g/l → T = 2π√(l/g).</p>
<p><b>Q4.</b> Derive the time period of a spring-mass system.<br><b>Ans:</b> F = −kx = ma → ω² = k/m → T = 2π√(m/k). Independent of g.</p>
<p><b>Q5.</b> Explain damped and forced oscillations; discuss resonance.<br><b>Ans:</b> Damped: amplitude decays due to resistive forces. Forced: external periodic force; resonance when driving freq = natural freq → large amplitude.</p>
<p><b>Q6.</b> Discuss energy conservation in SHM with graph.<br><b>Ans:</b> E = ½kA² constant. Graph: KE and PE are parabolas in x; their sum is constant. At x=0 KE max; at x=±A PE max.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>SHM:</b> a = −ω²x | x = A sin ωt | v = Aω cos ωt = ω√(A²−x²) | a = −ω²x</p>
<p><b>Time/Frequency:</b> T = 2π/ω | f = ω/2π | T = 1/f</p>
<p><b>Energy:</b> KE = ½k(A²−x²) | PE = ½kx² | E = ½kA²</p>
<p><b>Simple pendulum:</b> T = 2π√(l/g) | ω = √(g/l)</p>
<p><b>Spring-mass:</b> T = 2π√(m/k) | ω = √(k/m)</p>
<p><b>Springs:</b> Series 1/k = 1/k1+1/k2 | Parallel k = k1+k2</p>
<h3>📐 KEY POINTS</h3>
<p><b>v max</b> at mean position | <b>a max</b> at extreme position</p>
<p><b>E</b> constant everywhere | <b>KE max, PE = 0</b> at mean | <b>PE max, KE = 0</b> at extreme</p>
<p><b>Pendulum T</b> independent of mass | <b>Spring T</b> independent of g</p>
<h3>🎨 DIAGRAMS TO PRACTICE</h3>
<p><b>1. SHM reference circle:</b> Projection of uniform circular motion gives SHM.</p>
<p><b>2. Simple pendulum:</b> Bob, string length l, angle θ, restoring force.</p>
<p><b>3. Spring-mass:</b> Mass on spring, displacement x, force −kx.</p>
<p><b>4. Damped oscillation:</b> Decreasing amplitude sine wave.</p>
<p><b>5. Energy vs x:</b> KE and PE parabolas, total E horizontal line.</p>
<h3>🔢 NUMERICALS TRICKS</h3>
<p><b>1.</b> v = ω√(A²−x²); at x=0, v=Aω (max); at x=A, v=0.</p>
<p><b>2.</b> Pendulum: T ∝ √l (length 4× → T 2×); independent of mass.</p>
<p><b>3.</b> Spring: T ∝ √m (mass 4× → T 2×).</p>
<p><b>4.</b> E = ½kA² (independent of x); KE+PE constant.</p>
<p><b>5.</b> ω = 2πf; use radians.</p>
<h3>⭐ TOP 10 BOARD QUESTIONS</h3>
<p><b>1.</b> Define SHM; derive x, v, a. (4 marks)</p>
<p><b>2.</b> Derive total energy in SHM; KE & PE exchange. (4 marks)</p>
<p><b>3.</b> Derive T of simple pendulum. (4 marks)</p>
<p><b>4.</b> Derive T of spring-mass system. (4 marks)</p>
<p><b>5.</b> Damped & forced oscillations; resonance. (4 marks)</p>
<p><b>6.</b> Show KE & PE variation in SHM. (3 marks)</p>
<p><b>7.</b> Establish a = −ω²x. (3 marks)</p>
<p><b>8.</b> Define SHM; conditions. (2 marks)</p>
<p><b>9.</b> Define resonance. (2 marks)</p>
<p><b>10.</b> Define time period & frequency. (2 marks)</p>

notesData["6. Superposition of Waves"]=`
<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> The principle of superposition states resultant displacement is:<br>(a) product of individual displacements (b) vector sum of individual displacements (c) zero (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q2.</b> Stationary waves are formed by:<br>(a) two waves of different frequency (b) two waves of same frequency travelling in opposite directions (c) one wave only (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q3.</b> In stationary waves, distance between two consecutive nodes is:<br>(a) λ (b) λ/2 (c) λ/4 (d) 2λ<br><b>Ans:</b> (b) λ/2</p>
<p><b>Q4.</b> Distance between a node and adjacent antinode is:<br>(a) λ/2 (b) λ/4 (c) λ (d) 2λ<br><b>Ans:</b> (b) λ/4</p>
<p><b>Q5.</b> At nodes, the displacement is:<br>(a) maximum (b) minimum/zero (c) average (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q6.</b> At antinodes, the displacement is:<br>(a) zero (b) maximum (c) minimum (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q7.</b> In stationary waves, energy is:<br>(a) transmitted (b) not transmitted (confined) (c) zero (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q8.</b> Beats are produced by:<br>(a) two waves of same frequency (b) two waves of slightly different frequencies (c) one wave (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q9.</b> Beat frequency is:<br>(a) f1 + f2 (b) |f1 − f2| (c) f1f2 (d) f1/f2<br><b>Ans:</b> (b) |f1 − f2|</p>
<p><b>Q10.</b> Doppler effect is the apparent change in:<br>(a) amplitude (b) frequency (c) speed (d) wavelength only<br><b>Ans:</b> (b) frequency</p>
<p><b>Q11.</b> When a source moves towards observer, apparent frequency:<br>(a) decreases (b) increases (c) unchanged (d) none<br><b>Ans:</b> (b) increases</p>
<p><b>Q12.</b> Fundamental frequency of a string fixed at both ends is:<br>(a) v/2L (b) v/L (c) v/4L (d) 2v/L<br><b>Ans:</b> (a) v/2L</p>
<p><b>Q13.</b> Harmonics are:<br>(a) random frequencies (b) integral multiples of fundamental (c) only odd multiples (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q14.</b> Wave velocity on a stretched string is:<br>(a) √(T/μ) (b) √(μ/T) (c) T/μ (d) μ/T<br><b>Ans:</b> (a) √(T/μ)</p>
<p><b>Q15.</b> Interference is the phenomenon of:<br>(a) bending of light (b) superposition producing intensity redistribution (c) polarization (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q16.</b> In stationary waves, adjacent particles between two nodes vibrate:<br>(a) in opposite phase (b) in same phase (c) not at all (d) none<br><b>Ans:</b> (b)</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> State principle of superposition.<br><b>Ans:</b> Resultant displacement at a point is the vector sum of displacements due to individual waves.</p>
<p><b>Q2.</b> What are stationary waves?<br><b>Ans:</b> Waves formed by superposition of two identical waves travelling in opposite directions; energy is confined.</p>
<p><b>Q3.</b> Define node.<br><b>Ans:</b> Point in a stationary wave where displacement is always zero.</p>
<p><b>Q4.</b> Define antinode.<br><b>Ans:</b> Point in a stationary wave where displacement is maximum.</p>
<p><b>Q5.</b> What are beats?<br><b>Ans:</b> Periodic rise and fall in intensity when two waves of slightly different frequencies superpose.</p>
<p><b>Q6.</b> Write beat frequency.<br><b>Ans:</b> Beat frequency = |f1 − f2|.</p>
<p><b>Q7.</b> What is Doppler effect?<br><b>Ans:</b> Apparent change in frequency due to relative motion between source and observer.</p>
<p><b>Q8.</b> Define harmonic.<br><b>Ans:</b> An integral multiple of the fundamental frequency.</p>
<p><b>Q9.</b> What is an overtone?<br><b>Ans:</b> Any frequency higher than the fundamental.</p>
<p><b>Q10.</b> Write fundamental frequency of a string.<br><b>Ans:</b> f = v/2L.</p>
<p><b>Q11.</b> What is interference?<br><b>Ans:</b> Redistribution of intensity due to superposition of waves.</p>
<p><b>Q12.</b> Write relation between v, f and λ.<br><b>Ans:</b> v = fλ.</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> State and explain principle of superposition.<br><b>Ans:</b> When two or more waves meet, resultant displacement = vector sum of individual displacements. After crossing, waves continue unchanged.</p>
<p><b>Q2.</b> Explain formation of stationary waves.<br><b>Ans:</b> Two waves of same frequency and amplitude travelling in opposite directions superpose, producing nodes and antinodes; energy is confined.</p>
<p><b>Q3.</b> Distinguish progressive and stationary waves.<br><b>Ans:</b> Progressive: energy transmitted, all particles same amplitude. Stationary: energy confined, amplitude varies from 0 (node) to max (antinode).</p>
<p><b>Q4.</b> Explain nodes and antinodes.<br><b>Ans:</b> Nodes: zero displacement (destructive interference). Antinodes: maximum displacement (constructive interference). Nodes λ/2 apart.</p>
<p><b>Q5.</b> Explain beats.<br><b>Ans:</b> Two waves of slightly different frequencies alternately reinforce and cancel, producing periodic loud-soft sound. Beat frequency = |f1 − f2|.</p>
<p><b>Q6.</b> State Doppler effect.<br><b>Ans:</b> Apparent frequency changes when source and observer move relative to each other; higher when approaching, lower when receding.</p>
<p><b>Q7.</b> Explain harmonics and overtones.<br><b>Ans:</b> Fundamental = lowest frequency. Harmonics = integral multiples of fundamental. Overtones = frequencies above fundamental.</p>
<p><b>Q8.</b> Why are stationary waves called stationary?<br><b>Ans:</b> Because the pattern (nodes and antinodes) does not move; energy is not transmitted along the medium.</p>
<p><b>Q9.</b> Discuss energy in stationary waves.<br><b>Ans:</b> Energy is confined between nodes; not propagated. KE and PE interchange but total at each point varies with position.</p>
<p><b>Q10.</b> Explain vibrating string.<br><b>Ans:</b> A stretched string fixed at both ends forms stationary waves; fundamental f = v/2L with harmonics nf.</p>
<p><b>Q11.</b> State conditions for beats.<br><b>Ans:</b> Two waves must have slightly different frequencies and same amplitude (preferably) travelling in same direction.</p>
<p><b>Q12.</b> Write wave velocity on a stretched string.<br><b>Ans:</b> v = √(T/μ), where T is tension and μ is linear mass density.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive the equation of a stationary wave.<br><b>Ans:</b> y1 = A sin(ωt−kx), y2 = A sin(ωt+kx). Sum: y = 2A sin(kx) cos(ωt). Amplitude varies with x; nodes where sin(kx)=0.</p>
<p><b>Q2.</b> Derive positions of nodes and antinodes.<br><b>Ans:</b> Nodes: sin(kx)=0 → kx = nπ → x = nλ/2. Antinodes: sin(kx)=±1 → x = (2n+1)λ/4.</p>
<p><b>Q3.</b> Derive beat frequency.<br><b>Ans:</b> Two waves f1, f2 superpose. Resultant amplitude varies at rate |f1−f2|. Beat frequency = |f1−f2|.</p>
<p><b>Q4.</b> Derive frequency of a vibrating string.<br><b>Ans:</b> For string length L, fundamental λ = 2L, so f = v/λ = v/2L. Harmonics = nf.</p>
<p><b>Q5.</b> Explain Doppler effect with formula.<br><b>Ans:</b> Apparent frequency f' = f[(v±v_o)/(v∓v_s)]. Increases when source/observer approach; decreases when recede.</p>
<p><b>Q6.</b> Discuss harmonics in a stretched string.<br><b>Ans:</b> String fixed at both ends supports harmonics nf (n=1,2,3...). Fundamental f=v/2L; higher modes have more nodes.</p>
<p><b>Q7.</b> Show distance between two consecutive nodes is λ/2.<br><b>Ans:</b> Nodes at x = nλ/2. Difference between consecutive = (n+1)λ/2 − nλ/2 = λ/2.</p>
<p><b>Q8.</b> Explain energy distribution in stationary waves.<br><b>Ans:</b> Energy confined between nodes; maximum at antinodes, zero net flow. KE and PE vary with position and time.</p>
<p><b>Q9.</b> Give applications of superposition.<br><b>Ans:</b> Interference, stationary waves, beats, musical instruments, noise cancellation.</p>
<p><b>Q10.</b> Briefly explain standing waves in air columns.<br><b>Ans:</b> In organ pipes, sound waves reflect forming stationary waves; open pipe has antinodes at both ends, closed pipe has node at closed end.</p>
<p><b>Q11.</b> Derive resultant of two waves of same frequency.<br><b>Ans:</b> y1=A sinωt, y2=A sin(ωt+φ). Sum: y = 2A cos(φ/2) sin(ωt+φ/2). Resultant amplitude = 2A cos(φ/2).</p>
<p><b>Q12.</b> State conditions for formation of stationary waves.<br><b>Ans:</b> Two waves of same frequency and amplitude, travelling in opposite directions, superpose in the same medium.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> State principle of superposition; explain formation of stationary waves, nodes and antinodes.<br><b>Ans:</b> Resultant = vector sum. Two opposite identical waves → stationary wave y=2A sin(kx)cos(ωt). Nodes (zero) λ/2 apart; antinodes (max) between them.</p>
<p><b>Q2.</b> Derive stationary wave equation; find positions of nodes and antinodes.<br><b>Ans:</b> y = 2A sin(kx)cos(ωt). Nodes x = nλ/2; antinodes x = (2n+1)λ/4. Node–antinode distance λ/4.</p>
<p><b>Q3.</b> Explain beats; derive beat frequency; give applications.<br><b>Ans:</b> Two slightly different frequencies → periodic loudness. Beat freq = |f1−f2|. Applications: tuning instruments, detecting gas leaks.</p>
<p><b>Q4.</b> Explain Doppler effect; give formula and applications.<br><b>Ans:</b> f' = f[(v±v_o)/(v∓v_s)]. Applications: radar, speed guns, astronomy (red/blue shift), sonar.</p>
<p><b>Q5.</b> Discuss modes of vibration of a stretched string; harmonics.<br><b>Ans:</b> Fundamental f=v/2L; harmonics 2f,3f... String fixed at both ends supports all harmonics.</p>
<p><b>Q6.</b> Distinguish progressive and stationary waves; discuss energy.<br><b>Ans:</b> Progressive: energy flows, uniform amplitude. Stationary: energy confined, amplitude 0→max. Nodes/antinodes in stationary.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>Superposition:</b> y = y1 + y2</p>
<p><b>Stationary wave:</b> y = 2A sin(kx) cos(ωt)</p>
<p><b>Nodes:</b> x = nλ/2 | <b>Antinodes:</b> x = (2n+1)λ/4 | Node–antinode = λ/4</p>
<p><b>Beat frequency:</b> = |f1 − f2|</p>
<p><b>String:</b> f = v/2L | v = √(T/μ) | harmonics nf</p>
<p><b>Doppler:</b> f' = f[(v ± v_o)/(v ∓ v_s)] | <b>Wave:</b> v = fλ</p>
<h3>🎨 DIAGRAMS TO PRACTICE</h3>
<p><b>1. Stationary wave:</b> Nodes (N) and antinodes (A) with λ/2 spacing.</p>
<p><b>2. Beats:</b> Two close-frequency waves and resultant loud-soft envelope.</p>
<p><b>3. String modes:</b> Fundamental, 2nd, 3rd harmonics on a string.</p>
<h3>🔢 NUMERICALS TRICKS</h3>
<p><b>1.</b> Beat freq = |f1−f2|; number of beats/sec.</p>
<p><b>2.</b> Node–node = λ/2; node–antinode = λ/4.</p>
<p><b>3.</b> String fundamental f = v/2L; v = √(T/μ).</p>
<p><b>4.</b> Doppler: approaching → higher freq; receding → lower.</p>
<p><b>5.</b> v = fλ always.</p>
<h3>⭐ TOP 10 BOARD QUESTIONS</h3>
<p><b>1.</b> Principle of superposition; stationary waves; nodes & antinodes. (4 marks)</p>
<p><b>2.</b> Derive stationary wave equation; nodes/antinodes positions. (4 marks)</p>
<p><b>3.</b> Beats: derive beat frequency; applications. (4 marks)</p>
<p><b>4.</b> Doppler effect: formula and applications. (4 marks)</p>
<p><b>5.</b> Modes of vibration of stretched string; harmonics. (3 marks)</p>
<p><b>6.</b> Distinguish progressive & stationary waves. (3 marks)</p>
<p><b>7.</b> Show node–node distance = λ/2. (3 marks)</p>
<p><b>8.</b> State principle of superposition. (2 marks)</p>
<p><b>9.</b> Define node and antinode. (2 marks)</p>
<p><b>10.</b> What are beats? (2 marks)</p>

notesData["7. Wave Optics"]=`
<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> Huygens' principle states every point on a wavefront acts as:<br>(a) a source of secondary wavelets (b) a sink (c) a mirror (d) none<br><b>Ans:</b> (a)</p>
<p><b>Q2.</b> A wavefront is the locus of points:<br>(a) in different phase (b) in the same phase (c) at rest (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q3.</b> Young's double slit experiment demonstrates:<br>(a) diffraction (b) interference (c) polarization (d) dispersion<br><b>Ans:</b> (b) interference</p>
<p><b>Q4.</b> Fringe width in YDSE is:<br>(a) λD/d (b) λd/D (c) dD/λ (d) λ/dD<br><b>Ans:</b> (a) β = λD/d</p>
<p><b>Q5.</b> In YDSE, bright fringes occur when path difference is:<br>(a) nλ (b) (2n−1)λ/2 (c) λ/4 (d) none<br><b>Ans:</b> (a) nλ</p>
<p><b>Q6.</b> Dark fringes occur when path difference is:<br>(a) nλ (b) (2n−1)λ/2 (c) 2nλ (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q7.</b> Diffraction is:<br>(a) bending of light around obstacles (b) reflection (c) refraction (d) polarization<br><b>Ans:</b> (a)</p>
<p><b>Q8.</b> First minimum in single slit diffraction occurs at:<br>(a) a sinθ = λ (b) a sinθ = λ/2 (c) a cosθ = λ (d) none<br><b>Ans:</b> (a) a sinθ = λ</p>
<p><b>Q9.</b> Polarization proves light is:<br>(a) longitudinal (b) transverse (c) both (d) none<br><b>Ans:</b> (b) transverse</p>
<p><b>Q10.</b> Brewster's law is:<br>(a) tan i_p = n (b) sin i_p = n (c) cos i_p = n (d) i_p = n<br><b>Ans:</b> (a) tan i_p = n</p>
<p><b>Q11.</b> At Brewster angle, reflected light is:<br>(a) unpolarized (b) completely polarized (c) partially polarized (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q12.</b> Malus' law is:<br>(a) I = I0 cos²θ (b) I = I0 sin²θ (c) I = I0 cosθ (d) I = I0 tanθ<br><b>Ans:</b> (a)</p>
<p><b>Q13.</b> Unpolarized light passing through a polarizer has intensity:<br>(a) I0 (b) I0/2 (c) 2I0 (d) zero<br><b>Ans:</b> (b) I0/2</p>
<p><b>Q14.</b> Coherent sources have:<br>(a) different frequency (b) same frequency & constant phase difference (c) random phase (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q15.</b> Two independent sources cannot produce sustained interference because:<br>(a) same frequency (b) phase difference changes randomly (c) same amplitude (d) none<br><b>Ans:</b> (b)</p>
<p><b>Q16.</b> Resolving power of a microscope is:<br>(a) ability to magnify (b) ability to distinguish two close objects (c) focal length (d) none<br><b>Ans:</b> (b)</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> State Huygens' principle.<br><b>Ans:</b> Every point on a wavefront acts as a source of secondary wavelets; the new wavefront is their envelope.</p>
<p><b>Q2.</b> Define wavefront.<br><b>Ans:</b> Locus of all points vibrating in the same phase.</p>
<p><b>Q3.</b> What is interference?<br><b>Ans:</b> Redistribution of light intensity due to superposition of coherent waves.</p>
<p><b>Q4.</b> What is fringe width?<br><b>Ans:</b> Distance between two consecutive bright (or dark) fringes; β = λD/d.</p>
<p><b>Q5.</b> Define diffraction.<br><b>Ans:</b> Bending/spreading of light around the edges of an obstacle or aperture.</p>
<p><b>Q6.</b> What is polarization?<br><b>Ans:</b> Restriction of light vibrations to a single plane (transverse nature).</p>
<p><b>Q7.</b> State Brewster's law.<br><b>Ans:</b> tan i_p = n, where i_p is the polarizing angle.</p>
<p><b>Q8.</b> State Malus' law.<br><b>Ans:</b> I = I0 cos²θ.</p>
<p><b>Q9.</b> What are coherent sources?<br><b>Ans:</b> Sources of same frequency with a constant phase difference.</p>
<p><b>Q10.</b> Define resolving power.<br><b>Ans:</b> Ability of an optical instrument to distinguish two closely spaced objects.</p>
<p><b>Q11.</b> What is a polaroid?<br><b>Ans:</b> A device that produces plane polarized light by selective absorption.</p>
<p><b>Q12.</b> Why does a diamond sparkle?<br><b>Ans:</b> Due to total internal reflection and high refractive index.</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> State and explain Huygens' principle.<br><b>Ans:</b> Each point on a wavefront emits secondary wavelets; the forward envelope gives the new wavefront. Explains reflection/refraction.</p>
<p><b>Q2.</b> Explain interference.<br><b>Ans:</b> Superposition of coherent waves produces bright (constructive) and dark (destructive) regions.</p>
<p><b>Q3.</b> State conditions for sustained interference.<br><b>Ans:</b> Coherent sources, same frequency, constant phase difference, same amplitude (preferably).</p>
<p><b>Q4.</b> Explain diffraction.<br><b>Ans:</b> Light bends around edges of obstacles; prominent when aperture/obstacle size ~ wavelength.</p>
<p><b>Q5.</b> Explain polarization.<br><b>Ans:</b> Light vibrations restricted to one plane; proves transverse nature. Done by polaroid, reflection, scattering.</p>
<p><b>Q6.</b> State Brewster's law.<br><b>Ans:</b> tan i_p = n; at i_p reflected and refracted rays are perpendicular.</p>
<p><b>Q7.</b> State Malus' law.<br><b>Ans:</b> Intensity through analyzer I = I0 cos²θ.</p>
<p><b>Q8.</b> Explain fringe width.<br><b>Ans:</b> β = λD/d; distance between consecutive fringes; increases with λ and D, decreases with d.</p>
<p><b>Q9.</b> What are coherent sources?<br><b>Ans:</b> Same frequency, constant phase difference; needed for stable interference.</p>
<p><b>Q10.</b> Explain resolving power.<br><b>Ans:</b> Ability to see two close objects separately; higher for larger aperture and shorter wavelength.</p>
<p><b>Q11.</b> Why is light a transverse wave?<br><b>Ans:</b> Because it can be polarized; longitudinal waves cannot be polarized.</p>
<p><b>Q12.</b> Explain single slit diffraction.<br><b>Ans:</b> Light through a narrow slit spreads; central maximum widest; minima at a sinθ = nλ.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive fringe width in Young's double slit experiment.<br><b>Ans:</b> Path difference = (d/D)x. For bright: (d/D)x = nλ → x_n = nλD/d. Fringe width β = x_{n+1} − x_n = λD/d.</p>
<p><b>Q2.</b> Derive conditions for bright and dark fringes in YDSE.<br><b>Ans:</b> Bright: path difference = nλ. Dark: path difference = (2n−1)λ/2.</p>
<p><b>Q3.</b> Explain single slit diffraction; first minimum.<br><b>Ans:</b> Light diffracts; central max between first minima. First minimum at a sinθ = λ; secondary maxima weaker.</p>
<p><b>Q4.</b> Derive Brewster's law.<br><b>Ans:</b> At i_p, reflected ray ⊥ refracted ray. Using Snell: n = sin i_p / sin r_p; with r_p = 90 − i_p → n = tan i_p.</p>
<p><b>Q5.</b> Explain polarization by reflection.<br><b>Ans:</b> At Brewster angle, reflected light is completely plane polarized with vibrations perpendicular to plane of incidence.</p>
<p><b>Q6.</b> State and verify Malus' law.<br><b>Ans:</b> I = I0 cos²θ. Verified by rotating analyzer; intensity varies as cos² of angle between polarizer and analyzer.</p>
<p><b>Q7.</b> Explain resolving power of a telescope.<br><b>Ans:</b> RP = D/(1.22λ); larger aperture D or shorter λ gives better resolution.</p>
<p><b>Q8.</b> Use Huygens' principle to construct a wavefront.<br><b>Ans:</b> Secondary wavelets from each point; envelope forms new wavefront. For point source: spherical; far source: plane.</p>
<p><b>Q9.</b> Why do two independent sources not produce interference?<br><b>Ans:</b> Their phase difference changes randomly with time, so the pattern fluctuates too fast to observe.</p>
<p><b>Q10.</b> Briefly explain diffraction grating.<br><b>Ans:</b> Many equally spaced slits; produces sharp maxima at d sinθ = nλ; used in spectroscopy.</p>
<p><b>Q11.</b> Give applications of interference.<br><b>Ans:</b> Thin film colors, antireflection coatings, measuring wavelengths, interferometry.</p>
<p><b>Q12.</b> Explain polaroid and its uses.<br><b>Ans:</b> Polaroid transmits one plane of vibration. Uses: sunglasses, LCD screens, 3D movies, photography.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> State Huygens' principle; explain reflection and refraction using wave theory.<br><b>Ans:</b> Every point emits secondary wavelets. Reflection: wavefront geometry gives angle i = r. Refraction: speed change bends wavefront (Snell's law).</p>
<p><b>Q2.</b> Young's double slit: derive fringe width and conditions for maxima/minima.<br><b>Ans:</b> β = λD/d. Bright: nλ; dark: (2n−1)λ/2. Path difference = (d/D)x.</p>
<p><b>Q3.</b> Single slit diffraction: derive positions of minima and maxima.<br><b>Ans:</b> Minima: a sinθ = nλ. Maxima approximately midway. Central maximum twice as wide as secondary.</p>
<p><b>Q4.</b> Polarization: Brewster's law and Malus' law.<br><b>Ans:</b> Brewster: tan i_p = n (reflected ⊥ refracted). Malus: I = I0 cos²θ. Unpolarized through polarizer → I0/2.</p>
<p><b>Q5.</b> Distinguish interference and diffraction.<br><b>Ans:</b> Interference: two coherent sources, equal-width fringes. Diffraction: single aperture, unequal fringes, central max brightest/widest.</p>
<p><b>Q6.</b> Explain resolving power of optical instruments.<br><b>Ans:</b> Ability to distinguish close objects. Microscope: RP ∝ 1/(1.22λ/NA). Telescope: RP = D/1.22λ. Better with larger aperture/shorter λ.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>Fringe width:</b> β = λD/d</p>
<p><b>Bright:</b> path diff = nλ | <b>Dark:</b> path diff = (2n−1)λ/2</p>
<p><b>Single slit minima:</b> a sinθ = nλ</p>
<p><b>Brewster:</b> tan i_p = n | <b>Malus:</b> I = I0 cos²θ</p>
<p><b>Polarizer:</b> unpolarized → I0/2 | <b>Grating:</b> d sinθ = nλ</p>
<p><b>Resolving power (telescope):</b> D/1.22λ</p>
<h3>🎨 DIAGRAMS TO PRACTICE</h3>
<p><b>1. Young's double slit:</b> Two slits, screen, bright/dark fringes, path difference.</p>
<p><b>2. Single slit diffraction pattern:</b> Central max + secondary maxima/minima.</p>
<p><b>3. Polarization by reflection:</b> Brewster angle, reflected ⊥ refracted.</p>
<h3>🔢 NUMERICALS TRICKS</h3>
<p><b>1.</b> β = λD/d; λ in m, D in m, d in m.</p>
<p><b>2.</b> Bright: nλ; dark: (2n−1)λ/2.</p>
<p><b>3.</b> Brewster: n = tan i_p.</p>
<p><b>4.</b> Malus: I = I0 cos²θ; θ=0 → I0; θ=90 → 0.</p>
<p><b>5.</b> Unpolarized through one polarizer → I0/2.</p>

<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> State Coulomb's law.<br><b>Ans:</b> Force between two charges is proportional to product of charges and inversely to square of distance: F = (1/4πε₀)q1q2/r².</p>
<p><b>Q2.</b> Define electric field.<br><b>Ans:</b> Force per unit positive charge: E = F/q.</p>
<p><b>Q3.</b> Define electric potential.<br><b>Ans:</b> Work done per unit positive charge to bring it from infinity to a point: V = W/q.</p>
<p><b>Q4.</b> Define capacitance.<br><b>Ans:</b> Charge stored per unit potential: C = q/V.</p>
<p><b>Q5.</b> State Gauss's law.<br><b>Ans:</b> Total flux through a closed surface = q_enclosed/ε₀.</p>
<p><b>Q6.</b> Define equipotential surface.<br><b>Ans:</b> A surface where potential is same at every point.</p>
<p><b>Q7.</b> What is a dielectric?<br><b>Ans:</b> An insulating material that gets polarized in an electric field.</p>
<p><b>Q8.</b> Define electric flux.<br><b>Ans:</b> Number of field lines passing through a surface: Φ = E·A cosθ.</p>
<p><b>Q9.</b> What is a point charge?<br><b>Ans:</b> A charge whose size is negligible compared to distances involved.</p>
<p><b>Q10.</b> Define potential difference.<br><b>Ans:</b> Work done per unit charge in moving between two points: ΔV = W/q.</p>
<p><b>Q11.</b> What is polarization of a dielectric?<br><b>Ans:</b> Alignment of molecular dipoles in an external electric field.</p>
<p><b>Q12.</b> Define 1 farad.<br><b>Ans:</b> Capacitance when 1 coulomb charge raises potential by 1 volt.</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> State and explain Coulomb's law.<br><b>Ans:</b> F = (1/4πε₀)q1q2/r²; like charges repel, unlike attract; acts along the line joining them.</p>
<p><b>Q2.</b> Explain electric field and field lines.<br><b>Ans:</b> E = F/q; field lines show direction of force on a positive charge; density shows strength.</p>
<p><b>Q3.</b> State properties of electric field lines.<br><b>Ans:</b> Start from +, end on −; never intersect; closer lines mean stronger field; perpendicular to conductor surface.</p>
<p><b>Q4.</b> Define potential; give relation between E and V.<br><b>Ans:</b> V = W/q; E = −dV/dr (field points from high to low potential).</p>
<p><b>Q5.</b> Explain equipotential surfaces.<br><b>Ans:</b> Surfaces of constant potential; perpendicular to field lines; no work to move charge on them.</p>
<p><b>Q6.</b> State Gauss's law.<br><b>Ans:</b> ∮E·dA = q_enclosed/ε₀; useful for symmetric charge distributions.</p>
<p><b>Q7.</b> Explain capacitance of a conductor.<br><b>Ans:</b> C = q/V; ability to store charge; depends on size, shape and surroundings.</p>
<p><b>Q8.</b> Explain parallel plate capacitor.<br><b>Ans:</b> Two parallel conducting plates; C = ε₀A/d; stores charge and energy.</p>
<p><b>Q9.</b> Effect of dielectric on capacitance.<br><b>Ans:</b> Inserting dielectric (constant K) increases capacitance to C = Kε₀A/d.</p>
<p><b>Q10.</b> Capacitors in series.<br><b>Ans:</b> Same charge; 1/C = 1/C1 + 1/C2; equivalent is less than each.</p>
<p><b>Q11.</b> Capacitors in parallel.<br><b>Ans:</b> Same potential; C = C1 + C2; equivalent is sum.</p>
<p><b>Q12.</b> Energy stored in a capacitor.<br><b>Ans:</b> U = ½CV² = q²/2C = ½qV.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive electric field due to a point charge.<br><b>Ans:</b> From Coulomb's law, F = (1/4πε₀)q/r². E = F/q₀ → E = (1/4πε₀)q/r² (radially outward for +q).</p>
<p><b>Q2.</b> Derive potential due to a point charge.<br><b>Ans:</b> V = −∫E·dr from ∞ to r = (1/4πε₀)q/r.</p>
<p><b>Q3.</b> Derive E = −dV/dr.<br><b>Ans:</b> Work dW = −qE·dr = qdV → E = −dV/dr. Field points from high to low potential.</p>
<p><b>Q4.</b> Apply Gauss's law to find field of an infinite sheet.<br><b>Ans:</b> Using Gaussian pillbox: E·2A = σA/ε₀ → E = σ/2ε₀ (uniform, independent of distance).</p>
<p><b>Q5.</b> Derive capacitance of a parallel plate capacitor.<br><b>Ans:</b> E = σ/ε₀ = q/(ε₀A); V = Ed = qd/(ε₀A); C = q/V = ε₀A/d.</p>
<p><b>Q6.</b> Derive energy stored in a capacitor.<br><b>Ans:</b> dU = V dq = (q/C)dq; integrate 0 to q → U = q²/2C = ½CV².</p>
<p><b>Q7.</b> Derive equivalent capacitance in series.<br><b>Ans:</b> Same q; V = V1+V2 → q/C = q/C1+q/C2 → 1/C = 1/C1+1/C2.</p>
<p><b>Q8.</b> Derive equivalent capacitance in parallel.<br><b>Ans:</b> Same V; q = q1+q2 = C1V+C2V → C = C1+C2.</p>
<p><b>Q9.</b> Explain electric dipole and its field.<br><b>Ans:</b> Two equal opposite charges separated by small distance; dipole moment p = qd; field along axis/equator.</p>
<p><b>Q10.</b> Apply Gauss's law to a conducting sphere.<br><b>Ans:</b> Outside: E = (1/4πε₀)q/r²; inside conductor: E = 0; charge resides on surface.</p>
<p><b>Q11.</b> Dielectric in capacitor; derive new capacitance.<br><b>Ans:</b> Dielectric reduces field by K; V reduces; C increases to C = Kε₀A/d.</p>
<p><b>Q12.</b> Potential energy of two point charges.<br><b>Ans:</b> U = (1/4πε₀)q1q2/r; positive for like, negative for unlike charges.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> State Coulomb's law; give vector form and superposition.<br><b>Ans:</b> F = (1/4πε₀)q1q2/r² along line joining charges. Vector form with unit vector. Superposition: net force = vector sum of forces from each charge.</p>
<p><b>Q2.</b> Derive electric field due to point charge and discuss dipole.<br><b>Ans:</b> Point charge: E = (1/4πε₀)q/r². Dipole: field along axis ∝ 1/r³; equatorial field opposite direction.</p>
<p><b>Q3.</b> State Gauss's law; apply to sphere, sheet and line charge.<br><b>Ans:</b> ∮E·dA = q/ε₀. Sphere outside E = kq/r²; infinite sheet E = σ/2ε₀; infinite line E = λ/2πε₀r.</p>
<p><b>Q4.</b> Explain parallel plate capacitor; effect of dielectric; energy stored.<br><b>Ans:</b> C = ε₀A/d; with dielectric C = Kε₀A/d; energy U = ½CV² = q²/2C.</p>
<p><b>Q5.</b> Derive equivalent capacitance for series and parallel.<br><b>Ans:</b> Series: 1/C = 1/C1+1/C2 (same charge). Parallel: C = C1+C2 (same potential).</p>
<p><b>Q6.</b> Derive potential due to a point charge; explain equipotential surfaces.<br><b>Ans:</b> V = (1/4πε₀)q/r. Equipotential surfaces are concentric spheres; perpendicular to field lines; no work on them.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>Coulomb:</b> F = (1/4πε₀)q1q2/r² | <b>E field:</b> E = F/q = (1/4πε₀)q/r²</p>
<p><b>Potential:</b> V = (1/4πε₀)q/r | E = −dV/dr</p>
<p><b>Gauss:</b> ∮E·dA = q/ε₀ | Sheet: E = σ/2ε₀ | Line: E = λ/2πε₀r</p>
<p><b>Capacitance:</b> C = q/V | Parallel plate: C = ε₀A/d | With dielectric: C = Kε₀A/d</p>
<p><b>Combination:</b> Series 1/C = Σ1/C | Parallel C = ΣC | <b>Energy:</b> U = ½CV² = q²/2C</p>
<h3>📐 VALUES TO MEMORISE</h3>
<p><b>ε₀</b> = 8.85 × 10⁻¹² C²/N·m² | <b>1/4πε₀</b> = 9 × 10⁹ N·m²/C²</p>
<p><b>Charge e</b> = 1.6 × 10⁻¹⁹ C</p>
<h3>🎨 DIAGRAMS TO PRACTICE</h3>
<p><b>1. Electric field lines:</b> positive, negative, dipole.</p>
<p><b>2. Parallel plate capacitor:</b> plates, field lines, dielectric.</p>
<p><b>3. Equipotential surfaces:</b> concentric spheres around point charge.</p>
<p><b>4. Gaussian surface:</b> sphere around charge.</p>
<h3>🔢 NUMERICALS TRICKS</h3>
<p><b>1.</b> F ∝ 1/r²; if r doubled, force becomes 1/4.</p>
<p><b>2.</b> E ∝ 1/r²; V ∝ 1/r.</p>

<p><b>4.</b> Series: charge same; parallel: voltage same.</p>
<p><b>5.</b> Energy U = ½CV²; charge q = CV.</p>
