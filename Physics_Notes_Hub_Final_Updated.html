*{margin:0;padding:0;box-sizing:border-box}

<script>
const notesData={},paper={};
let prof=JSON.parse(localStorage.getItem('prof')||'null'),score=parseInt(localStorage.getItem('score')||'0'),mode='notes',paperMarks={};
const $=id=>document.getElementById(id);
function setTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('ptheme',t);$('themeBtn').textContent=t==='dark'?'☀️':'🌙'}
$('themeBtn').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
setTheme(localStorage.getItem('ptheme')||'light');
setTimeout(()=>{$('splash').style.display='none';if(prof){$('app').style.display='block';renderProfile();showNotes()}else{$('setup').style.display='flex'}},2500);
function handlePhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');const s=200/Math.max(i.width,i.height);c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);$('photoPrev').src=c.toDataURL('image/jpeg',.7)};i.src=ev.target.result};r.readAsDataURL(f)}
$('photo').onchange=handlePhoto;$('photo2').onchange=handlePhoto;
$('photoPrev').onclick=()=>$('photo').click();
function saveSetup(){const n=$('sName').value.trim();if(!n){alert('Naam zaroori hai!');return}prof={name:n,cls:$('sClass').value.trim(),photo:$('photoPrev').src};localStorage.setItem('prof',JSON.stringify(prof));$('setup').style.display='none';$('app').style.display='block';renderProfile();showNotes()}
function renderProfile(){$('profile').innerHTML='<div class="profLeft"><img src="'+(prof.photo||'')+'"><div><div class="nm">'+prof.name+'</div><div style="font-size:.8rem;opacity:.7">'+prof.cls+'</div></div></div><div id="scoreBadge">⭐ '+score+'</div>'}
function setActive(){$('tabNotes').classList.toggle('active',mode==='notes');$('tabImportant').classList.toggle('active',mode==='important');$('tabExam').classList.toggle('active',mode==='exam')}
function showNotes(){
  document.body.classList.remove('importantMode');mode='notes';document.body.classList.remove('examMode');$('examBanner').style.display='none';$('notes').style.display='none';$('chapterList').style.display='block';$('search').style.display='block';renderList();setActive()}
function showExamList(){
  document.body.classList.remove('importantMode');mode='exam';document.body.classList.add('examMode');$('examBanner').style.display='block';$('examBanner').textContent='🎯 BOARD PAPER — Apna chapter chuno';$('notes').style.display='none';$('chapterList').style.display='block';$('search').style.display='block';renderList();setActive()}

const importantData = {"1. Rotational Dynamics": {"items": [["Derivation", "Derive the angle of banking for a vehicle moving on a banked road when friction is neglected.", "Consider a vehicle of mass m moving with speed v on a banked road of radius r. Let the banking angle be θ and the normal reaction be N.\n\nVertical equilibrium gives:\nN cosθ = mg\n\nThe horizontal component of N provides the centripetal force:\nN sinθ = mv²/r\n\nDividing the second equation by the first:\ntanθ = v²/(rg)\n\nTherefore, the required angle of banking is\n\nθ = tan⁻¹[v²/(rg)].\n\nThus banking provides the required centripetal force without depending on friction."], ["Derivation", "Prove the parallel-axis theorem.", "Let the moment of inertia of a body about an axis through its centre of mass be I_CM. Consider another parallel axis at perpendicular distance d.\n\nFor a mass element dm at distance x from the centre-of-mass axis, its distance from the new axis is represented by the corresponding displacement. On integrating over the complete body, the cross term vanishes because the origin is at the centre of mass.\n\nHence,\n\nI = I_CM + Md²,\n\nwhere M is the total mass and d is the distance between the two parallel axes.\n\nTherefore,\n\nI = I_CM + Md².\n\nThis is the parallel-axis theorem."], ["Derivation", "Derive the kinetic energy of a rolling body.", "For a body rolling without slipping, the motion consists of translation of its centre of mass and rotation about its centre of mass.\n\nTranslational kinetic energy:\nK_trans = 1/2 Mv²\n\nRotational kinetic energy:\nK_rot = 1/2 Iω²\n\nTherefore,\n\nK = 1/2 Mv² + 1/2 Iω².\n\nFor pure rolling,\nv = Rω,\nso ω = v/R.\n\nIf I = MK²,\n\nK = 1/2 Mv² + 1/2(MK²)(v²/R²)\n\nTherefore,\n\nK = 1/2 Mv²(1 + K²/R²).\n\nHence proved."], ["Derivation", "Derive the expression for centripetal acceleration.", "Consider a particle moving uniformly in a circle of radius r with speed v. Although the magnitude of velocity remains constant, its direction continuously changes.\n\nFor a small angular displacement Δθ, the change in velocity has magnitude\n\nΔv ≈ vΔθ.\n\nSince Δθ = vΔt/r,\n\nΔv = v(vΔt/r).\n\nTherefore,\n\na = Δv/Δt = v²/r.\n\nUsing v = rω,\n\na = rω².\n\nThus the centripetal acceleration is\n\na_c = v²/r = rω²,\n\nand it is directed towards the centre of the circular path."], ["Theory", "Explain why a cyclist bends inward while taking a turn.", "While turning, the cyclist requires a centripetal force directed towards the centre of the circular path. The required horizontal component is supplied mainly by friction between the tyres and road.\n\nBy bending inward, the cyclist makes the resultant of the normal reaction and friction pass through the centre of gravity. This prevents an unbalanced turning torque and helps maintain equilibrium.\n\nTherefore, a cyclist bends inward while taking a turn."], ["Theory", "Define moment of inertia and state the factors affecting it.", "Moment of inertia is the rotational analogue of mass. For discrete particles,\n\nI = Σmr².\n\nIt depends on the mass of the body, distribution of mass about the axis of rotation, shape and size of the body, and the position and orientation of the axis.\n\nIts SI unit is kg m² and its dimensions are [ML²]."], ["Numerical", "A vehicle moves around a circular road of radius r with speed v. Find the required banking angle when friction is neglected.", "Given:\nSpeed = v\nRadius = r\nAcceleration due to gravity = g\n\nFor a frictionless banked road,\n\ntanθ = v²/(rg).\n\nSubstitute the given numerical values in SI units and calculate θ using\n\nθ = tan⁻¹[v²/(rg)].\n\nThe final answer should be stated in degrees if the question asks for the banking angle."], ["Diagram", "Draw a banked road and show the forces acting on a vehicle.", "Draw a vehicle on an inclined road surface. Mark the banking angle θ, weight mg vertically downward and normal reaction N perpendicular to the road. Resolve N into N cosθ vertically and N sinθ horizontally towards the centre. Label radius r and velocity v."]]}, "2. Mechanical Properties of Fluids": {"items": [["Derivation", "State and prove Bernoulli's theorem.", "Consider steady, incompressible and non-viscous flow of a fluid through a tube.\n\nAt two sections 1 and 2, let pressure, speed and height be P₁, v₁, h₁ and P₂, v₂, h₂.\n\nWork done by pressure forces is equal to the change in kinetic and potential energy.\n\nTherefore,\n\nP₁V − P₂V = 1/2 ρV(v₂² − v₁²) + ρVg(h₂ − h₁).\n\nDividing by V and rearranging,\n\nP₁ + 1/2ρv₁² + ρgh₁\n=\nP₂ + 1/2ρv₂² + ρgh₂.\n\nHence,\n\nP + 1/2ρv² + ρgh = constant.\n\nThis is Bernoulli's theorem. It expresses conservation of mechanical energy in steady ideal fluid flow."], ["Derivation", "Derive the expression for capillary rise.", "Consider a capillary tube of radius r dipped in a liquid. Let the surface tension be T and angle of contact be θ.\n\nThe upward vertical component of surface-tension force around the circumference is\n\nF_up = 2πr T cosθ.\n\nIf the liquid rises through height h, the weight of the liquid column is\n\nW = πr²hρg.\n\nAt equilibrium,\n\n2πrT cosθ = πr²hρg.\n\nCancelling πr,\n\nh = 2T cosθ/(rρg).\n\nTherefore,\n\nh = 2T cosθ/(rρg).\n\nFor a wetting liquid, θ is less than 90°, so the liquid rises."], ["Derivation", "Derive terminal velocity using Stokes' law.", "Consider a small spherical body of radius r and density ρ_s falling through a viscous fluid of density ρ.\n\nThe downward force due to excess weight is\n\nF = 4/3 πr³(ρ_s − ρ)g.\n\nAccording to Stokes' law, viscous drag at velocity v is\n\nF_v = 6πηrv.\n\nAt terminal velocity v_t, the forces balance:\n\n4/3 πr³(ρ_s − ρ)g = 6πηr v_t.\n\nTherefore,\n\nv_t = 2r²(ρ_s − ρ)g/(9η).\n\nHence terminal velocity is directly proportional to the square of the radius and inversely proportional to viscosity."], ["Derivation", "Derive the excess pressure inside a soap bubble.", "A soap bubble has two liquid surfaces. Let radius be r and surface tension be T.\n\nIf the radius increases by dr, the increase in surface area of both surfaces is\n\ndA = 16πr dr.\n\nThe work done by surface tension is\n\ndW = T dA = 16πrT dr.\n\nIf excess pressure is ΔP, the work done by pressure is\n\ndW = ΔP × dV,\n\nwhere dV = 4πr²dr.\n\nThus,\n\nΔP(4πr²dr) = 16πrTdr.\n\nTherefore,\n\nΔP = 4T/r.\n\nHence the excess pressure inside a soap bubble is\n\nΔP = 4T/r."], ["Theory", "State Pascal's law and explain a hydraulic lift.", "Pascal's law states that pressure applied to an enclosed fluid is transmitted equally and undiminished in all directions.\n\nIn a hydraulic lift, a force F₁ acts on a small piston of area A₁ and produces pressure\n\nP = F₁/A₁.\n\nThe same pressure acts on a larger piston of area A₂:\n\nF₂/A₂ = F₁/A₁.\n\nTherefore,\n\nF₂ = F₁(A₂/A₁).\n\nA small force can thus produce a large lifting force."], ["Theory", "Why are raindrops approximately spherical?", "Surface tension tends to reduce the surface area of a liquid for a given volume. Among all shapes having the same volume, a sphere has the minimum surface area.\n\nTherefore, surface tension tends to make small freely falling liquid drops spherical."], ["Numerical", "A liquid rises in a capillary tube. Find the capillary rise for given surface tension, radius, density and angle of contact.", "Given:\nSurface tension = T\nRadius = r\nDensity = ρ\nAngle of contact = θ\nAcceleration due to gravity = g\n\nUse\n\nh = 2T cosθ/(rρg).\n\nSubstitute all quantities in SI units. Calculate h and state the result in metres."], ["Diagram", "Draw a capillary tube showing capillary rise.", "Draw a narrow tube dipped in liquid. Show the curved meniscus, radius r, angle of contact θ, liquid column height h and upward surface-tension force. Label atmospheric pressure and liquid level if required."]]}, "3. Kinetic Theory of Gases & Radiation": {"items": [["Derivation", "State the postulates of kinetic theory and derive P = 1/3 ρ c_rms².", "For an ideal gas, molecules are in continuous random motion, their own volume is negligible, collisions are perfectly elastic, and intermolecular forces are negligible except during collisions.\n\nConsider a cube of side l containing N molecules, each of mass m. For motion along the x-axis, the pressure contribution gives\n\nP = Nm⟨c_x²⟩/V.\n\nBecause molecular motion is random,\n\n⟨c_x²⟩ = ⟨c_y²⟩ = ⟨c_z²⟩ = 1/3⟨c²⟩.\n\nTherefore,\n\nP = 1/3 (Nm/V)⟨c²⟩.\n\nSince ρ = Nm/V,\n\nP = 1/3 ρ c_rms².\n\nHence proved."], ["Derivation", "Derive the average kinetic energy per molecule.", "From the kinetic theory result,\n\nPV = 1/3 Nm c_rms².\n\nFor an ideal gas,\n\nPV = NkT.\n\nEquating,\n\nNkT = 1/3 Nm c_rms².\n\nTherefore,\n\n1/2 m c_rms² = 3/2 kT.\n\nThe left side is the average translational kinetic energy of one molecule.\n\nHence,\n\nE_avg = 3/2 kT.\n\nThus average molecular kinetic energy is directly proportional to absolute temperature."], ["Derivation", "Derive the relation C_p − C_v = R.", "For one mole of an ideal gas, the first law gives\n\ndQ = dU + PdV.\n\nAt constant volume,\n\ndQ_v = C_v dT,\n\nso\n\ndU = C_v dT.\n\nAt constant pressure,\n\ndQ_p = C_p dT.\n\nTherefore,\n\nC_p dT = C_v dT + P dV.\n\nFor one mole of an ideal gas,\n\nPV = RT.\n\nAt constant pressure,\n\nP dV = R dT.\n\nHence,\n\nC_p dT = C_v dT + R dT.\n\nTherefore,\n\nC_p − C_v = R.\n\nThis is Mayer's relation."], ["Derivation", "Derive the rms speed of gas molecules.", "For an ideal gas,\n\nPV = 1/3 Nm c_rms².\n\nUsing PV = NkT,\n\nNkT = 1/3 Nm c_rms².\n\nCancel N and m:\n\nc_rms² = 3kT/m.\n\nTherefore,\n\nc_rms = √(3kT/m).\n\nFor molar mass M,\n\nc_rms = √(3RT/M)."], ["Theory", "Explain mean free path.", "Mean free path is the average distance travelled by a gas molecule between two successive collisions.\n\nIt depends on molecular size, number density and pressure. At higher pressure, molecules are closer together and the mean free path decreases. At lower pressure, it increases.\n\nThus mean free path is an important measure of molecular collision behaviour in gases."], ["Theory", "What is a black body?", "A black body is an ideal body that absorbs all incident electromagnetic radiation, irrespective of wavelength and direction.\n\nIt is also the best possible emitter of thermal radiation at a given temperature. Its radiation depends only on its temperature and not on its material or surface details."], ["Numerical", "Find the rms speed of gas molecules at temperature T for molar mass M.", "Given:\nTemperature = T\nMolar mass = M\n\nFormula:\n\nc_rms = √(3RT/M).\n\nUse R = 8.314 J mol⁻¹ K⁻¹ and express M in kg mol⁻¹. Substitute the values and calculate the speed in m s⁻¹."], ["Diagram", "Draw a black-body radiation curve.", "Draw intensity on the vertical axis and wavelength on the horizontal axis. Show curves for different temperatures. Indicate that the peak shifts towards shorter wavelength as temperature increases."]]}, "4. Thermodynamics": {"items": [["Derivation", "State the first law of thermodynamics and apply it to the four basic processes.", "The first law is\n\nQ = ΔU + W,\n\nwhere Q is heat supplied, ΔU is change in internal energy and W is work done by the system.\n\nFor an isochoric process, dV = 0, so W = 0 and Q = ΔU.\n\nFor an isobaric process, W = PΔV, so Q = ΔU + PΔV.\n\nFor an isothermal process of an ideal gas, ΔU = 0, so Q = W.\n\nFor an adiabatic process, Q = 0, so ΔU = −W.\n\nThus the first law connects heat, internal energy and work for all thermodynamic processes."], ["Derivation", "Derive the work done during an isothermal expansion of an ideal gas.", "For an ideal gas undergoing isothermal expansion, temperature remains constant.\n\nWork done is\n\nW = ∫P dV.\n\nFrom the ideal gas equation,\n\nP = nRT/V.\n\nTherefore,\n\nW = nRT ∫(dV/V)\n\nfrom V₁ to V₂.\n\nHence,\n\nW = nRT ln(V₂/V₁).\n\nSince P₁V₁ = P₂V₂,\n\nW = nRT ln(P₁/P₂).\n\nThus the work done in an isothermal expansion is\n\nW = nRT ln(V₂/V₁)."], ["Derivation", "Derive the adiabatic equation PV^γ = constant.", "For an adiabatic process,\n\ndQ = 0.\n\nFrom the first law,\n\ndQ = dU + PdV,\n\ntherefore,\n\ndU + PdV = 0.\n\nFor n moles,\n\ndU = nC_v dT.\n\nHence,\n\nnC_v dT + PdV = 0.\n\nUsing PV = nRT and differentiating,\n\nP dV + V dP = nR dT.\n\nSubstitute dT in the first equation and use γ = C_p/C_v with C_p − C_v = R. After simplification,\n\ndP/P + γ dV/V = 0.\n\nIntegrating,\n\nln P + γ ln V = constant.\n\nTherefore,\n\nPV^γ = constant.\n\nHence proved."], ["Derivation", "Derive the efficiency of a Carnot engine.", "A Carnot engine operates between a source at temperature T_H and a sink at T_C.\n\nEfficiency is\n\nη = W/Q_H.\n\nSince W = Q_H − Q_C,\n\nη = 1 − Q_C/Q_H.\n\nFor a reversible Carnot cycle,\n\nQ_C/Q_H = T_C/T_H.\n\nTherefore,\n\nη = 1 − T_C/T_H.\n\nHence the efficiency depends only on the temperatures of the source and sink, with temperatures measured in kelvin."], ["Theory", "Distinguish between isothermal and adiabatic processes.", "In an isothermal process, temperature remains constant, so for an ideal gas ΔU = 0 and heat supplied is equal to work done.\n\nIn an adiabatic process, no heat is exchanged with the surroundings, so Q = 0. The temperature changes because work is done at the expense of internal energy.\n\nFor an ideal gas, an adiabatic curve is steeper than an isothermal curve on a P–V diagram."], ["Theory", "State the second law of thermodynamics.", "Kelvin-Planck statement: No heat engine can convert all the heat absorbed from a single reservoir completely into work.\n\nClausius statement: Heat cannot flow spontaneously from a colder body to a hotter body without external work.\n\nThe second law establishes the direction of natural thermodynamic processes and places a limit on heat-engine efficiency."], ["Numerical", "Calculate the efficiency of a Carnot engine operating between temperatures T_H and T_C.", "Given:\nSource temperature = T_H\nSink temperature = T_C\n\nFormula:\n\nη = 1 − T_C/T_H.\n\nUse absolute temperatures in kelvin. Substitute the values and multiply by 100 to express efficiency as a percentage."], ["Diagram", "Draw the Carnot cycle on a P–V diagram.", "Draw two isothermal curves and two adiabatic curves forming a closed cycle. Mark the high-temperature isothermal expansion, adiabatic expansion, low-temperature isothermal compression and adiabatic compression. Indicate the direction of the cycle and work output."]]}, "5. Oscillations": {"items": [["Derivation", "Define SHM and derive the displacement, velocity and acceleration equations.", "In simple harmonic motion, acceleration is directly proportional to displacement and is always directed towards the mean position:\n\na = −ω²x.\n\nThe displacement can be written as\n\nx = A sin(ωt + φ).\n\nFor φ = 0,\n\nx = A sin(ωt).\n\nVelocity:\n\nv = dx/dt\n  = Aω cos(ωt).\n\nUsing sin²θ + cos²θ = 1,\n\nv² = A²ω² − ω²x².\n\nTherefore,\n\nv = ±ω√(A² − x²).\n\nAcceleration:\n\na = dv/dt\n  = −Aω² sin(ωt)\n  = −ω²x.\n\nHence the three equations are\n\nx = A sin(ωt),\nv = Aω cos(ωt),\na = −ω²x."], ["Derivation", "Derive the total energy in SHM and show that it is conserved.", "At displacement x, potential energy is\n\nPE = 1/2 kx².\n\nUsing\n\nv² = ω²(A² − x²)\n\nand k = mω²,\n\nKE = 1/2 mv²\n   = 1/2 k(A² − x²).\n\nTherefore,\n\nE = KE + PE\n  = 1/2 k(A² − x²) + 1/2 kx²\n  = 1/2 kA².\n\nSince k and A are constant,\n\nE = 1/2 kA² = constant.\n\nAt the mean position, KE is maximum and PE is zero. At the extreme positions, PE is maximum and KE is zero."], ["Derivation", "Derive the time period of a simple pendulum.", "For small angular displacement θ, the restoring force is\n\nF = −mg sinθ ≈ −mgθ.\n\nSince θ = x/l,\n\nF = −(mg/l)x.\n\nTherefore,\n\na = F/m = −(g/l)x.\n\nComparing with a = −ω²x,\n\nω² = g/l.\n\nThus,\n\nω = √(g/l).\n\nTherefore,\n\nT = 2π/ω = 2π√(l/g).\n\nHence the time period of a simple pendulum is independent of the mass of the bob for small oscillations."], ["Derivation", "Derive the time period of a spring-mass system.", "For a mass m attached to a spring of force constant k,\n\nF = −kx.\n\nUsing F = ma,\n\na = −(k/m)x.\n\nComparing with the SHM equation,\n\na = −ω²x,\n\nwe get\n\nω² = k/m.\n\nTherefore,\n\nω = √(k/m).\n\nHence,\n\nT = 2π√(m/k).\n\nThus the time period depends on mass and spring constant and is independent of gravitational acceleration."], ["Theory", "Explain damped oscillations, forced oscillations and resonance.", "In damped oscillation, resistive forces continuously remove mechanical energy, so amplitude decreases with time.\n\nIn forced oscillation, an external periodic force drives the system. The oscillator ultimately vibrates with the driving frequency.\n\nResonance occurs when the driving frequency becomes equal or very close to the natural frequency. The amplitude then becomes maximum. Examples include a swing being pushed at its natural frequency and tuning of radio circuits."], ["Theory", "Why is velocity maximum at the mean position and zero at the extreme position?", "For SHM,\n\nv² = ω²(A² − x²).\n\nAt the mean position, x = 0, so\n\nv_max = Aω.\n\nAt an extreme position, x = ±A, so\n\nv = 0.\n\nHence velocity is maximum at the mean position and zero at the extreme positions."], ["Numerical", "A particle in SHM has amplitude A and angular frequency ω. Find its maximum speed and maximum acceleration.", "Maximum speed occurs at x = 0:\n\nv_max = Aω.\n\nMaximum acceleration occurs at |x| = A:\n\na_max = ω²A.\n\nSubstitute the given A and ω values in SI units to obtain the numerical results."], ["Diagram", "Draw the energy variation graph in SHM.", "Plot displacement x on the horizontal axis. Draw PE = 1/2kx² as an upward parabola, KE = 1/2k(A²−x²) as a downward parabola and total energy E = 1/2kA² as a horizontal line."]]}, "6. Superposition of Waves": {"items": [["Derivation", "Derive the equation of a stationary wave and obtain the positions of nodes and antinodes.", "Consider two waves of equal amplitude and frequency travelling in opposite directions:\n\ny₁ = A sin(ωt − kx)\n\ny₂ = A sin(ωt + kx).\n\nBy superposition,\n\ny = y₁ + y₂.\n\nUsing the identity sinC + sinD = 2sin[(C+D)/2]cos[(C−D)/2],\n\ny = 2A sinωt coskx.\n\nFor nodes, amplitude is zero:\n\ncoskx = 0.\n\nTherefore,\n\nkx = (2n+1)π/2,\n\nso\n\nx = (2n+1)λ/4.\n\nFor antinodes, amplitude is maximum:\n\ncoskx = ±1,\n\nso\n\nx = nλ/2.\n\nThus nodes and antinodes are fixed in position."], ["Derivation", "Derive the beat frequency.", "Let two waves have frequencies f₁ and f₂ and nearly equal amplitudes.\n\nTheir resultant amplitude varies periodically because of interference. The number of amplitude maxima heard per second is equal to the difference between the two frequencies.\n\nTherefore,\n\nf_beat = |f₁ − f₂|.\n\nThus beat frequency is the absolute difference of the two source frequencies."], ["Derivation", "Explain the Doppler effect and write its general expression.", "Doppler effect is the apparent change in frequency of a wave due to relative motion between the source and observer.\n\nFor sound, when the observer and source move along the line joining them, the apparent frequency is\n\nf' = f (v ± v_o)/(v ∓ v_s),\n\nwhere v is the speed of sound, v_o is observer speed and v_s is source speed.\n\nThe signs are chosen according to whether the source and observer move towards or away from each other.\n\nWhen they approach, the observed frequency increases; when they recede, it decreases."], ["Theory", "Distinguish between progressive waves and stationary waves.", "A progressive wave transfers energy from one point to another and its waveform travels through the medium.\n\nA stationary wave is formed by superposition of two waves having equal frequency, equal amplitude and opposite directions. It has fixed nodes and antinodes and there is no net energy transfer along the medium.\n\nIn a progressive wave all particles can have different amplitudes and phases, while in a stationary wave particles between two consecutive nodes oscillate in phase."], ["Theory", "Define node and antinode.", "A node is a point in a stationary wave where the resultant amplitude is always zero.\n\nAn antinode is a point where the resultant amplitude is maximum.\n\nThe distance between two consecutive nodes, or two consecutive antinodes, is λ/2, while the distance between a node and the nearest antinode is λ/4."], ["Numerical", "Two tuning forks have frequencies f₁ and f₂. Find the number of beats heard per second.", "Given:\nFrequencies = f₁ and f₂.\n\nFormula:\n\nf_beat = |f₁ − f₂|.\n\nSubstitute the two frequencies. The result gives the number of beats per second."], ["Diagram", "Draw a stationary wave showing nodes and antinodes.", "Draw a sinusoidal stationary-wave pattern with fixed zero-amplitude points and maximum-amplitude points. Label N for nodes, A for antinodes, λ/2 between consecutive nodes and λ/4 between a node and adjacent antinode."]]}, "7. Wave Optics": {"items": [["Derivation", "Derive the fringe width in Young's double-slit experiment.", "Let two coherent slits be separated by distance d and the screen be at distance D.\n\nFor a point P at distance y from the central axis, the path difference is approximately\n\nδ = dy/D.\n\nFor two successive bright fringes, the path difference changes by one wavelength:\n\ndβ/D = λ.\n\nTherefore,\n\nβ = λD/d.\n\nHence fringe width is\n\nβ = λD/d.\n\nIt increases with wavelength and screen distance and decreases when slit separation increases."], ["Derivation", "State Huygens' principle and explain reflection and refraction using wavefronts.", "Huygens' principle states that every point on a wavefront acts as a source of secondary wavelets. The new wavefront is the common tangent to these wavelets.\n\nFor reflection, construction of secondary wavelets gives\n\nangle of incidence = angle of reflection.\n\nFor refraction, the speed of the wave changes on entering another medium. Since frequency remains unchanged, wavelength changes. The wavefront construction gives Snell's law:\n\nsin i/sin r = v₁/v₂ = n₂/n₁.\n\nThus reflection and refraction can be explained using wavefront propagation."], ["Derivation", "Derive Brewster's law.", "At the polarizing angle i_p, the reflected and refracted rays are perpendicular.\n\nTherefore,\n\ni_p + r = 90°.\n\nUsing Snell's law,\n\nμ = sin i_p/sin r.\n\nSince r = 90° − i_p,\n\nsin r = cos i_p.\n\nHence,\n\nμ = sin i_p/cos i_p\n\nor\n\nμ = tan i_p.\n\nTherefore,\n\ntan i_p = μ.\n\nThis is Brewster's law."], ["Derivation", "State the condition for single-slit diffraction minima.", "For a slit of width a, consider waves from different parts of the slit reaching a point on the screen at angle θ.\n\nThe path difference between extreme rays is\n\na sinθ.\n\nFor a dark fringe, this path difference must be an integral multiple of wavelength:\n\na sinθ = nλ,\n\nwhere n = 1, 2, 3, ...\n\nThus the condition for minima is\n\na sinθ = nλ."], ["Theory", "Distinguish between interference and diffraction.", "Interference results from superposition of waves from two or more coherent sources. In ideal double-slit interference, bright fringes are nearly equally spaced.\n\nDiffraction is the bending/spreading of waves around an obstacle or through a narrow aperture. The central maximum is wider and more intense than the secondary maxima.\n\nBoth phenomena arise from superposition of waves, but their physical arrangements are different."], ["Theory", "What is polarization?", "Polarization is the phenomenon of restricting the vibrations of a transverse wave to a particular direction perpendicular to the direction of propagation.\n\nIt proves that light is a transverse wave because only transverse waves can be polarized."], ["Numerical", "In YDSE, calculate fringe width for wavelength λ, screen distance D and slit separation d.", "Given:\nWavelength = λ\nScreen distance = D\nSlit separation = d.\n\nFormula:\n\nβ = λD/d.\n\nConvert all lengths to metres, substitute the values and state fringe width in metres."], ["Diagram", "Draw Young's double-slit experimental arrangement.", "Draw a monochromatic source illuminating two coherent slits S₁ and S₂ separated by d, followed by a screen at distance D. Mark the central maximum, a point P at distance y and the path difference."]]}, "8. Electrostatics": {"items": [["Derivation", "State Gauss's law and derive the electric field due to a point charge.", "Gauss's law states\n\n∮E·dA = q/ε₀.\n\nConsider a point charge q at the centre of a spherical Gaussian surface of radius r.\n\nBy symmetry, electric field has the same magnitude E everywhere on the surface and is radial.\n\nTherefore,\n\nE(4πr²) = q/ε₀.\n\nHence,\n\nE = q/(4πε₀r²).\n\nThe field is directed radially outward for a positive charge and inward for a negative charge."], ["Derivation", "Derive the capacitance of a parallel-plate capacitor.", "Consider two parallel conducting plates of area A separated by distance d in vacuum. Let charge on the plates be ±Q.\n\nSurface charge density is\n\nσ = Q/A.\n\nThe electric field between large parallel plates is\n\nE = σ/ε₀ = Q/(ε₀A).\n\nPotential difference is\n\nV = Ed = Qd/(ε₀A).\n\nCapacitance is\n\nC = Q/V.\n\nTherefore,\n\nC = ε₀A/d.\n\nIf a dielectric of relative permittivity K fills the space,\n\nC = Kε₀A/d.\n\nHence proved."], ["Derivation", "Derive the equivalent capacitance for capacitors in series.", "For capacitors C₁, C₂, ... in series, the same charge Q appears on each capacitor.\n\nThe total potential difference is\n\nV = V₁ + V₂ + ...\n\nUsing V = Q/C,\n\nV = Q/C₁ + Q/C₂ + ...\n\nIf equivalent capacitance is C_eq,\n\nV = Q/C_eq.\n\nTherefore,\n\n1/C_eq = 1/C₁ + 1/C₂ + ...\n\nHence for two capacitors,\n\nC_eq = C₁C₂/(C₁ + C₂)."], ["Derivation", "Derive the energy stored in a capacitor.", "When a capacitor is charged from 0 to Q, the potential at an intermediate charge q is\n\nV = q/C.\n\nSmall work done is\n\ndW = V dq = (q/C)dq.\n\nTotal energy is\n\nU = ∫₀^Q (q/C)dq\n  = Q²/(2C).\n\nUsing Q = CV,\n\nU = 1/2 CV².\n\nAlso,\n\nU = 1/2 QV.\n\nHence the energy stored in a capacitor is\n\nU = 1/2 CV²."], ["Theory", "State the properties of equipotential surfaces.", "An equipotential surface has the same electric potential at every point.\n\nNo work is done in moving a test charge along an equipotential surface because the potential difference is zero.\n\nElectric field is always perpendicular to an equipotential surface.\n\nTwo equipotential surfaces cannot intersect because a point cannot have two different potentials."], ["Theory", "Define capacitance.", "Capacitance is the charge stored per unit potential difference between the conductors.\n\nC = Q/V.\n\nIts SI unit is farad (F).\n\nFor a given capacitor, capacitance depends on geometry and the dielectric medium, not on the charge stored when the geometry and medium remain unchanged."], ["Numerical", "Calculate the capacitance and energy stored in a parallel-plate capacitor.", "Given:\nPlate area = A\nSeparation = d\nPotential difference = V.\n\nFirst calculate\n\nC = ε₀A/d\n\nfor vacuum.\n\nThen calculate energy using\n\nU = 1/2 CV².\n\nSubstitute all quantities in SI units and state C in farads and U in joules."], ["Diagram", "Draw a parallel-plate capacitor with dielectric.", "Draw two parallel conducting plates of area A separated by distance d. Mark charges +Q and −Q, electric field E between the plates, potential difference V and dielectric slab K if present."]]}, "9. Current Electricity": {"items": [["Derivation", "Derive the relation R = ρl/A using drift velocity.", "Let a conductor have length l and cross-sectional area A. Let n be the number density of free electrons and v_d their drift velocity.\n\nIn time t, electrons in length v_dt cross the section.\n\nNumber of electrons crossing is\n\nN = nAv_dt.\n\nCharge transported is\n\nQ = neAv_dt.\n\nTherefore,\n\nI = Q/t = neAv_d.\n\nThe electric field is related to drift velocity by v_d = eEτ/m.\n\nHence,\n\nI = neA(eEτ/m).\n\nUsing E = V/l,\n\nI = ne²AτV/(ml).\n\nTherefore,\n\nV/I = ml/(ne²Aτ).\n\nThus,\n\nR = ρl/A,\n\nwhere ρ = m/(ne²τ).\n\nHence resistance is directly proportional to length and inversely proportional to area."], ["Derivation", "Derive the balance condition of a Wheatstone bridge.", "In a balanced Wheatstone bridge, no current flows through the galvanometer.\n\nLet the four resistances be P, Q, R and S.\n\nAt balance, the potentials of the two galvanometer junctions are equal.\n\nTherefore, the potential drops in the two branches satisfy\n\nP/Q = R/S.\n\nHence,\n\nP/Q = R/S.\n\nThis is the Wheatstone bridge balance condition.\n\nIt is used to determine an unknown resistance accurately."], ["Derivation", "Derive the relation for drift velocity.", "The force on an electron in an electric field E is\n\nF = eE\n\nin magnitude.\n\nTherefore,\n\na = eE/m.\n\nIf τ is the mean relaxation time, the average drift velocity is\n\nv_d = aτ.\n\nHence,\n\nv_d = eEτ/m.\n\nUsing current density relation,\n\nI = neAv_d.\n\nTherefore,\n\nv_d = I/(neA).\n\nThus drift velocity is directly proportional to current and inversely proportional to charge-carrier density and cross-sectional area."], ["Derivation", "Explain a potentiometer method for comparing EMFs.", "A potentiometer uses the principle that potential drop along a uniform wire is proportional to length when a constant current flows.\n\nLet the potential gradient be k.\n\nFor a cell of EMF E, if the balance length is l,\n\nE = kl.\n\nFor two cells with EMFs E₁ and E₂ and balance lengths l₁ and l₂,\n\nE₁ = kl₁,\nE₂ = kl₂.\n\nDividing,\n\nE₁/E₂ = l₁/l₂.\n\nThus the ratio of EMFs is equal to the ratio of balance lengths."], ["Theory", "Distinguish between EMF and terminal potential difference.", "EMF is the energy supplied by the source per unit charge when the circuit is open. It is denoted by E.\n\nTerminal potential difference is the potential difference across the terminals when current is flowing. For a cell of internal resistance r delivering current I,\n\nV = E − Ir.\n\nThus terminal voltage is less than EMF when the cell is supplying current."], ["Theory", "State Ohm's law.", "At constant temperature and other physical conditions, the current through a conductor is directly proportional to the potential difference across it.\n\nV ∝ I.\n\nTherefore,\n\nV = IR,\n\nwhere R is the resistance of the conductor."], ["Numerical", "Find the resistance of a wire when resistivity, length and area are given.", "Given:\nResistivity = ρ\nLength = l\nCross-sectional area = A.\n\nFormula:\n\nR = ρl/A.\n\nSubstitute all values in SI units and calculate R in ohms."], ["Diagram", "Draw a Wheatstone bridge circuit.", "Draw four resistances P, Q, R and S in a diamond arrangement, connect a galvanometer across the middle diagonal and a cell across the other diagonal. Mark the balance condition P/Q = R/S."]]}, "10. Magnetic Fields due to Electric Current": {"items": [["Derivation", "State Biot-Savart law and derive the magnetic field due to a long straight current-carrying conductor.", "Biot-Savart law states that the magnetic field due to a current element Idl is\n\ndB = (μ₀/4π) I dl sinθ/r².\n\nFor a long straight conductor and a point at perpendicular distance r, integration over the complete wire gives\n\nB = μ₀I/(2πr).\n\nThe direction is given by the right-hand thumb rule.\n\nThus the magnetic field is directly proportional to current and inversely proportional to distance from the wire."], ["Derivation", "Use Ampere's law to obtain the field inside a long solenoid.", "Ampere's law states\n\n∮B·dl = μ₀I_enclosed.\n\nConsider a long solenoid with n turns per unit length carrying current I. Choose a rectangular Amperian loop.\n\nThe field outside is negligible and inside the solenoid it is approximately uniform.\n\nTherefore,\n\nBl = μ₀(nlI).\n\nHence,\n\nB = μ₀nI.\n\nFor a material core of permeability μ,\n\nB = μnI.\n\nThus the magnetic field inside a long solenoid is proportional to the turn density and current."], ["Derivation", "Derive the radius of the circular path of a charged particle moving perpendicular to a magnetic field.", "A charge q moving with speed v perpendicular to a magnetic field B experiences magnetic force\n\nF = qvB.\n\nThis force acts perpendicular to velocity and provides centripetal force:\n\nqvB = mv²/r.\n\nCancelling v,\n\nr = mv/(qB).\n\nTherefore the radius of the circular path is\n\nr = mv/(qB).\n\nThus a stronger magnetic field produces a smaller radius for the same particle."], ["Derivation", "Derive the torque on a current-carrying rectangular loop in a magnetic field.", "Consider a rectangular current-carrying loop of area A in a uniform magnetic field B.\n\nThe forces on opposite sides are equal and opposite, forming a couple. The torque on the loop is\n\nτ = BIA sinθ,\n\nwhere θ is the angle between the normal to the loop and the magnetic field.\n\nTherefore,\n\nτ = BIA sinθ.\n\nFor maximum torque, θ = 90°, giving\n\nτ_max = BIA.\n\nThis principle is used in moving-coil galvanometers and electric motors."], ["Theory", "Define Lorentz force.", "The Lorentz force is the total force experienced by a charged particle moving in electric and magnetic fields.\n\nF = q(E + v × B).\n\nIts magnitude for the magnetic part alone is\n\nF_B = qvB sinθ.\n\nThe magnetic force is perpendicular to the particle's velocity when the motion is perpendicular to the field."], ["Theory", "State Ampere's circuital law.", "Ampere's circuital law states that the line integral of magnetic field around a closed path equals μ₀ times the net current enclosed.\n\n∮B·dl = μ₀I_enclosed.\n\nIt is especially useful for highly symmetric current distributions such as long straight conductors, solenoids and toroids."], ["Numerical", "Find the radius of a charged particle moving perpendicular to a magnetic field.", "Given:\nMass = m\nCharge = q\nSpeed = v\nMagnetic field = B.\n\nFormula:\n\nr = mv/(qB).\n\nSubstitute SI values. The answer is obtained in metres."], ["Diagram", "Draw the motion of a charged particle in a uniform magnetic field.", "Draw a uniform magnetic field using parallel lines. Show a charged particle entering perpendicular to the field and moving in a circular path. Mark v, B, magnetic force F and radius r. Indicate the direction using the appropriate hand rule."]]}, "11. Magnetic Materials": {"items": [["Derivation", "Derive the relation μr = 1 + χ.", "Magnetization is related to magnetic field intensity by\n\nM = χH.\n\nThe magnetic flux density is\n\nB = μ₀(H + M).\n\nSubstitute M = χH:\n\nB = μ₀(H + χH)\n  = μ₀H(1 + χ).\n\nAlso,\n\nB = μH = μ₀μrH.\n\nTherefore,\n\nμ₀μrH = μ₀H(1 + χ).\n\nHence,\n\nμr = 1 + χ.\n\nThus relative permeability is related to magnetic susceptibility by μr = 1 + χ."], ["Derivation", "Derive the relation between the vertical and horizontal components of Earth's magnetic field.", "Let Earth's magnetic field have magnitude B and dip angle δ.\n\nResolve B into horizontal and vertical components.\n\nHorizontal component:\n\nB_H = B cosδ.\n\nVertical component:\n\nB_V = B sinδ.\n\nDividing,\n\nB_V/B_H = tanδ.\n\nTherefore,\n\ntanδ = B_V/B_H.\n\nAt the magnetic equator δ = 0°, so B_V = 0. At the magnetic poles δ = 90°, so B_H = 0."], ["Derivation", "Explain the hysteresis loop and its significance.", "When a ferromagnetic material is taken through a cycle of magnetization, magnetization does not follow the same path during increasing and decreasing magnetic field.\n\nThe closed curve obtained between B and H is called the hysteresis loop.\n\nImportant quantities are retentivity, the residual magnetism remaining when H becomes zero, and coercivity, the reverse field required to reduce magnetization to zero.\n\nA narrow loop is preferred for transformer cores because energy loss is small. A wide loop is useful for permanent magnets because retentivity and coercivity are high."], ["Derivation", "State and explain Curie's law.", "For a paramagnetic material at sufficiently high temperature,\n\nχ = C/T,\n\nwhere χ is magnetic susceptibility, C is Curie constant and T is absolute temperature.\n\nThus,\n\nχ ∝ 1/T.\n\nAs temperature increases, thermal agitation opposes alignment of magnetic dipoles, so susceptibility decreases.\n\nCurie's law explains the temperature dependence of paramagnetic susceptibility."], ["Theory", "Classify diamagnetic, paramagnetic and ferromagnetic materials.", "Diamagnetic materials have small negative susceptibility and are weakly repelled by a magnetic field.\n\nParamagnetic materials have small positive susceptibility and are weakly attracted.\n\nFerromagnetic materials have very large positive susceptibility and are strongly attracted. They can retain magnetization because of domain alignment.\n\nThe three classes therefore differ in magnetic response, susceptibility and domain behaviour."], ["Theory", "Define angle of dip.", "The angle of dip is the angle made by Earth's total magnetic field with the horizontal plane at a place.\n\nIt is denoted by δ.\n\nThe horizontal and vertical components are\n\nB_H = B cosδ,\nB_V = B sinδ.\n\nTherefore,\n\ntanδ = B_V/B_H."], ["Numerical", "Calculate the horizontal and vertical components of Earth's magnetic field.", "Given:\nEarth's field = B\nDip angle = δ.\n\nUse\n\nB_H = B cosδ\n\nand\n\nB_V = B sinδ.\n\nSubstitute the given values and state both components in tesla."], ["Diagram", "Draw the Earth's magnetic field components.", "Draw the total field B inclined at dip angle δ to the horizontal. Resolve it into B_H horizontally and B_V vertically. Label δ clearly and show B as the vector sum of the two components."]]}, "12. Electromagnetic Induction": {"items": [["Derivation", "State Faraday's laws and derive ε = −dΦ/dt.", "Faraday's first law states that an emf is induced in a circuit whenever the magnetic flux linked with the circuit changes.\n\nThe second law states that the magnitude of induced emf is equal to the rate of change of magnetic flux linkage.\n\nFor N turns,\n\nε = −N dΦ/dt.\n\nFor one turn,\n\nε = −dΦ/dt.\n\nThe negative sign represents Lenz's law: the induced emf opposes the change in flux that produces it."], ["Derivation", "Derive the motional emf of a straight conductor moving in a magnetic field.", "Consider a conductor of length l moving with speed v perpendicular to a uniform magnetic field B.\n\nA charge q inside the conductor experiences magnetic force\n\nF = qvB.\n\nThis separates charges and creates an electric field E. At equilibrium,\n\nqE = qvB,\n\nso\n\nE = vB.\n\nPotential difference across the conductor is\n\nε = El.\n\nTherefore,\n\nε = Blv.\n\nHence the motional emf is\n\nε = Blv."], ["Derivation", "Derive the emf equation of an AC generator.", "Consider a coil of N turns and area A rotating with angular speed ω in a uniform magnetic field B.\n\nMagnetic flux through the coil is\n\nΦ = NBA cosωt.\n\nAccording to Faraday's law,\n\nε = −dΦ/dt.\n\nTherefore,\n\nε = NBAω sinωt.\n\nIf ε₀ = NBAω,\n\nε = ε₀ sinωt.\n\nThus the generator produces sinusoidally varying emf."], ["Derivation", "Derive the energy stored in an inductor.", "When current in an inductor increases, an opposing emf is produced:\n\nε = L di/dt.\n\nThe external source must do work against this emf.\n\nSmall work done is\n\ndW = ε i dt.\n\nTherefore,\n\ndW = L(di/dt)i dt = Li di.\n\nIntegrating from zero current to I,\n\nU = ∫₀^I Li di\n\n= 1/2 LI².\n\nHence the energy stored in an inductor is\n\nU = 1/2 LI²."], ["Theory", "State Lenz's law and explain its relation to conservation of energy.", "Lenz's law states that the induced current always flows in such a direction that its magnetic effect opposes the change in magnetic flux responsible for the induction.\n\nThe opposition prevents energy from being created without external work. The mechanical work done in changing the flux is converted into electrical energy.\n\nThus Lenz's law is a direct consequence of conservation of energy."], ["Theory", "Define self-inductance.", "Self-inductance is the property of a coil by which a change in current through it induces an emf in the same coil.\n\nThe induced emf is\n\nε = −L di/dt.\n\nThe SI unit of self-inductance is henry (H)."], ["Numerical", "Calculate the induced emf when magnetic flux changes with time.", "Given:\nNumber of turns = N\nInitial flux = Φ₁\nFinal flux = Φ₂\nTime interval = Δt.\n\nUse\n\n|ε| = N|ΔΦ|/Δt\n\nwhere ΔΦ = Φ₂ − Φ₁.\n\nSubstitute the values and state the induced emf in volts."], ["Diagram", "Draw an AC generator.", "Draw a rectangular coil rotating between the poles of a magnet. Label magnetic field B, coil, axle, slip rings, brushes and external load. Show the direction of rotation and induced current."]]}, "13. AC Circuits": {"items": [["Derivation", "Derive the RMS value of an alternating current.", "Let\n\ni = I₀ sinωt.\n\nThe mean square value over one complete cycle is\n\nI_rms² = average of i².\n\nTherefore,\n\nI_rms² = I₀² average(sin²ωt).\n\nOver a complete cycle,\n\naverage(sin²ωt) = 1/2.\n\nHence,\n\nI_rms² = I₀²/2.\n\nTherefore,\n\nI_rms = I₀/√2.\n\nThus the RMS value of a sinusoidal current is 0.707 times its peak value."], ["Derivation", "Derive the impedance of a series LCR circuit.", "In a series LCR circuit, resistance is R, inductive reactance is X_L = ωL and capacitive reactance is X_C = 1/(ωC).\n\nThe net reactance is\n\nX = X_L − X_C.\n\nUsing the phasor diagram, the voltage across the resistor is perpendicular in phase relation to the net reactive voltage.\n\nTherefore,\n\nV² = (IR)² + [I(X_L − X_C)]².\n\nDividing by I²,\n\nZ² = R² + (X_L − X_C)².\n\nHence,\n\nZ = √[R² + (X_L − X_C)²].\n\nThis is the impedance of a series LCR circuit."], ["Derivation", "Derive the resonance frequency of a series LCR circuit.", "At resonance, the inductive and capacitive reactances are equal:\n\nX_L = X_C.\n\nTherefore,\n\nωL = 1/(ωC).\n\nMultiplying by ωC,\n\nω²LC = 1.\n\nHence,\n\nω₀ = 1/√(LC).\n\nSince ω₀ = 2πf₀,\n\nf₀ = 1/(2π√LC).\n\nThus the resonance frequency is\n\nf₀ = 1/(2π√LC)."], ["Derivation", "Derive the average power in an AC circuit.", "Let the voltage and current be\n\nv = V₀ sinωt\n\nand\n\ni = I₀ sin(ωt − φ).\n\nInstantaneous power is\n\np = vi.\n\nOn averaging over one complete cycle, the double-angle term averages to zero.\n\nTherefore,\n\nP = V_rms I_rms cosφ.\n\nThe quantity cosφ is called the power factor.\n\nFor a purely inductive or purely capacitive circuit, φ = 90°, so average power is zero. Such power is called wattless power."], ["Theory", "Define impedance.", "Impedance is the total opposition offered by an AC circuit to the flow of alternating current.\n\nFor a series LCR circuit,\n\nZ = √[R² + (X_L − X_C)²].\n\nIts SI unit is ohm.\n\nIt determines the current through the circuit according to\n\nI_rms = V_rms/Z."], ["Theory", "State the resonance condition in a series LCR circuit.", "Resonance occurs when\n\nX_L = X_C.\n\nTherefore,\n\nωL = 1/(ωC).\n\nAt resonance,\n\nω₀ = 1/√LC.\n\nThe impedance becomes minimum, current becomes maximum and the circuit behaves as purely resistive."], ["Numerical", "Calculate the resonant frequency of an LCR circuit.", "Given:\nInductance = L\nCapacitance = C.\n\nFormula:\n\nf₀ = 1/(2π√LC).\n\nSubstitute L and C in SI units and calculate the frequency in hertz."], ["Diagram", "Draw the phasor diagram for a series LCR circuit.", "Draw the current I as the reference vector. Draw V_R in phase with I, V_L leading I by 90° and V_C lagging I by 90°. Show the resultant voltage V and phase angle φ."]]}, "14. Dual Nature of Radiation & Matter": {"items": [["Derivation", "Derive Einstein's photoelectric equation.", "According to Einstein, light consists of photons. The energy of one photon is\n\nE = hν.\n\nWhen a photon strikes a metal surface, its energy is used partly to overcome the work function φ and the remaining energy appears as maximum kinetic energy of the emitted electron.\n\nTherefore,\n\nhν = φ + K_max.\n\nSince\n\nK_max = 1/2 mv_max²,\n\nwe get\n\nhν = φ + 1/2 mv_max².\n\nIf V₀ is the stopping potential,\n\nK_max = eV₀.\n\nHence,\n\nhν = φ + eV₀.\n\nThis is Einstein's photoelectric equation."], ["Derivation", "Derive the de Broglie wavelength.", "According to the photon relation,\n\np = E/c.\n\nSince E = hν and ν = c/λ,\n\np = h/λ.\n\nTherefore,\n\nλ = h/p.\n\nFor a particle of mass m moving with velocity v,\n\np = mv.\n\nHence,\n\nλ = h/(mv).\n\nFor an electron accelerated through potential V,\n\n1/2 mv² = eV,\n\nso\n\np = √(2meV).\n\nTherefore,\n\nλ = h/√(2meV)."], ["Derivation", "Explain the stopping-potential versus frequency relation.", "Einstein's equation is\n\nhν = φ + eV₀.\n\nRearranging,\n\nV₀ = (h/e)ν − φ/e.\n\nThus V₀ varies linearly with frequency ν.\n\nThe slope of the V₀ versus ν graph is\n\nh/e,\n\nand the frequency-axis intercept is the threshold frequency\n\nν₀ = φ/h.\n\nTherefore, photoelectric measurements can be used to determine Planck's constant and the work function."], ["Theory", "State the laws of the photoelectric effect.", "Photoelectric emission occurs only when incident frequency is at least the threshold frequency.\n\nFor frequency above threshold, the maximum kinetic energy of emitted electrons increases with frequency.\n\nFor fixed frequency above threshold, photoelectric current is proportional to intensity because higher intensity provides more photons.\n\nPhotoemission is essentially instantaneous when the frequency condition is satisfied."], ["Theory", "Why does the wave theory of light fail to explain the photoelectric effect?", "Classical wave theory predicts that increasing intensity should increase electron energy and that sufficient energy should eventually accumulate even below threshold frequency.\n\nExperimentally, there is a threshold frequency, electron energy depends on frequency rather than intensity, and emission is essentially instantaneous.\n\nThese observations are explained by the photon model, in which energy is transferred in discrete packets hν."], ["Numerical", "Calculate the maximum kinetic energy and stopping potential of photoelectrons.", "Given:\nFrequency = ν\nWork function = φ.\n\nUse\n\nK_max = hν − φ.\n\nThen,\n\nV₀ = K_max/e.\n\nEnsure that energy units are consistent before substitution. The final stopping potential is expressed in volts."], ["Diagram", "Draw the photoelectric effect experimental setup.", "Draw a photosensitive cathode, collector anode, monochromatic light source, variable potential supply and microammeter. Show incident photons, emitted electrons and stopping potential direction."]]}, "15. Structure of Atoms & Nuclei": {"items": [["Derivation", "Derive the radius of the nth Bohr orbit.", "For an electron moving in a circular orbit around a nucleus, Coulomb force provides centripetal force:\n\nmv²/r = (1/4πε₀)(Ze²/r²).\n\nBohr's quantization condition is\n\nmvr = nh/(2π).\n\nTherefore,\n\nv = nh/(2πmr).\n\nSubstitute this in the force equation and simplify.\n\nThe radius of the nth orbit is\n\nr_n = (ε₀h²/πme²)(n²/Z).\n\nThus,\n\nr_n ∝ n²/Z.\n\nFor hydrogen, r_n = a₀n²."], ["Derivation", "Derive the energy of an electron in the nth Bohr orbit.", "The kinetic energy of the electron is\n\nK = 1/2 mv².\n\nUsing the centripetal-force relation,\n\nmv²/r = (1/4πε₀)(Ze²/r²),\n\nwe obtain\n\nK = Ze²/(8πε₀r).\n\nPotential energy is\n\nU = −Ze²/(4πε₀r).\n\nTherefore total energy is\n\nE = K + U\n  = −Ze²/(8πε₀r).\n\nUsing the Bohr radius relation,\n\nE_n = −13.6 Z²/n² eV.\n\nHence the energy levels are quantized and negative for bound states."], ["Derivation", "Derive the radioactive decay law and half-life relation.", "The rate of radioactive decay is proportional to the number of undecayed nuclei:\n\n−dN/dt = λN.\n\nRearranging,\n\ndN/N = −λdt.\n\nIntegrating,\n\nlnN = −λt + constant.\n\nAt t = 0, N = N₀, so\n\nln(N/N₀) = −λt.\n\nTherefore,\n\nN = N₀e^(−λt).\n\nFor half-life, N = N₀/2:\n\n1/2 = e^(−λT₁/₂).\n\nTaking logarithms,\n\nT₁/₂ = ln2/λ.\n\nHence,\n\nT₁/₂ = 0.693/λ."], ["Derivation", "Explain mass defect and nuclear binding energy.", "The mass of a nucleus is less than the sum of the masses of its separated nucleons. The difference is called mass defect.\n\nIf the mass defect is Δm, the corresponding binding energy is\n\nBE = Δmc².\n\nThis energy is required to separate the nucleus completely into its constituent protons and neutrons.\n\nGreater binding energy per nucleon generally indicates greater nuclear stability. Binding energy is also released when a more tightly bound nucleus is formed."], ["Theory", "Define binding energy.", "Nuclear binding energy is the minimum energy required to separate a nucleus completely into its constituent protons and neutrons.\n\nIt is related to mass defect by\n\nBE = Δmc².\n\nThe binding energy per nucleon is a useful measure of nuclear stability."], ["Theory", "State the properties of alpha, beta and gamma radiations.", "Alpha particles are helium nuclei with charge +2e and relatively large mass. They have high ionizing power and low penetrating power.\n\nBeta particles are high-speed electrons or positrons. They have intermediate ionizing and penetrating power.\n\nGamma rays are high-frequency electromagnetic radiation with no charge and no rest mass. They have very high penetrating power and comparatively low ionizing power."], ["Numerical", "Calculate the half-life of a radioactive substance when its decay constant is known.", "Given:\nDecay constant = λ.\n\nFormula:\n\nT₁/₂ = 0.693/λ.\n\nSubstitute λ in s⁻¹ and calculate the half-life in seconds. Convert to other time units if required."], ["Diagram", "Draw the radioactive decay curve.", "Plot number of undecayed nuclei N on the vertical axis and time t on the horizontal axis. Draw an exponentially decreasing curve starting from N₀ at t = 0. Mark the half-life point where N = N₀/2."]]}, "16. Semiconductor Devices": {"items": [["Derivation", "Explain energy bands and classify solids as conductors, insulators and semiconductors.", "In an isolated atom, electrons occupy discrete energy levels. In a solid, interaction between a large number of atoms causes these levels to split into closely spaced energy bands.\n\nThe valence band contains valence electrons, while the conduction band is the band in which electrons can move freely and conduct current.\n\nIn conductors, the bands overlap or the conduction band is partially filled, so conduction is easy.\n\nIn insulators, the forbidden energy gap is large.\n\nIn semiconductors, the gap is small, so thermal energy can promote some electrons to the conduction band."], ["Derivation", "Explain the formation and working of a p-n junction.", "A p-n junction is formed by joining p-type and n-type semiconductor regions.\n\nElectrons from the n-side diffuse into the p-side, while holes diffuse in the opposite direction. Recombination near the junction leaves fixed ions and forms a depletion region.\n\nAn internal electric field and potential barrier are established.\n\nIn forward bias, the p-side is connected to positive potential and the n-side to negative potential. The barrier decreases and current increases strongly.\n\nIn reverse bias, the barrier increases and only a small reverse saturation current flows until breakdown."], ["Derivation", "Explain the working of a full-wave rectifier.", "A full-wave rectifier converts both half cycles of an AC input into pulsating DC output.\n\nDuring the positive half-cycle, one pair of diodes conducts and current passes through the load in a particular direction.\n\nDuring the negative half-cycle, the other diode pair conducts, but the current through the load remains in the same direction.\n\nThus both half cycles contribute to the output. The output frequency is twice the input frequency for a standard full-wave rectifier."], ["Derivation", "Explain a Zener diode voltage regulator.", "A Zener diode is operated in reverse bias in its breakdown region.\n\nWhen the input voltage changes, the Zener current changes significantly while the voltage across the diode remains approximately constant at the Zener voltage V_Z.\n\nA series resistor limits the current.\n\nTherefore, the load connected in parallel with the Zener diode receives an approximately constant output voltage.\n\nThis makes the Zener diode useful for voltage regulation."], ["Theory", "Distinguish between intrinsic and extrinsic semiconductors.", "An intrinsic semiconductor is a pure semiconductor in which charge carriers are generated thermally. Electron concentration equals hole concentration.\n\nAn extrinsic semiconductor is obtained by adding a controlled impurity through doping.\n\nPentavalent doping produces an n-type semiconductor with electrons as majority carriers. Trivalent doping produces a p-type semiconductor with holes as majority carriers."], ["Theory", "Explain AND, OR and NOT logic gates.", "An AND gate gives output 1 only when all inputs are 1.\n\nAn OR gate gives output 1 when at least one input is 1.\n\nA NOT gate gives the complement of its input: output 1 for input 0 and output 0 for input 1.\n\nThese gates form the basic building blocks of digital electronic circuits."], ["Numerical", "For a transistor, calculate collector current when base current and current gain β are given.", "Given:\nBase current = I_B\nCurrent gain = β.\n\nUse\n\nI_C = βI_B.\n\nSubstitute the values with current in amperes or milliamperes consistently. The final answer is the collector current."], ["Diagram", "Draw the V-I characteristics of a p-n junction diode.", "Plot current I on the vertical axis and voltage V on the horizontal axis. Show a small forward current below the knee voltage followed by a rapid increase, and a small reverse saturation current followed by a sharp increase at breakdown."]]}};

function showImportantList(){
  document.body.classList.add('importantMode');
  mode='important';
  document.body.classList.remove('examMode');
  $('examBanner').style.display='none';
  $('notes').style.display='none';
  $('chapterList').style.display='block';
  $('search').style.display='block';
  renderImportantList();
  setActive();
}

function renderImportantList(f=''){
  const L=$('chapterList');
  L.innerHTML='';
  Object.keys(importantData).forEach(c=>{
    if(c.toLowerCase().includes((f||'').toLowerCase())){
      const b=document.createElement('button');
      b.className='chapter-btn';
      b.innerText='⭐ '+c;
      b.onclick=()=>openImportant(c);
      L.appendChild(b);
    }
  });
}

function openImportant(c){
  const d=importantData[c];
  let h='<h2>⭐ '+c+' — Important Questions</h2>';
  h+='<p style="opacity:.75">Board-focused questions with detailed English answers.</p>';
  d.items.forEach((it,i)=>{
    h+='<div class="important-card"><span class="important-type">'+it[0].toUpperCase()+'</span><h4>Q'+(i+1)+'. '+it[1]+'</h4><div class="important-answer"><b>Answer:</b>\n'+it[2]+'</div></div>';
  });
  $('notesContent').innerHTML=h;
  $('chapterList').style.display='none';
  $('search').style.display='none';
  $('notes').style.display='block';
  scrollTo(0,0);
}

function renderList(f=''){const L=$('chapterList');L.innerHTML='';const keys=Object.keys(mode==='notes'?notesData:paper);keys.forEach(c=>{if(c.toLowerCase().includes(f.toLowerCase())){const b=document.createElement('button');b.className='chapter-btn';b.innerText=(mode==='notes'?'📖 ':'📄 ')+c;b.onclick=()=>mode==='notes'?openCh(c):startPaper(c);L.appendChild(b)}});if(!keys.length)L.innerHTML='<p style="text-align:center;opacity:.7">Kuch nahi mila.</p>'}
function openCh(c){$('notesContent').innerHTML='<h2>'+c+'</h2>'+notesData[c]+'<h3>📄 Is chapter ka Board Paper do</h3><button class="btn alt" onclick="startPaper(\''+c+'\')">Start Board Paper ➜</button>';$('chapterList').style.display='none';$('search').style.display='none';$('notes').style.display='block';scrollTo(0,0)}
function subQ(id,mk,q,a){return '<p><b>'+q+'</b> <span style="float:right;color:var(--acc2)">'+mk+' marks</span><br><span id="ans_'+id+'" style="display:none;color:var(--acc2)"><b>Ans:</b> '+a+'</span><br><button class="btn alt" onclick="toggleAns(\''+id+'\')">👁 Answer</button><button class="btn mk" onclick="setMark(\''+id+'\','+mk+',this)">✔ +'+mk+'</button><button class="btn red mk" onclick="setMark(\''+id+'\',0,this)">✘ 0</button></p>'}
function toggleAns(id){const el=$('ans_'+id);el.style.display=el.style.display==='none'?'inline':'none'}
function setMark(id,val,btn){paperMarks[id]=val;btn.parentNode.querySelectorAll('.mk').forEach(b=>b.style.outline='none');btn.style.outline='3px solid #fff';updateTotal()}
function updateTotal(){let t=0;for(const k in paperMarks)t+=paperMarks[k];const el=$('runTotal');if(el)el.textContent='✍️ Subjective marks: '+t}
function startPaper(c){paperMarks={};const P=paper[c];let h='<h2>📄 Board Paper — '+c+'</h2><p style="opacity:.8">Board pattern practice. MCQ auto-check; baaki khud likho, phir 👁 Answer dekho aur ✔/✘ se marks do.</p>';
h+='<div class="sec">SECTION A-1 : MCQs (1 mark each)</div>';
P.a1.forEach((q,i)=>{h+='<p><b>Q'+(i+1)+'.</b> '+q[0]+'<br>';q[1].forEach((o,j)=>{h+='<label><input type="radio" name="q'+i+'" value="'+j+'"> ('+String.fromCharCode(97+j)+') '+o+'</label>'});h+='</p>'});
h+='<div class="sec">SECTION A-2 : Very Short (1 mark each)</div>';
P.a2.forEach((q,i)=>{h+=subQ('a2_'+i,1,q[0],q[1])});

<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> The SI unit of angular velocity is:<br>(a) m/s (b) rad/s (c) m/s² (d) rad/s²<br><b>Ans:</b> (b) rad/s</p>

<p><b>Q3.</b> The direction of centripetal acceleration is:<br>(a) Along the tangent (b) Away from centre (c) Towards the centre (d) Perpendicular to plane<br><b>Ans:</b> (c) Towards the centre</p>
<p><b>Q4.</b> The equation τ = Iα is the rotational analogue of which linear equation?<br>(a) F = ma (b) p = mv (c) W = Fd (d) KE = ½mv²<br><b>Ans:</b> (a) F = ma</p>
<p><b>Q5.</b> The moment of inertia of a ring about its diameter is:<br>(a) MR² (b) MR²/2 (c) MR²/4 (d) 2MR²<br><b>Ans:</b> (b) MR²/2</p>
<p><b>Q6.</b> The moment of inertia of a uniform disc about its diameter is:<br>(a) MR²/4 (b) MR²/2 (c) ½MR² (d) MR²<br><b>Ans:</b> (a) MR²/4</p>
<p><b>Q7.</b> The radius of gyration of a solid sphere about its diameter is:<br>(a) R (b) √(2/5)·R (c) √(3/5)·R (d) √(½)·R<br><b>Ans:</b> (b) √(2/5)·R</p>
<p><b>Q8.</b> If the external torque acting on a body is zero, which quantity is conserved?<br>(a) Linear momentum (b) Kinetic energy (c) Angular velocity (d) Angular momentum<br><b>Ans:</b> (d) Angular momentum</p>
<p><b>Q9.</b> When a spinning dancer pulls her arms in, her angular velocity:<br>(a) Increases (b) Decreases (c) Remains same (d) Becomes zero<br><b>Ans:</b> (a) Increases</p>
<p><b>Q10.</b> In pure rolling motion, the velocity of the point of contact with the ground is:<br>(a) Maximum (b) Zero (c) Equal to v (d) 2v<br><b>Ans:</b> (b) Zero</p>
<p><b>Q11.</b> For a solid sphere rolling without slipping, the ratio of translational KE to total KE is:<br>(a) 2:5 (b) 2:7 (c) 5:7 (d) 7:10<br><b>Ans:</b> (c) 5:7</p>
<p><b>Q12.</b> The angle of banking of a curved road depends on:<br>(a) Mass of vehicle (b) Speed and radius (c) Friction only (d) Shape of vehicle<br><b>Ans:</b> (b) Speed and radius</p>
<p><b>Q13.</b> The minimum speed required at the top of a vertical circle of radius r is:<br>(a) √(2gr) (b) √(gr) (c) √(5gr) (d) √(3gr)<br><b>Ans:</b> (b) √(gr)</p>
<p><b>Q14.</b> The work done by the centripetal force on a body in circular motion is:<br>(a) Positive (b) Negative (c) Zero (d) Depends on speed<br><b>Ans:</b> (c) Zero</p>
<p><b>Q15.</b> In uniform circular motion, the angle between velocity and acceleration is:<br>(a) 0° (b) 45° (c) 90° (d) 180°<br><b>Ans:</b> (c) 90°</p>
<p><b>Q16.</b> The SI unit of angular acceleration is:<br>(a) rad/s (b) rad/s² (c) m/s² (d) rad·s<br><b>Ans:</b> (b) rad/s²</p>
<p><b>Q17.</b> If the radius of circular path is doubled while keeping speed constant, the centripetal force becomes:<br>(a) Double (b) Half (c) Four times (d) One-fourth<br><b>Ans:</b> (b) Half</p>
<p><b>Q18.</b> The moment of inertia of a solid cylinder about its own axis is:<br>(a) ½MR² (b) MR² (c) ¼MR² (d) ⅖MR²<br><b>Ans:</b> (a) ½MR²</p>
<p><b>Q19.</b> For a body to be in rotational equilibrium, the net torque acting on it must be:<br>(a) Maximum (b) Zero (c) Constant (d) Equal to Iω<br><b>Ans:</b> (b) Zero</p>
<p><b>Q20.</b> On a flat (unbanked) road, the centripetal force for a turning car is provided by:<br>(a) Gravity (b) Normal reaction (c) Friction (d) Air resistance<br><b>Ans:</b> (c) Friction</p>
<h3>✍️ SECTION A — Very Short Answers (1 Mark Each)</h3>
<p><b>Q1.</b> Define uniform circular motion. Give one example.<br><b>Ans:</b> Uniform circular motion is the motion of a particle along a circular path with constant speed. Example: Earth revolving around the Sun.</p>
<p><b>Q2.</b> State the SI unit and dimensional formula of torque.<br><b>Ans:</b> SI unit: Newton-metre (N·m). Dimensional formula: [M L² T⁻²].</p>
<p><b>Q3.</b> Write the relation between linear velocity and angular velocity.<br><b>Ans:</b> The relation is v = ωr, where v is linear velocity, ω is angular velocity, and r is the radius of the circular path.</p>
<p><b>Q4.</b> What is the moment of inertia of a thin ring about an axis passing through its centre and perpendicular to its plane?<br><b>Ans:</b> The moment of inertia is I = MR², where M is the mass and R is the radius of the ring.</p>
<p><b>Q5.</b> Define radius of gyration of a body about a given axis.<br><b>Ans:</b> Radius of gyration is the distance from the axis at which the entire mass of the body can be assumed to be concentrated so that its moment of inertia remains the same. It is defined by I = MK².</p>
<p><b>Q6.</b> State the condition for a body to be in rotational equilibrium.<br><b>Ans:</b> A body is in rotational equilibrium when the net external torque acting on it is zero, i.e., Στ = 0.</p>
<p><b>Q7.</b> Write the expression for centripetal force in terms of mass, velocity and radius.<br><b>Ans:</b> Centripetal force F = mv²/r = mω²r, where m is mass, v is linear velocity, r is radius, and ω is angular velocity.</p>
<p><b>Q8.</b> Is moment of inertia a vector or scalar quantity?<br><b>Ans:</b> Moment of inertia is a scalar quantity (more precisely, a tensor quantity in general).</p>
<p><b>Q9.</b> State the SI unit of angular acceleration.<br><b>Ans:</b> The SI unit of angular acceleration is radian per second squared (rad/s²).</p>
<p><b>Q10.</b> What is the moment of inertia of a hollow sphere about its diameter?<br><b>Ans:</b> The moment of inertia of a hollow sphere about its diameter is I = ⅔MR².</p>
<p><b>Q11.</b> What is the moment of inertia of a thin rod about an axis passing through one end and perpendicular to its length?<br><b>Ans:</b> The moment of inertia is I = ML²/3, where M is mass and L is length of the rod.</p>
<p><b>Q12.</b> Write the relation between angular velocity ω and time period T.<br><b>Ans:</b> The relation is ω = 2π/T, where ω is angular velocity and T is the time period of one revolution.</p>
<p><b>Q13.</b> State the SI unit of frequency.<br><b>Ans:</b> The SI unit of frequency is Hertz (Hz), where 1 Hz = 1 revolution per second.</p>
<p><b>Q14.</b> What is the radius of gyration of a uniform disc about an axis passing through its centre and perpendicular to its plane?<br><b>Ans:</b> The radius of gyration is K = √(½)·R = R/√2, where R is the radius of the disc.</p>
<p><b>Q15.</b> Write the dimensional formula of moment of inertia.<br><b>Ans:</b> The dimensional formula of moment of inertia is [M¹ L² T⁰], or simply [M L²].</p>
<h3>📘 SECTION B — Short Answers I (2 Marks Each)</h3>
<p><b>Q1.</b> Distinguish between centripetal force and centrifugal force.<br><b>Ans:</b> Centripetal force is a real force directed towards the centre of the circular path, required to keep a body in circular motion (e.g., tension in a string). Centrifugal force is a pseudo force that appears to act outward on a body only when observed from a rotating (non-inertial) frame of reference.</p>
<p><b>Q2.</b> State the theorem of parallel axes and explain its significance.<br><b>Ans:</b> The moment of inertia about any axis equals the moment of inertia about a parallel axis through the centre of mass plus Md². Mathematically, I = I_cm + Md². Applicable to all bodies.</p>
<p><b>Q3.</b> State the theorem of perpendicular axes and mention its limitation.<br><b>Ans:</b> For a plane lamina, Iz = Ix + Iy. Limitation: applies only to plane laminae (2D bodies), not 3D bodies.</p>
<p><b>Q4.</b> Explain why a cyclist bends inward while taking a turn on a curved road.<br><b>Ans:</b> The cyclist needs centripetal force from friction. Bending inward makes the resultant of friction and normal reaction pass through the centre of gravity, balancing torque and keeping him stable.</p>
<p><b>Q5.</b> Explain rolling motion and state the condition for pure rolling.<br><b>Ans:</b> Rolling = translation + rotation. For pure rolling, v = ωR. At the contact point, translational and rotational velocities cancel, so it is momentarily at rest.</p>
<p><b>Q6.</b> Why is a hollow shaft stronger than a solid shaft of the same mass and material?<br><b>Ans:</b> Mass is distributed farther from the axis, giving larger I. A larger I needs more torque to twist, so the hollow shaft is stronger.</p>
<p><b>Q7.</b> Define torque and angular momentum. State the relation between them.<br><b>Ans:</b> Torque τ = rF sinθ. Angular momentum L = Iω. Relation: τ = dL/dt. If τ = 0, L is constant.</p>
<p><b>Q8.</b> Explain why roads are banked at curves. Derive the angle of banking when friction is neglected.<br><b>Ans:</b> Banking provides centripetal force without relying on friction. N cosθ = mg and N sinθ = mv²/r. Dividing: tanθ = v²/rg.</p>
<p><b>Q9.</b> Define angular displacement, angular velocity and angular acceleration. Write their SI units.<br><b>Ans:</b> θ = angle swept (rad). ω = dθ/dt (rad/s). α = dω/dt (rad/s²).</p>
<p><b>Q10.</b> What is centripetal acceleration? Derive its expression.<br><b>Ans:</b> Acceleration towards the centre due to change in direction of velocity. For speed v in radius r: a = v²/r = ω²r.</p>
<p><b>Q11.</b> Explain why the work done by centripetal force is always zero.<br><b>Ans:</b> Force is perpendicular to displacement (90°), so W = Fd cos90° = 0.</p>
<p><b>Q12.</b> Distinguish between translational motion and rotational motion.<br><b>Ans:</b> Translation: all particles same displacement. Rotation: body turns about an axis; particles move in circles with same angular velocity.</p>
<p><b>Q13.</b> Define moment of inertia. State its SI unit and dimensional formula.<br><b>Ans:</b> I = Σmr², the rotational inertia. SI unit kg·m². Dimensions [M L²].</p>
<p><b>Q14.</b> What is the physical significance of radius of gyration?<br><b>Ans:</b> K is the distance of an equivalent point mass giving the same I (I = MK²). It shows how mass is distributed about the axis.</p>
<p><b>Q15.</b> State the principle of conservation of angular momentum.<br><b>Ans:</b> If no external torque acts, total angular momentum remains constant: L = Iω = constant.</p>
<h3>📗 SECTION C — Short Answers II (3 Marks Each)</h3>
<p><b>Q1.</b> Derive the expressions for the minimum velocities at the top and bottom of a vertical circle.<br><b>Ans:</b> At top: T + mg = mv²/r; min when T = 0 → v_top = √(gr). Energy conservation: ½mv²_bottom = ½mv²_top + mg(2r) → v_bottom = √(5gr).</p>
<p><b>Q2.</b> Derive tanθ = v²/rg for the angle of banking.<br><b>Ans:</b> N cosθ = mg and N sinθ = mv²/r. Dividing: tanθ = v²/rg. Depends on v and r, not mass.</p>
<p><b>Q3.</b> Derive the time period of a conical pendulum.<br><b>Ans:</b> T cosθ = mg, T sinθ = mω²r, r = L sinθ. Solving: T = 2π√(L cosθ/g). Depends on L and θ, not mass.</p>
<p><b>Q4.</b> Derive the acceleration of a body rolling down an inclined plane.<br><b>Ans:</b> Mg sinθ − f = Ma; fR = MK²(a/R). Substituting: a = g sinθ/(1 + K²/R²).</p>
<p><b>Q5.</b> State conservation of angular momentum with two examples.<br><b>Ans:</b> L = Iω constant if τ = 0. Examples: skater pulls arms (I↓, ω↑); diver tucks to spin faster.</p>
<p><b>Q6.</b> Show KE of rolling = ½Mv²(1 + K²/R²).<br><b>Ans:</b> KE = ½Mv² + ½Iω²; with I = MK² and ω = v/R, KE = ½Mv²(1 + K²/R²).</p>
<p><b>Q7.</b> Explain moment of inertia and radius of gyration. State factors affecting I.<br><b>Ans:</b> I = Σmr²; K from I = MK². Factors: mass, shape, distribution, axis position.</p>
<p><b>Q8.</b> Write the rotational kinematic equations and compare with linear ones.<br><b>Ans:</b> ω = ω₀ + αt; θ = ω₀t + ½αt²; ω² = ω₀² + 2αθ. (cf. v = v₀+at etc.)</p>
<p><b>Q9.</b> Find I of a ring and a disc about a diameter using theorems.<br><b>Ans:</b> Ring: I_diam = MR²/2. Disc: I_diam = MR²/4 (by perpendicular axes).</p>
<p><b>Q10.</b> Derive centripetal acceleration of a particle in UCM.<br><b>Ans:</b> Δv = vΔθ towards centre; a = Δv/Δt = v²/r = ω²r.</p>
<p><b>Q11.</b> Discuss banking with friction; derive maximum safe speed.<br><b>Ans:</b> v_max = √[rg(tanθ + μ)/(1 − μ tanθ)]. For μ = 0, v = √(rg tanθ).</p>
<p><b>Q12.</b> Find angular momentum of a particle moving in a straight line about a point off the line.<br><b>Ans:</b> L = mvr_⊥ where r_⊥ is perpendicular distance. Conserved since torque is zero.</p>
<p><b>Q13.</b> Derive KE of a rotating rigid body.<br><b>Ans:</b> KE = Σ½m_i r_i²ω² = ½(Σm_i r_i²)ω² = ½Iω².</p>
<p><b>Q14.</b> Compare sphere, disc, ring rolling down the same incline.<br><b>Ans:</b> a = g sinθ/(1+K²/R²): sphere (2/5) > disc (1/2) > ring (1). Sphere reaches first.</p>
<p><b>Q15.</b> Explain rolling friction and compare with sliding friction.<br><b>Ans:</b> Rolling friction from deformation at contact; much smaller than sliding friction. Applications: wheels, ball bearings.</p>
<h3>📕 SECTION D — Long Answers (4 Marks Each)</h3>
<p><b>Q1.</b> Discuss vertical circular motion; derive speeds and tensions.<br><b>Ans:</b> v_top = √(gr), v_bottom = √(5gr); T_bottom = 6mg, T_top = 0; difference 6mg (independent of speed/radius).</p>
<p><b>Q2.</b> Banking of roads with and without friction; advantages.<br><b>Ans:</b> Without: tanθ = v²/rg. With: v_max = √[rg(tanθ+μ)/(1−μtanθ)]. Advantages: less skidding, less tyre wear, safe speed independent of mass.</p>
<p><b>Q3.</b> Rolling down incline: derive acceleration, velocity at bottom, compare shapes.<br><b>Ans:</b> a = g sinθ/(1+K²/R²); v = √[2gh/(1+K²/R²)]; sphere first, disc second, ring last.</p>
<p><b>Q4.</b> State and prove parallel and perpendicular axes theorems; applications.<br><b>Ans:</b> Parallel: I = I_cm + Md². Perpendicular: Iz = Ix + Iy. Applications: ring dia = MR²/2, disc dia = MR²/4, rod end = ML²/3.</p>
<p><b>Q5.</b> Derive conical pendulum relations and time period; applications.<br><b>Ans:</b> tanθ = v²/rg; ω = √(g/(L cosθ)); T = 2π√(L cosθ/g). Applications: Watt's governor, rides.</p>
<p><b>Q6.</b> State and prove conservation of angular momentum with 3 examples.<br><b>Ans:</b> τ = dL/dt = 0 → L constant. Examples: skater, diver, collapsing star (pulsar).</p>
<p><b>Q7.</b> Physical significance of I; standard values; radius of gyration.<br><b>Ans:</b> I resists angular acceleration (τ = Iα). Ring MR², disc ½MR², sphere ⅖MR², rod ML²/12. K = √(I/M); sphere K = √(2/5)R ≈ 0.632R.</p>
<p><b>Q8.</b> Work-energy theorem in rotation; power and KE; applications.<br><b>Ans:</b> W = ∫τ dθ = Δ(½Iω²). P = τω. KE = ½Iω². Applications: flywheel, brakes, wind turbines, centrifuges.</p>
<h3>⚡ COMPLETE FORMULA SHEET</h3>
<p><b>Basic:</b> v = ωr | a = v²/r = ω²r | F = mv²/r = mω²r</p>
<p><b>Torque & L:</b> τ = rF sinθ = Iα | L = Iω = r × p | τ = dL/dt | W = ∫τ dθ | P = τω</p>
<p><b>Theorems:</b> Parallel: I = I_cm + Md² | Perpendicular: Iz = Ix + Iy</p>
<p><b>Banking:</b> tanθ = v²/rg | v_max = √[rg(tanθ + μ)/(1 − μ tanθ)]</p>
<p><b>Vertical circle:</b> v_top = √(gr) | v_bottom = √(5gr) | T_bottom − T_top = 6mg</p>
<p><b>Conical pendulum:</b> T = 2π√(L cosθ/g) | tanθ = v²/rg</p>
<p><b>Rolling:</b> v = ωR | KE = ½Mv²(1 + K²/R²) | a = g sinθ/(1 + K²/R²)</p>
<h3>📐 I & K VALUES (MEMORISE)</h3>
<p><b>Ring:</b> I_axis = MR² (K = R) | I_diam = MR²/2</p>
<p><b>Disc:</b> I_axis = ½MR² (K = √(½)R) | I_diam = MR²/4</p>
<p><b>Hollow sphere:</b> I = ⅔MR² (K = √(2/3)R)</p>
<p><b>Solid sphere:</b> I = ⅖MR² (K = √(2/5)R)</p>
<p><b>Rod (centre):</b> I = ML²/12 | <b>Rod (end):</b> I = ML²/3</p>
<p><b>Cylinder (axis):</b> I = ½MR²</p>

<h3>📝 SECTION A — MCQs (1 Mark Each)</h3>
<p><b>Q1.</b> The SI unit of pressure is:<br>(a) N (b) Pa (c) N/m (d) J<br><b>Ans:</b> (b) Pa</p>
<p><b>Q2.</b> The gauge pressure at depth h in a liquid of density ρ is:<br>(a) ρg (b) hρg (c) hρ (d) hρg + P_atm<br><b>Ans:</b> (b) hρg</p>
<p><b>Q3.</b> Pascal's law is applicable to:<br>(a) solids only (b) gases only (c) fluids at rest (d) all materials<br><b>Ans:</b> (c) fluids at rest</p>
<p><b>Q4.</b> A hydraulic lift works on the principle of:<br>(a) Archimedes (b) Pascal's law (c) Bernoulli (d) Stokes<br><b>Ans:</b> (b) Pascal's law</p>
